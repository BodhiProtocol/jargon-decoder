<style>

:root{
  --bg:#F8F3E9;--paper:#FFFFFF;--ink:#1C1B22;--muted:#6B6A75;--muted-2:#96949E;
  --line:#EAE1CD;--line-soft:#F0E9D8;--accent:#2E4D8A;--accent-deep:#1C2C50;
  --accent-soft:#E7ECF7;--ask:#D97A42;--ask-soft:#FBEDE2;--gold:#C99A3E;--gold-soft:#F7EFDD;
  --good:#3F8E5C;--good-soft:#E5F3EA;--bad:#C24A42;--bad-soft:#FAEAE8;
  --shadow:0 1px 2px rgba(28,27,34,.04), 0 16px 32px -18px rgba(28,27,34,.18);
  --radius-lg:22px;--radius-md:16px;--radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151726;--paper:#1E2135;--ink:#EFEEF6;--muted:#9C9CB0;--muted-2:#75758C;
    --line:#2E3149;--line-soft:#282B42;--accent:#7C97DD;--accent-deep:#101527;
    --accent-soft:#262C4A;--ask:#E8996A;--ask-soft:#332A26;--gold:#D9B463;--gold-soft:#332C1D;
    --good:#6FBF8C;--good-soft:#1E332A;--bad:#E2857D;--bad-soft:#332423;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#151726;--paper:#1E2135;--ink:#EFEEF6;--muted:#9C9CB0;--muted-2:#75758C;
  --line:#2E3149;--line-soft:#282B42;--accent:#7C97DD;--accent-deep:#101527;
  --accent-soft:#262C4A;--ask:#E8996A;--ask-soft:#332A26;--gold:#D9B463;--gold-soft:#332C1D;
  --good:#6FBF8C;--good-soft:#1E332A;--bad:#E2857D;--bad-soft:#332423;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#F8F3E9;--paper:#FFFFFF;--ink:#1C1B22;--muted:#6B6A75;--muted-2:#96949E;
  --line:#EAE1CD;--line-soft:#F0E9D8;--accent:#2E4D8A;--accent-deep:#1C2C50;
  --accent-soft:#E7ECF7;--ask:#D97A42;--ask-soft:#FBEDE2;--gold:#C99A3E;--gold-soft:#F7EFDD;
  --good:#3F8E5C;--good-soft:#E5F3EA;--bad:#C24A42;--bad-soft:#FAEAE8;
  --shadow:0 1px 2px rgba(28,27,34,.04), 0 16px 32px -18px rgba(28,27,34,.18);
}

*{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
html,body{background:var(--bg)}
body{color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{max-width:720px;margin:0 auto;padding:0 28px}
.col-wide{max-width:860px;margin:0 auto;padding:0 28px}

.progress-track{position:sticky;top:0;height:2px;background:var(--line-soft);z-index:50}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}

.topbar{position:sticky;top:2px;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:720px;margin:0 auto;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
.back-link{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer}
.back-link:hover{color:var(--ink)}
.back-link svg{width:15px;height:15px}
.topbar-meta{display:flex;align-items:center;gap:10px}
.read-time{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--muted-2)}
.read-time svg{width:13px;height:13px}
.icon-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease}
.icon-btn svg{width:14px;height:14px}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn[aria-pressed="true"]{background:var(--ask);border-color:var(--ask);color:#fff}

.hero{padding:56px 0 8px;text-align:left}
.cat-pill{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;padding:5px 12px;border-radius:999px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.05;margin-bottom:20px}
.hero .lede{font-family:'Fraunces',serif;font-style:italic;font-size:1.35rem;color:var(--muted);line-height:1.5;max-width:600px}

.section{padding:64px 0}
.section-inner{border-top:1px solid var(--line-soft);padding-top:56px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow svg{width:14px;height:14px;color:var(--gold)}
.section h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;line-height:1.2;margin-bottom:18px;text-wrap:balance}
.section .body-text{font-size:1.02rem;color:var(--muted);line-height:1.7;max-width:620px}

.analogy-illo{margin:28px 0 14px;border-radius:var(--radius-lg);overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px}
.analogy-illo svg{width:100%;height:auto;display:block}
.analogy-caption{font-size:.86rem;color:var(--muted-2);font-style:italic;margin-top:10px}

.demo-card{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px}
.demo-card .diag svg{width:100%;height:auto;display:block}
.diag .vs{font-size:10px;fill:var(--muted);font-family:'IBM Plex Sans',sans-serif}
.diag .vt{font-size:11px;font-weight:600;fill:var(--ink);font-family:'IBM Plex Sans',sans-serif}
.diag .vg{fill:var(--ask)}
.diag .vgt{font-size:11px;font-weight:600;fill:#fff;font-family:'IBM Plex Sans',sans-serif}
.diag text{font-family:'IBM Plex Sans',sans-serif}

.ob{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start}
.ob-side .side-lbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.ob-side.bids .side-lbl{color:var(--accent)}
.ob-side.asks .side-lbl{color:var(--ask)}
.ob-head{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted-2);margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
.ob-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:3px 6px;border-radius:6px;transition:background .3s ease}
.ob-row.flash{background:var(--good-soft)}
.ob-row .price{width:54px;font-weight:600}
.ob-side.bids .price{color:var(--accent)}
.ob-side.asks .price{color:var(--ask)}
.ob-row .qty{width:44px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ob-bar{height:9px;border-radius:3px;flex:1;transition:max-width .4s ease}
.ob-side.bids .ob-bar{background:var(--accent);margin-left:auto}
.ob-side.asks .ob-bar{background:var(--ask)}
.ob-mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:20px}
.ob-mid .spread-lbl{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.ob-mid .spread-val{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem}
.ob-mid hr{border:none;border-top:1px dashed var(--line);width:44px;margin:4px 0}
.ob-mid .ltp{font-family:'IBM Plex Mono',monospace;font-size:.76rem;font-weight:600;background:var(--accent-deep);color:#fff;border-radius:8px;padding:6px 12px;transition:background .3s ease}
.ob-mid .ltp.pulse{background:var(--good)}

.demo-controls{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:22px;border-top:1px dashed var(--line);flex-wrap:wrap}
.demo-btn{background:var(--accent-deep);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-size:.86rem;font-weight:600;cursor:pointer;transition:opacity .2s ease}
.demo-btn:hover{opacity:.85}
.demo-btn:disabled{opacity:.4;cursor:not-allowed}
.demo-btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.demo-log{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--good);min-height:1.2em}
.demo-caption{margin-top:16px;font-size:.86rem;color:var(--muted-2);font-style:italic}

.steps{margin-top:28px;display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:18px;position:relative;padding-bottom:32px}
.step:last-child{padding-bottom:0}
.step-num{width:36px;height:36px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:17.5px;top:36px;bottom:0;width:1px;background:var(--line)}
.step-body{padding-top:6px}
.step-body p{font-size:.94rem;color:var(--ink)}
.step-body .callout{display:inline-block;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600;background:var(--gold-soft);color:var(--gold);padding:4px 11px;border-radius:8px}

.mistakes{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.mistake{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mrow .mi{width:22px;height:22px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mrow.think .mi{background:var(--bad-soft);color:var(--bad)}
.mrow.reality .mi{background:var(--good-soft);color:var(--good)}
.mrow .mi svg{width:12px;height:12px}
.mrow .mlbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.mrow.think .mlbl{color:var(--bad)}
.mrow.reality .mlbl{color:var(--good)}
.mrow p{font-size:.92rem;color:var(--ink)}
.mrow.think p{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1px;opacity:.85}

.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:26px}
.related-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:18px 20px;transition:transform .2s ease,border-color .2s ease;cursor:pointer;display:block}
.related-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.related-card h4{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;margin-bottom:6px}
.related-card p{font-size:.82rem;color:var(--muted);line-height:1.5}

.quiz-card{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:30px}
.quiz-q{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem;margin-bottom:20px;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;font-size:.94rem;color:var(--ink);cursor:pointer;transition:all .18s ease;display:flex;justify-content:space-between;align-items:center}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt .res-icon{width:18px;height:18px;flex-shrink:0;display:none}
.quiz-opt .res-icon svg{width:100%;height:100%}
.quiz-card.answered .quiz-opt{cursor:default;pointer-events:none}
.quiz-card.answered .quiz-opt:not(.correct):not(.picked){opacity:.5}
.quiz-card.answered .quiz-opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.quiz-card.answered .quiz-opt.correct .res-icon{display:block;color:var(--good)}
.quiz-card.answered .quiz-opt.picked:not(.correct){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.quiz-card.answered .quiz-opt.picked:not(.correct) .res-icon{display:block;color:var(--bad)}
.quiz-feedback{display:none;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:.92rem;color:var(--muted);line-height:1.6}
.quiz-card.answered .quiz-feedback{display:block}
.quiz-retry{display:none;margin-top:14px;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
.quiz-card.answered .quiz-retry{display:inline-block}
.quiz-retry:hover{border-color:var(--accent);color:var(--accent)}

.path-strip{padding:40px 0 0;border-top:1px solid var(--line-soft)}
.path-track{display:flex;align-items:center;gap:5px;overflow-x:auto;padding-bottom:6px}
.path-dot{width:7px;height:7px;border-radius:999px;background:var(--line);flex-shrink:0;cursor:pointer;border:none;padding:0}
.path-dot.active{background:var(--accent);width:20px;border-radius:999px}
.path-label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted-2);margin-top:10px;letter-spacing:.04em}

.next-card{margin:24px 0 70px;display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--accent-deep);color:#fff;border-radius:var(--radius-lg);padding:30px 34px;cursor:pointer;transition:opacity .2s ease;border:none;width:100%}
.next-card:hover{opacity:.92}
.next-card .nc-lbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#B9C6E8;margin-bottom:8px;text-align:left}
.next-card h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.7rem;text-align:left}
.next-card .nc-arrow{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next-card .nc-arrow svg{width:20px;height:20px}

@media (max-width:640px){
  .col,.col-wide,.topbar-inner{padding:0 20px}
  .ob{grid-template-columns:1fr}
  .ob-mid{padding-top:8px;flex-direction:row;justify-content:space-around}
  .ob-mid hr{display:none}
}
</style>
</head>

<script>
/* ===================== DATA ===================== */
const CATS = {Lifecycle:{color:'#3B66C7',tint:'#E9EEFB'}, "Clearing & Settlement":{color:'#7F63C4',tint:'#F0ECFA'}, Instruments:{color:'#2F9E8F',tint:'#E4F5F2'}, "Risk & Compliance":{color:'#DD7A40',tint:'#FBEDE2'}, "Market Structure":{color:'#3FA66B',tint:'#E6F5EC'}, Technology:{color:'#4497C2',tint:'#E6F1F8'}};

const CORE = {
  "Order Book": {p:"The exchange's live list of everyone waiting to buy or sell, and at what price.", m:"Buy orders (bids) on one side, sell orders (asks) on the other. Where they meet, trades happen.", c:"Lifecycle"},
  "Limit Order": {p:"\"Buy it — but only at my price or better.\"", m:"You control the price, not the timing. It may never execute if the market doesn't come to you.", c:"Lifecycle"},
  "Market Order": {p:"\"Buy it now, whatever the price.\"", m:"You control the timing, not the price. Fast, but you accept whatever the market offers.", c:"Lifecycle"},
  "Execution": {p:"The instant a buyer and seller are matched. Intention becomes transaction.", m:"Done by the exchange's matching engine, usually in microseconds, by price-time priority.", c:"Lifecycle"},
  "Allocation": {p:"Splitting one big institutional trade across the many client accounts it was really for.", m:"A fund manager buys 1 lakh shares in one order, then allocates them across dozens of funds.", c:"Lifecycle"},
  "Confirmation": {p:"Both sides comparing notes: \"Did we just agree to the same trade?\"", m:"Price, quantity, security, settlement date — all matched before money moves. Mismatches become breaks.", c:"Lifecycle"},
  "Trade Enrichment": {p:"Adding everything the raw trade forgot: fees, taxes, accounts, settlement instructions.", m:"The matching engine records the bare minimum. Downstream systems need the full story.", c:"Lifecycle"},

  "Record Date": {p:"The day the company checks its shareholder list to decide who gets the dividend.", m:"Own it on record date, you're paid. The ex-date, just before, is when the stock trades without that right.", c:"Lifecycle"},
  "Ex-Date": {p:"Buy on or after this date, and the upcoming dividend is not yours.", m:"The price usually drops by roughly the dividend amount that morning. No free lunch.", c:"Lifecycle"},

  "Demat": {p:"Your shares as electronic entries instead of paper certificates.", m:"Held at a depository (NSDL or CDSL in India) via your demat account. No paper, no forgery, no loss.", c:"Lifecycle"},
  "Novation": {p:"The clearing house steps into the middle: it becomes the buyer to every seller and the seller to every buyer.", m:"You no longer face the stranger you traded with — you face the CCP. Counterparty risk, absorbed.", c:"Clearing & Settlement"},
  "CCP": {p:"Central Counterparty — the institution that guarantees both sides of every trade.", m:"NSE Clearing in India. If a member defaults, the CCP still delivers. Margins and default funds make that promise real.", c:"Clearing & Settlement"},
  "Netting": {p:"Cancelling offsetting obligations so only the difference moves.", m:"Bought 500, sold 300 of the same stock the same day? Settle 200. Less movement, less risk, less cost.", c:"Clearing & Settlement"},
  "Margin": {p:"A good-faith deposit the clearing house holds in case you can't pay up.", m:"Collected upfront and adjusted daily as prices move. The market's way of saying: trust, but collateralise.", c:"Clearing & Settlement"},
  "Mark-to-Market": {p:"Revaluing your positions at today's price, not the price you paid.", m:"Gains and losses are recognised daily, and margin calls follow the losses. Reality, applied every evening.", c:"Clearing & Settlement"},
  "DvP": {p:"Delivery versus Payment — shares move if and only if money moves. Simultaneously.", m:"Neither side can be left holding nothing. The single most important safeguard in settlement.", c:"Clearing & Settlement"},
  "T+1": {p:"Trade today, settle tomorrow. T is trade date; +1 is one business day.", m:"India runs T+1 for equities — among the fastest settlement cycles in the world. The US followed in 2024.", c:"Clearing & Settlement"},
  "Settlement": {p:"The finale: securities land in the buyer's account, money lands in the seller's.", m:"Until settlement, a trade is a promise. After it, an immutable fact.", c:"Clearing & Settlement"},
  "Custodian": {p:"A bank that safekeeps securities for institutions and handles the plumbing of settlement.", m:"Foreign investors in India can't hold assets directly — their custodian does, and settles on their behalf.", c:"Clearing & Settlement"},
  "Depository": {p:"The vault where all demat securities in a market actually live, as electronic records.", m:"NSDL and CDSL in India. Your broker shows you the balance; the depository is the truth.", c:"Clearing & Settlement"},
  "Haircut": {p:"The discount applied to collateral value, just in case its price falls.", m:"Pledge ₹100 of shares, get credit for ₹80. The 20% haircut is the lender's cushion.", c:"Clearing & Settlement"},
  "Buy-in": {p:"You failed to deliver, so the system buys the shares elsewhere — and hands you the bill.", m:"The market's enforcement mechanism. Failure has a price, and it's yours.", c:"Clearing & Settlement"},
  "Bilateral": {p:"A trade or agreement made directly between two counterparties, with no clearing house standing in between.", m:"The opposite of a novated, CCP-cleared trade — more flexible, but you're carrying the counterparty risk yourself.", c:"Clearing & Settlement"},
  "Equity": {p:"A slice of ownership in a company, with a claim on its future.", m:"Shareholders are paid last but own the upside. Voting rights, dividends, and volatility included.", c:"Instruments"},
  "Bond": {p:"A loan you give, packaged as a security. The issuer promises interest and repayment.", m:"Governments and companies borrow this way. Safer than equity, usually — but a promise, not a guarantee.", c:"Instruments"},
  "Coupon": {p:"The interest a bond pays, named for the paper coupons investors once clipped.", m:"A 7% coupon on ₹1,000 face value pays ₹70 a year, rain or shine, until maturity.", c:"Instruments"},
  "Yield": {p:"What a bond actually earns you at today's price — not the coupon printed on it.", m:"Prices fall, yields rise. The seesaw at the heart of every fixed income market.", c:"Instruments"},
  "Derivative": {p:"A contract whose value is borrowed from something else — a stock, an index, a commodity.", m:"Futures and options are the famous ones. Tools for hedging risk, or for taking it.", c:"Instruments"},
  "Future": {p:"A binding promise to buy or sell something at a set price on a set date.", m:"Both sides are locked in. Standardised, exchange-traded, margined daily.", c:"Instruments"},
  "Option": {p:"The right — but not the obligation — to buy or sell at a set price.", m:"Calls to buy, puts to sell. You pay a premium for the privilege of walking away.", c:"Instruments"},
  "Strike Price": {p:"The pre-agreed price at which an option lets you buy or sell.", m:"Where the strike sits relative to the market price decides whether your option is worth anything.", c:"Instruments"},
  "Premium": {p:"The price of an option — what you pay for the right to choose later.", m:"The seller keeps it no matter what. Time and volatility make it bigger; expiry makes it zero.", c:"Instruments"},
  "Underlying": {p:"The real thing a derivative's value hangs from.", m:"For a Nifty future, the Nifty 50 index. No underlying, no derivative.", c:"Instruments"},
  "ETF": {p:"A fund that trades like a stock — one purchase, an entire basket.", m:"Buy the whole Nifty in a single click. Low cost, live pricing, instant diversification.", c:"Instruments"},
  "NAV": {p:"Net Asset Value — what one unit of a mutual fund is truly worth today.", m:"Total assets minus liabilities, divided by units. Calculated daily after markets close.", c:"Instruments"},
  "Face Value": {p:"The nominal value printed on a security — the number promises are measured against.", m:"A bond repays face value at maturity. A stock split changes face value, not your wealth.", c:"Instruments"},
  "Mutual Fund": {p:"A basket of investments professionally managed, bought with one lump sum or a monthly SIP.", m:"You own units, not the underlying stocks directly. The fund manager decides what's inside; NAV decides what your slice is worth.", c:"Instruments"},
  "Preference Shares": {p:"Shares that are paid before equity holders, but usually can't vote on how the company is run.", m:"A hybrid: fixed-ish dividends like a bond, ownership like a stock, but without a say in the boardroom.", c:"Instruments"},
  "Convertible Bond": {p:"A bond that can turn into shares later, if the stock price makes that worthwhile.", m:"Investors get a bond's safety now and an option on equity upside later — the issuer borrows cheaper because of that option.", c:"Instruments"},
  "REIT": {p:"A fund that lets you own a slice of rent-generating real estate without ever owning a building.", m:"Real Estate Investment Trust — trades like a stock, and pays out most of its rental income as dividends by law.", c:"Instruments"},
  "ADR/GDR": {p:"How a company from one country lists its shares for investors in another, without a second IPO.", m:"American Depositary Receipts trade in the US, Global Depositary Receipts trade internationally — both represent shares held in trust back home.", c:"Instruments"},
  "Market Capitalization": {p:"The total value of a company's shares — share price multiplied by shares outstanding.", m:"Used to bucket companies as large-cap, mid-cap, or small-cap. It's the market's opinion of size, not a balance sheet fact.", c:"Instruments"},
  "P/E Ratio": {p:"How many years of current earnings it would take to pay back today's share price.", m:"Price divided by earnings per share. A high P/E means the market is pricing in growth — or overpaying for it.", c:"Instruments"},
  "Index Fund": {p:"A fund that doesn't try to beat the market — it just buys the market, in the same proportions as the index.", m:"Lower fees than an actively managed fund, because there's no manager trying to pick winners. Track the Nifty 50, and that's exactly what you get.", c:"Instruments"},
  "Debenture": {p:"A bond by another name — a company's promise to repay a loan, usually unsecured against any specific asset.", m:"In India, 'debenture' and 'corporate bond' are used almost interchangeably. Convertible debentures can later turn into shares.", c:"Instruments"},
  "Maturity": {p:"The date a bond's life ends — the issuer repays the face value and the debt is closed.", m:"Short-term, medium-term, long-term — maturity length shapes both the risk and the yield an investor demands.", c:"Instruments"},
  "Zero-Coupon Bond": {p:"A bond that pays no interest along the way — you just buy it cheap and collect full face value at maturity.", m:"The discount to face value is the entire return, paid out as one lump sum at maturity instead of periodic coupons.", c:"Instruments"},
  "Callable Bond": {p:"A bond the issuer can repay early, on their terms, not yours.", m:"Usually called back when interest rates fall — the issuer refinances cheaper, and you're left reinvesting at a worse rate.", c:"Instruments"},
  "Credit Rating": {p:"A letter grade — AAA down to junk — telling you how likely the issuer is to actually pay you back.", m:"Assigned by agencies like CRISIL or Moody's. Higher rating, lower yield — safety and return trade off against each other.", c:"Instruments"},
  "Hedge Fund": {p:"A pooled investment fund for wealthy or institutional investors, free to use strategies mutual funds usually can't.", m:"Shorting, leverage, derivatives, concentrated bets — less regulated, higher fees, and a much wider range of outcomes.", c:"Instruments"},
  "Green Bonds": {p:"Bonds where the money raised is earmarked specifically for environmental or sustainability projects.", m:"Same mechanics as any bond — coupon, maturity, credit rating — just with a legally tied purpose for the proceeds.", c:"Instruments"},
  "Stock Buyback": {p:"A company using its own cash to repurchase its own shares from the market.", m:"Fewer shares outstanding means each remaining share owns a bigger slice of the company — a direct alternative to paying dividends.", c:"Instruments"},
  "Stock Split": {p:"A company divides each existing share into several, cheaper ones — your total holding's value doesn't change.", m:"Own 1 share worth ₹1,000? After a 5-for-1 split, you own 5 shares worth ₹200 each. Same pie, more slices.", c:"Instruments"},
  "Reverse Stock Split": {p:"The opposite of a split — several existing shares get combined into fewer, pricier ones.", m:"Often done to avoid an embarrassingly low share price, or to stay listed above an exchange's minimum price rule.", c:"Instruments"},
  "KYC": {p:"Know Your Customer — proving people are who they claim before they touch the market.", m:"Identity, address, and risk profile, verified. The first gate every investor passes through.", c:"Risk & Compliance"},
  "AML": {p:"Anti-Money Laundering — making sure the market isn't a washing machine for dirty money.", m:"Systems watch for suspicious patterns and report them. A pillar of every fraud programme.", c:"Risk & Compliance"},
  "Surveillance": {p:"Watching every trade for patterns that shouldn't exist.", m:"Spoofing, layering, pump-and-dump — algorithms hunt algorithms. Alerts land on human desks for judgment.", c:"Risk & Compliance"},
  "Front Running": {p:"Trading ahead of a client's big order because you saw it coming. Illegal.", m:"Knowledge of order flow is a trust, not an edge. Surveillance systems exist to catch exactly this.", c:"Risk & Compliance"},
  "Insider Trading": {p:"Trading on material information the public doesn't have yet. Also illegal.", m:"The market's fairness depends on everyone facing the same information at the same time.", c:"Risk & Compliance"},
  "Wash Trade": {p:"Selling to yourself to fake volume and paint a false picture of demand.", m:"No real change in ownership, no real risk — just manufactured activity. A classic manipulation flag.", c:"Risk & Compliance"},
  "Circuit Breaker": {p:"An automatic pause when prices move too far, too fast.", m:"Markets halt so panic can cool. India halts trading at 10%, 15%, and 20% index moves.", c:"Risk & Compliance"},
  "Basis Point": {p:"One hundredth of one percent. The market's smallest unit of seriousness.", m:"100 bps = 1%. When billions move, 0.01% is real money — so it earned its own name.", c:"Risk & Compliance"},
  "VaR": {p:"Value at Risk — \"how much could we lose on a bad day, with 99% confidence?\"", m:"One number summarising portfolio risk. Useful, famous, and famously silent about the worst 1%.", c:"Risk & Compliance"},
  "Collateral": {p:"Assets pledged as a promise: \"if I fail, take this.\"", m:"Cash, government bonds, blue-chip shares. The lubricant of trust between institutions.", c:"Risk & Compliance"},
  "Liquidity": {p:"How easily you can trade without moving the price against yourself.", m:"Deep markets absorb big orders quietly. Illiquid ones punish urgency.", c:"Risk & Compliance"},
  "Slippage": {p:"The gap between the price you expected and the price you got.", m:"You clicked at 100, filled at 100.30. In fast or thin markets, slippage is the silent fee.", c:"Risk & Compliance"},
  "Bid-Ask Spread": {p:"The gap between the best buying price and the best selling price.", m:"Tight spreads mean healthy liquidity. Wide spreads mean you pay just to enter.", c:"Risk & Compliance"},
  "Counterparty": {p:"The other side of your trade — whoever's on the hook to deliver what you're owed.", m:"Every trade has one. The question that matters: can you trust them to actually show up on settlement day?", c:"Risk & Compliance"},
  "Counterparty Risk": {p:"The risk that the person on the other side of your trade simply doesn't pay up.", m:"The entire reason clearing houses, margin, and collateral exist — to make this risk someone else's problem.", c:"Risk & Compliance"},
  "Default": {p:"A counterparty fails to deliver the cash or the securities they owe.", m:"Triggers the safety net: margin gets seized, the default fund kicks in, and the CCP still makes good on the trade.", c:"Risk & Compliance"},
  "Exposure": {p:"How much you'd actually lose, right now, if a specific counterparty defaulted.", m:"Recalculated constantly as prices move. Risk teams watch exposure the way pilots watch altitude.", c:"Risk & Compliance"},
  "Short Selling": {p:"Selling shares you've borrowed, betting the price falls so you can buy them back cheaper and return them.", m:"Profit is capped at 100% (the price can only fall to zero) but losses are theoretically unlimited (the price can keep rising).", c:"Risk & Compliance"},
  "Margin Call": {p:"Your broker demanding you deposit more money, right now, because your leveraged position has moved against you.", m:"Ignore it and the broker force-sells your position to cover the shortfall — often at the worst possible moment.", c:"Risk & Compliance"},
  "Black Swan Event": {p:"A rare, unpredictable shock that nobody's models saw coming — and that changes everything once it lands.", m:"2008's financial crisis, a pandemic — by definition, you can't predict the next one, only prepare for the fact that one will come.", c:"Risk & Compliance"},
  "Buy-side": {p:"The investors — funds, insurers, pensions — who buy securities to grow money they manage.", m:"Mutual funds, hedge funds, sovereign funds. They generate the orders; the sell-side executes them.", c:"Market Structure"},
  "Sell-side": {p:"The brokers and investment banks who make markets, execute orders, and sell research.", m:"They sit between investors and exchanges. Their product is access, execution, and advice.", c:"Market Structure"},
  "Market Maker": {p:"A firm that quotes both buy and sell prices all day, so there's always someone to trade with.", m:"They earn the spread in exchange for providing liquidity. The market's shock absorbers.", c:"Market Structure"},
  "Broker": {p:"Your licensed doorway to the exchange. You can't walk onto NSE yourself.", m:"Executes your orders, holds your margin, answers to the regulator for your conduct.", c:"Market Structure"},
  "OTC": {p:"Over-The-Counter — trades negotiated directly between two parties, off the exchange.", m:"Flexible and private, but without the exchange's transparency or the CCP's guarantee.", c:"Market Structure"},
  "Exchange": {p:"The regulated arena where orders meet, prices form, and everyone sees the same numbers.", m:"NSE and BSE in India. Transparency, rules, and a matching engine at the core.", c:"Market Structure"},
  "Prime Broker": {p:"A one-stop bank for hedge funds: custody, lending, leverage, and settlement under one roof.", m:"The fund trades everywhere but clears through its prime. Convenience, concentrated.", c:"Market Structure"},

  "Algorithmic Trading": {p:"Letting code decide when, how, and how fast to buy or sell — no finger on the button.", m:"From simple rules to complex models, algos now execute the majority of volume on most major exchanges.", c:"Market Structure"},
  "HFT": {p:"Algorithmic trading turned up to the extreme — positions held for fractions of a second, profit measured in fractions of a cent.", m:"High-Frequency Trading — wins are made in microseconds and enormous volume, not conviction. Speed itself is the edge.", c:"Market Structure"},
  "Depository Participant": {p:"Your actual point of contact for holding shares electronically — usually your broker or bank, acting as an agent of the depository.", m:"NSDL and CDSL are the depositories; your DP is the retail-facing counter that opens and manages your demat account.", c:"Market Structure"},
  "Foreign Portfolio Investor": {p:"An overseas investor who buys into Indian markets without taking a controlling stake in any company.", m:"Registered and regulated by SEBI as an FPI; their custodian handles settlement since they don't hold assets directly.", c:"Market Structure"},
  "Retail Investor": {p:"You, most likely — an individual investing personal money, not managing someone else's.", m:"Smaller order sizes, no special market access, but collectively retail investors move real volume in markets like India's.", c:"Market Structure"},
  "Institutional Investor": {p:"A professional managing large pools of other people's money — pension funds, insurers, mutual funds.", m:"Bigger orders, more market influence, and usually access that individual retail investors don't get.", c:"Market Structure"},
  "Proprietary Trading": {p:"A firm trading with its own money for its own profit — not on behalf of any client.", m:"Also called \"prop trading.\" The firm keeps all the gains and eats all the losses itself.", c:"Market Structure"},
  "Free Float": {p:"The portion of a company's shares actually available to trade — excluding what promoters and insiders hold tightly.", m:"Most major indices, including Nifty and Sensex, weight companies by free float, not total market cap.", c:"Market Structure"},
  "ISDA": {p:"The standard legal contract that governs most over-the-counter derivative trades between two counterparties.", m:"International Swaps and Derivatives Association. One master agreement, signed once, covers every derivative trade you do with that counterparty afterward.", c:"Market Structure"},
  "Short Squeeze": {p:"When a stock rockets upward because short-sellers are forced to buy it back to escape their losses.", m:"The more it rises, the more shorts are forced to cover, which pushes it up further. GameStop's 2021 spike is the textbook example.", c:"Market Structure"},
  "Activist Investor": {p:"An investor who buys a stake in a company specifically to force change — new management, a sale, a strategy shift.", m:"Not a passive shareholder. They show up, make noise, and sometimes win board seats to get their way.", c:"Market Structure"},
  "S&P 500": {p:"An index tracking 500 of the largest publicly traded companies in the US, weighted by size.", m:"The single most-quoted benchmark for 'how is the US stock market doing' in the world.", c:"Market Structure"},
  "Dow Jones": {p:"An index of 30 major US companies, weighted by their share price rather than their size.", m:"Older and simpler than the S&P 500, but that price-weighting quirk makes it a less accurate market gauge.", c:"Market Structure"},
  "FIX Protocol": {p:"The common language trading systems speak to each other. Since 1992.", m:"Orders, executions, cancellations — all standardised messages. Tag 35=D means \"new order\". Every OMS speaks it.", c:"Technology"},
  "OMS": {p:"Order Management System — where orders are born, validated, tracked, and audited.", m:"The buy-side's book of record for every order's life. The BA's most-visited system.", c:"Technology"},
  "EMS": {p:"Execution Management System — the trader's cockpit for working orders in the market.", m:"Real-time data, algos, smart routing. The OMS decides what; the EMS decides how.", c:"Technology"},
  "Matching Engine": {p:"The exchange's heart: the software that pairs buyers with sellers by price-time priority.", m:"Best price wins; at equal prices, first come first served. Microsecond fair play.", c:"Technology"},
  "Market Data Feed": {p:"The live river of prices, quotes, and trades flowing out of exchanges.", m:"Every screen, algo, and risk system drinks from it. Latency here is measured in microseconds.", c:"Technology"},
  "Reference Data": {p:"The quiet facts everything depends on: security details, calendars, counterparty records.", m:"Wrong reference data breaks trades silently, everywhere, at once. Unglamorous and mission-critical.", c:"Technology"},
  "Golden Source": {p:"The one system officially trusted as the truth for a piece of data.", m:"When five systems disagree on a price, the golden source wins. Deciding which one — that's a BA workshop.", c:"Technology"},
  "Audit Trail": {p:"The unforgeable diary: who did what, when, and from where.", m:"Regulators demand it, investigations depend on it, and good systems write it automatically.", c:"Technology"},
  "API": {p:"A doorway systems use to talk to each other, with rules about what can be asked.", m:"Modern market infrastructure is APIs all the way down. BAs write the requirements for what flows through them.", c:"Technology"},
  "Bloomberg Terminal": {p:"The most expensive, most powerful data terminal in finance — real-time prices, news, analytics, and a built-in chat network, all in one screen.", m:"Roughly $27,000 a year per license. If you've seen a trading floor in a movie, that orange-on-black screen is almost certainly this.", c:"Technology"},
  "Capital IQ": {p:"A web-based research and data platform, especially strong for M&A screening and cleaned-up financial statements.", m:"Owned by S&P. The go-to tool for investment bankers building comps and precedent transaction lists.", c:"Technology"},
  "FactSet": {p:"A data and analytics platform built around a best-in-class Excel and PowerPoint plugin.", m:"Popular with bankers building pitchbooks — it turns messy data into formatted slides and models fast.", c:"Technology"},
  "Refinitiv Eikon": {p:"Bloomberg's most direct competitor, offering similar data at a meaningfully lower price.", m:"Now rebranded as LSEG Workspace after London Stock Exchange Group's acquisition. Often the terminal junior staff get before earning a Bloomberg seat.", c:"Technology"},
  "Comps": {p:"Valuing a company by looking at what similar, publicly traded companies are worth.", m:"If three airlines trade at 8x earnings, a fourth probably should too — comps is finance's version of pricing by comparison.", c:"Technology"},
  "Non-GAAP": {p:"A company's own version of its earnings, with items it considers one-off or non-recurring stripped out.", m:"Can be genuinely useful — or a way to make a bad quarter look better. Always worth checking what got excluded, and why.", c:"Technology"},
  "Soft Dollar": {p:"Paying for research or services with trading commissions instead of cash — bundled into the cost of every trade.", m:"A quiet way asset managers fund data terminals and research without writing a separate check. Heavily regulated because of the obvious conflict of interest.", c:"Technology"},
  "Data Scrubbing": {p:"Cleaning and standardizing a company's reported financials so they're actually comparable to another company's.", m:"Different companies report the same number in different ways — scrubbing normalizes it before you can compare apples to apples.", c:"Technology"}
};

/* ===================== RENDER ===================== */
let currentTerm = null;

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function slugify(t){ return encodeURIComponent(t); }
function unslugify(s){ return s; }

function readingTime(term){
  const c = CONTENT[term];
  const words = (CORE[term].p+' '+CORE[term].m+' '+c.analogy+' '+c.example.join(' ')+' '+c.mistakes.map(m=>m.think+m.reality).join(' ')).split(/\s+/).length;
  return Math.max(2, Math.round(words/140)) + ' min read';
}

function renderInteractive(term){
  if(term === 'Order Book'){
    document.getElementById('demoEyebrow').textContent = 'See it in action';
    document.getElementById('demoHead').textContent = 'Watch an order get matched';
    document.getElementById('demoBody').innerHTML = `
      <p class="body-text">This is a live order book. Send in a market order and watch where it lands.</p>
      <div class="demo-card">
        <div class="ob" id="obDemo">
          <div class="ob-side bids">
            <div class="side-lbl">Bids (Buyers)</div>
            <div class="ob-head"><span>Price (₹)</span><span>Quantity</span></div>
            <div class="ob-row" data-price="104.80" data-qty="500"><span class="price">104.80</span><div class="ob-bar" style="max-width:75px"></div><span class="qty">500</span></div>
            <div class="ob-row" data-price="104.60" data-qty="800"><span class="price">104.60</span><div class="ob-bar" style="max-width:110px"></div><span class="qty">800</span></div>
            <div class="ob-row" data-price="104.40" data-qty="1200"><span class="price">104.40</span><div class="ob-bar" style="max-width:150px"></div><span class="qty">1,200</span></div>
          </div>
          <div class="ob-mid">
            <span class="spread-lbl">Spread</span><span class="spread-val" id="spreadVal">₹0.20</span><hr>
            <span class="spread-lbl">Last traded</span><span class="ltp" id="ltpVal">₹104.10</span>
          </div>
          <div class="ob-side asks">
            <div class="side-lbl">Asks (Sellers)</div>
            <div class="ob-head"><span>Price (₹)</span><span>Quantity</span></div>
            <div class="ob-row" data-price="105.00" data-qty="450"><span class="price">105.00</span><div class="ob-bar" style="max-width:80px"></div><span class="qty">450</span></div>
            <div class="ob-row" data-price="105.20" data-qty="700"><span class="price">105.20</span><div class="ob-bar" style="max-width:115px"></div><span class="qty">700</span></div>
            <div class="ob-row" data-price="105.40" data-qty="1100"><span class="price">105.40</span><div class="ob-bar" style="max-width:140px"></div><span class="qty">1,100</span></div>
          </div>
        </div>
        <div class="demo-controls">
          <button class="demo-btn" id="matchBtn" type="button">Send market buy order · 200 shares</button>
          <button class="demo-btn ghost" id="resetBtn" type="button">Reset</button>
          <span class="demo-log" id="demoLog"></span>
        </div>
      </div>`;
    wireOrderBookDemo();
  } else {
    document.getElementById('demoEyebrow').textContent = 'The visual';
    document.getElementById('demoHead').textContent = 'How ' + term + ' looks in practice';
    document.getElementById('demoBody').innerHTML = `
      <p class="body-text">${esc(CORE[term].m)}</p>
      <div class="demo-card">
        <div class="diag">${DIAG[term] || ''}</div>
        <div class="demo-caption">This is the same diagram from the main library — every one of the 229 terms already has one.</div>
      </div>`;
  }
}

function wireOrderBookDemo(){
  const askRows = Array.from(document.querySelectorAll('#obDemo .ob-side.asks .ob-row'));
  const matchBtn = document.getElementById('matchBtn');
  const resetBtn = document.getElementById('resetBtn');
  const log = document.getElementById('demoLog');
  const ltp = document.getElementById('ltpVal');
  const initialQty = askRows.map(r => parseInt(r.dataset.qty, 10));
  let remaining = 200;
  function render(){
    askRows.forEach((r, i) => {
      const qty = parseInt(r.dataset.qty, 10);
      r.querySelector('.qty').textContent = qty.toLocaleString();
      const maxW = [80,115,140][i];
      r.querySelector('.ob-bar').style.maxWidth = Math.max(6, maxW * (qty / initialQty[i])) + 'px';
    });
  }
  matchBtn.addEventListener('click', () => {
    if(remaining <= 0) return;
    const row = askRows.find(r => parseInt(r.dataset.qty, 10) > 0);
    if(!row) return;
    let qty = parseInt(row.dataset.qty, 10);
    const take = Math.min(remaining, qty);
    qty -= take; remaining -= take; row.dataset.qty = qty;
    row.classList.add('flash');
    ltp.textContent = '₹' + row.dataset.price;
    ltp.classList.add('pulse');
    log.textContent = 'Matched ' + take + ' @ ₹' + row.dataset.price + ' · Total ₹' + (take * parseFloat(row.dataset.price)).toLocaleString(undefined,{maximumFractionDigits:0});
    render();
    setTimeout(() => { row.classList.remove('flash'); ltp.classList.remove('pulse'); }, 700);
    matchBtn.disabled = remaining <= 0;
    if(remaining <= 0) matchBtn.textContent = 'Order fully filled';
  });
  resetBtn.addEventListener('click', () => {
    askRows.forEach((r, i) => { r.dataset.qty = initialQty[i]; r.classList.remove('flash'); });
    remaining = 200; matchBtn.disabled = false;
    matchBtn.textContent = 'Send market buy order · 200 shares';
    ltp.textContent = '₹104.10'; log.textContent = '';
    render();
  });
}

function render(term){
  if(!CORE[term]) term = 'Order Book';
  currentTerm = term;
  const core = CORE[term];
  const content = CONTENT[term];
  const cat = CATS[core.c];

  document.getElementById('catPill').textContent = core.c;
  document.getElementById('catPill').style.background = cat.tint;
  document.getElementById('catPill').style.color = cat.color;
  document.getElementById('termTitle').textContent = term;
  document.getElementById('termLede').textContent = '"' + core.p.replace(/^"|"$/g,'') + '"';
  document.getElementById('readTime').innerHTML = document.getElementById('readTime').querySelector('svg').outerHTML + readingTime(term);

  document.getElementById('analogyHead').textContent = content.analogyHead;
  document.getElementById('analogyBody').textContent = content.analogy;
  const illoWrap = document.getElementById('analogyIlloWrap');
  if(term === 'Order Book'){
    illoWrap.innerHTML = `<div class="analogy-illo">${ORDER_BOOK_ILLO}</div><p class="analogy-caption">Every stall is a real order sitting in the book — closer to the center means a better, more competitive price.</p>`;
  } else {
    illoWrap.innerHTML = '';
  }

  renderInteractive(term);

  document.getElementById('exampleHead').textContent = content.exampleHead;
  document.getElementById('stepsWrap').innerHTML = content.example.map((s,i) => {
    const isLast = i === content.example.length - 1;
    return `<div class="step"><div class="step-num">${i+1}</div><div class="step-body"><p>${esc(s)}</p>${isLast ? `<span class="callout">${esc(content.exampleCallout)}</span>` : ''}</div></div>`;
  }).join('');

  document.getElementById('mistakesWrap').innerHTML = content.mistakes.map(m => `
    <div class="mistake">
      <div class="mrow think"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></span><div><div class="mlbl">People think</div><p>${esc(m.think)}</p></div></div>
      <div class="mrow reality"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><div class="mlbl">Reality</div><p>${esc(m.reality)}</p></div></div>
    </div>`).join('');

  document.getElementById('relatedWrap').innerHTML = content.related.map(r => {
    const has = !!CORE[r];
    const def = has ? CORE[r].p.replace(/^"|"$/g,'') : 'Coming soon to the library.';
    return `<a class="related-card" ${has ? `href="#${slugify(r)}"` : 'href="javascript:void(0)"'}><h4>${esc(r)}</h4><p>${esc(def)}</p></a>`;
  }).join('');

  const quizCard = document.getElementById('quizCard');
  quizCard.classList.remove('answered');
  document.getElementById('quizQ').textContent = content.quiz.q;
  document.getElementById('quizOpts').innerHTML = content.quiz.options.map((o,i) => `
    <button class="quiz-opt" data-idx="${i}" ${i === content.quiz.correct ? 'data-correct="true"' : ''}>${esc(o)}<span class="res-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>`).join('');
  document.getElementById('quizFeedback').textContent = content.quiz.explain;
  wireQuiz();

  const idx = ORDER.indexOf(term);
  document.getElementById('pathTrack').innerHTML = ORDER.map((p,i) => `<button class="path-dot${i===idx?' active':''}" title="${esc(p)}" data-term="${esc(p)}"></button>`).join('');
  document.querySelectorAll('.path-dot').forEach(d => d.addEventListener('click', e => { location.hash = slugify(e.currentTarget.dataset.term); }));
  document.getElementById('pathLabel').textContent = 'CONCEPT ' + (idx+1) + ' OF ' + ORDER.length + ' · ' + term.toUpperCase();
  const nextTerm = ORDER[(idx+1) % ORDER.length];
  document.getElementById('nextTitle').textContent = nextTerm + ' →';
  document.getElementById('nextCard').onclick = () => { location.hash = slugify(nextTerm); };

  window.scrollTo(0,0);
}

function wireQuiz(){
  const quizCard = document.getElementById('quizCard');
  const opts = Array.from(document.querySelectorAll('.quiz-opt'));
  opts.forEach(opt => {
    opt.addEventListener('click', () => {
      if(quizCard.classList.contains('answered')) return;
      quizCard.classList.add('answered');
      opt.classList.add('picked');
      opts.forEach(o => { if(o.dataset.correct === 'true') o.classList.add('correct'); });
    });
  });
  document.getElementById('quizRetry').onclick = () => {
    quizCard.classList.remove('answered');
    opts.forEach(o => o.classList.remove('picked','correct'));
  };
}

/* ===================== INIT ===================== */
(function(){
  const root = document.documentElement;
  function getInitialTheme(){
    const hostTheme = root.getAttribute('data-theme');
    if(hostTheme === 'dark' || hostTheme === 'light') return hostTheme;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', getInitialTheme());

  const fill = document.getElementById('progressFill');
  function updateProgress(){
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    fill.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }
  document.addEventListener('scroll', updateProgress, {passive:true});

  const bm = document.getElementById('bookmarkBtn');
  bm.addEventListener('click', () => bm.setAttribute('aria-pressed', String(bm.getAttribute('aria-pressed') !== 'true')));

  window.addEventListener('hashchange', () => {
    const term = unslugify(decodeURIComponent(location.hash.replace('#','')));
    render(CORE[term] ? term : 'Order Book');
    updateProgress();
  });

  const initial = unslugify(decodeURIComponent(location.hash.replace('#','')));
  render(CORE[initial] ? initial : 'Order Book');
  updateProgress();
})();
</script>
