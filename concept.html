<style>

:root{
  --bg:#F8F3E9;--paper:#FFFFFF;--ink:#1C1B22;--muted:#6B6A75;--muted-2:#96949E;
  --line:#EAE1CD;--line-soft:#F0E9D8;--accent:#2E4D8A;--accent-deep:#1C2C50;
  --accent-soft:#E7ECF7;--ask:#D97A42;--ask-soft:#FBEDE2;--gold:#C99A3E;--gold-soft:#F7EFDD;
  --good:#3F8E5C;--good-soft:#E5F3EA;--bad:#C24A42;--bad-soft:#FAEAE8;
  --shadow:0 1px 2px rgba(28,27,34,.04), 0 16px 32px -18px rgba(28,27,34,.18);
  --radius-lg:22px;--radius-md:16px;--radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151726;--paper:#1E2135;--ink:#EFEEF6;--muted:#9C9CB0;--muted-2:#75758C;
    --line:#2E3149;--line-soft:#282B42;--accent:#7C97DD;--accent-deep:#101527;
    --accent-soft:#262C4A;--ask:#E8996A;--ask-soft:#332A26;--gold:#D9B463;--gold-soft:#332C1D;
    --good:#6FBF8C;--good-soft:#1E332A;--bad:#E2857D;--bad-soft:#332423;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#151726;--paper:#1E2135;--ink:#EFEEF6;--muted:#9C9CB0;--muted-2:#75758C;
  --line:#2E3149;--line-soft:#282B42;--accent:#7C97DD;--accent-deep:#101527;
  --accent-soft:#262C4A;--ask:#E8996A;--ask-soft:#332A26;--gold:#D9B463;--gold-soft:#332C1D;
  --good:#6FBF8C;--good-soft:#1E332A;--bad:#E2857D;--bad-soft:#332423;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#F8F3E9;--paper:#FFFFFF;--ink:#1C1B22;--muted:#6B6A75;--muted-2:#96949E;
  --line:#EAE1CD;--line-soft:#F0E9D8;--accent:#2E4D8A;--accent-deep:#1C2C50;
  --accent-soft:#E7ECF7;--ask:#D97A42;--ask-soft:#FBEDE2;--gold:#C99A3E;--gold-soft:#F7EFDD;
  --good:#3F8E5C;--good-soft:#E5F3EA;--bad:#C24A42;--bad-soft:#FAEAE8;
  --shadow:0 1px 2px rgba(28,27,34,.04), 0 16px 32px -18px rgba(28,27,34,.18);
}

*{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
html,body{background:var(--bg)}
body{color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{max-width:720px;margin:0 auto;padding:0 28px}
.col-wide{max-width:860px;margin:0 auto;padding:0 28px}

.progress-track{position:sticky;top:0;height:2px;background:var(--line-soft);z-index:50}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}

.topbar{position:sticky;top:2px;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:720px;margin:0 auto;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
.back-link{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer}
.back-link:hover{color:var(--ink)}
.back-link svg{width:15px;height:15px}
.topbar-meta{display:flex;align-items:center;gap:10px}
.read-time{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--muted-2)}
.read-time svg{width:13px;height:13px}
.icon-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease}
.icon-btn svg{width:14px;height:14px}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn[aria-pressed="true"]{background:var(--ask);border-color:var(--ask);color:#fff}

.hero{padding:56px 0 8px;text-align:left}
.cat-pill{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;padding:5px 12px;border-radius:999px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.05;margin-bottom:20px}
.hero .lede{font-family:'Fraunces',serif;font-style:italic;font-size:1.35rem;color:var(--muted);line-height:1.5;max-width:600px}

.section{padding:64px 0}
.section-inner{border-top:1px solid var(--line-soft);padding-top:56px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow svg{width:14px;height:14px;color:var(--gold)}
.section h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;line-height:1.2;margin-bottom:18px;text-wrap:balance}
.section .body-text{font-size:1.02rem;color:var(--muted);line-height:1.7;max-width:620px}

.analogy-illo{margin:28px 0 14px;border-radius:var(--radius-lg);overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px}
.analogy-illo svg{width:100%;height:auto;display:block}
.analogy-caption{font-size:.86rem;color:var(--muted-2);font-style:italic;margin-top:10px}

.demo-card{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px}
.demo-card .diag svg{width:100%;height:auto;display:block}
.diag .vs{font-size:10px;fill:var(--muted);font-family:'IBM Plex Sans',sans-serif}
.diag .vt{font-size:11px;font-weight:600;fill:var(--ink);font-family:'IBM Plex Sans',sans-serif}
.diag .vg{fill:var(--ask)}
.diag .vgt{font-size:11px;font-weight:600;fill:#fff;font-family:'IBM Plex Sans',sans-serif}
.diag text{font-family:'IBM Plex Sans',sans-serif}

.ob{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start}
.ob-side .side-lbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.ob-side.bids .side-lbl{color:var(--accent)}
.ob-side.asks .side-lbl{color:var(--ask)}
.ob-head{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted-2);margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
.ob-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:3px 6px;border-radius:6px;transition:background .3s ease}
.ob-row.flash{background:var(--good-soft)}
.ob-row .price{width:54px;font-weight:600}
.ob-side.bids .price{color:var(--accent)}
.ob-side.asks .price{color:var(--ask)}
.ob-row .qty{width:44px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ob-bar{height:9px;border-radius:3px;flex:1;transition:max-width .4s ease}
.ob-side.bids .ob-bar{background:var(--accent);margin-left:auto}
.ob-side.asks .ob-bar{background:var(--ask)}
.ob-mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:20px}
.ob-mid .spread-lbl{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.ob-mid .spread-val{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem}
.ob-mid hr{border:none;border-top:1px dashed var(--line);width:44px;margin:4px 0}
.ob-mid .ltp{font-family:'IBM Plex Mono',monospace;font-size:.76rem;font-weight:600;background:var(--accent-deep);color:#fff;border-radius:8px;padding:6px 12px;transition:background .3s ease}
.ob-mid .ltp.pulse{background:var(--good)}

.demo-controls{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:22px;border-top:1px dashed var(--line);flex-wrap:wrap}
.demo-btn{background:var(--accent-deep);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-size:.86rem;font-weight:600;cursor:pointer;transition:opacity .2s ease}
.demo-btn:hover{opacity:.85}
.demo-btn:disabled{opacity:.4;cursor:not-allowed}
.demo-btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.demo-log{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--good);min-height:1.2em}
.demo-caption{margin-top:16px;font-size:.86rem;color:var(--muted-2);font-style:italic}

.steps{margin-top:28px;display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:18px;position:relative;padding-bottom:32px}
.step:last-child{padding-bottom:0}
.step-num{width:36px;height:36px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:17.5px;top:36px;bottom:0;width:1px;background:var(--line)}
.step-body{padding-top:6px}
.step-body p{font-size:.94rem;color:var(--ink)}
.step-body .callout{display:inline-block;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600;background:var(--gold-soft);color:var(--gold);padding:4px 11px;border-radius:8px}

.mistakes{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.mistake{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mrow .mi{width:22px;height:22px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mrow.think .mi{background:var(--bad-soft);color:var(--bad)}
.mrow.reality .mi{background:var(--good-soft);color:var(--good)}
.mrow .mi svg{width:12px;height:12px}
.mrow .mlbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.mrow.think .mlbl{color:var(--bad)}
.mrow.reality .mlbl{color:var(--good)}
.mrow p{font-size:.92rem;color:var(--ink)}
.mrow.think p{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1px;opacity:.85}

.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:26px}
.related-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:18px 20px;transition:transform .2s ease,border-color .2s ease;cursor:pointer;display:block}
.related-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.related-card h4{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;margin-bottom:6px}
.related-card p{font-size:.82rem;color:var(--muted);line-height:1.5}

.quiz-card{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:30px}
.quiz-q{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem;margin-bottom:20px;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;font-size:.94rem;color:var(--ink);cursor:pointer;transition:all .18s ease;display:flex;justify-content:space-between;align-items:center}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt .res-icon{width:18px;height:18px;flex-shrink:0;display:none}
.quiz-opt .res-icon svg{width:100%;height:100%}
.quiz-card.answered .quiz-opt{cursor:default;pointer-events:none}
.quiz-card.answered .quiz-opt:not(.correct):not(.picked){opacity:.5}
.quiz-card.answered .quiz-opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.quiz-card.answered .quiz-opt.correct .res-icon{display:block;color:var(--good)}
.quiz-card.answered .quiz-opt.picked:not(.correct){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.quiz-card.answered .quiz-opt.picked:not(.correct) .res-icon{display:block;color:var(--bad)}
.quiz-feedback{display:none;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:.92rem;color:var(--muted);line-height:1.6}
.quiz-card.answered .quiz-feedback{display:block}
.quiz-retry{display:none;margin-top:14px;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
.quiz-card.answered .quiz-retry{display:inline-block}
.quiz-retry:hover{border-color:var(--accent);color:var(--accent)}

.path-strip{padding:40px 0 0;border-top:1px solid var(--line-soft)}
.path-track{display:flex;align-items:center;gap:5px;overflow-x:auto;padding-bottom:6px}
.path-dot{width:7px;height:7px;border-radius:999px;background:var(--line);flex-shrink:0;cursor:pointer;border:none;padding:0}
.path-dot.active{background:var(--accent);width:20px;border-radius:999px}
.path-label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted-2);margin-top:10px;letter-spacing:.04em}

.next-card{margin:24px 0 70px;display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--accent-deep);color:#fff;border-radius:var(--radius-lg);padding:30px 34px;cursor:pointer;transition:opacity .2s ease;border:none;width:100%}
.next-card:hover{opacity:.92}
.next-card .nc-lbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#B9C6E8;margin-bottom:8px;text-align:left}
.next-card h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.7rem;text-align:left}
.next-card .nc-arrow{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next-card .nc-arrow svg{width:20px;height:20px}

@media (max-width:640px){
  .col,.col-wide,.topbar-inner{padding:0 20px}
  .ob{grid-template-columns:1fr}
  .ob-mid{padding-top:8px;flex-direction:row;justify-content:space-around}
  .ob-mid hr{display:none}
}
</style>
</head>

<script>
/* ===================== DATA ===================== */
const CATS = {Lifecycle:{color:'#3B66C7',tint:'#E9EEFB'}};

const CORE = {
  "Order Book": {p:"The exchange's live list of everyone waiting to buy or sell, and at what price.", m:"Buy orders (bids) on one side, sell orders (asks) on the other. Where they meet, trades happen.", c:"Lifecycle"},
  "Limit Order": {p:"\"Buy it — but only at my price or better.\"", m:"You control the price, not the timing. It may never execute if the market doesn't come to you.", c:"Lifecycle"},

}

function wireOrderBookDemo(){
  const askRows = Array.from(document.querySelectorAll('#obDemo .ob-side.asks .ob-row'));
  const matchBtn = document.getElementById('matchBtn');
  const resetBtn = document.getElementById('resetBtn');
  const log = document.getElementById('demoLog');
  const ltp = document.getElementById('ltpVal');
  const initialQty = askRows.map(r => parseInt(r.dataset.qty, 10));
  let remaining = 200;
  function render(){
    askRows.forEach((r, i) => {
      const qty = parseInt(r.dataset.qty, 10);
      r.querySelector('.qty').textContent = qty.toLocaleString();
      const maxW = [80,115,140][i];
      r.querySelector('.ob-bar').style.maxWidth = Math.max(6, maxW * (qty / initialQty[i])) + 'px';
    });
  }
  matchBtn.addEventListener('click', () => {
    if(remaining <= 0) return;
    const row = askRows.find(r => parseInt(r.dataset.qty, 10) > 0);
    if(!row) return;
    let qty = parseInt(row.dataset.qty, 10);
    const take = Math.min(remaining, qty);
    qty -= take; remaining -= take; row.dataset.qty = qty;
    row.classList.add('flash');
    ltp.textContent = '₹' + row.dataset.price;
    ltp.classList.add('pulse');
    log.textContent = 'Matched ' + take + ' @ ₹' + row.dataset.price + ' · Total ₹' + (take * parseFloat(row.dataset.price)).toLocaleString(undefined,{maximumFractionDigits:0});
    render();
    setTimeout(() => { row.classList.remove('flash'); ltp.classList.remove('pulse'); }, 700);
    matchBtn.disabled = remaining <= 0;
    if(remaining <= 0) matchBtn.textContent = 'Order fully filled';
  });
  resetBtn.addEventListener('click', () => {
    askRows.forEach((r, i) => { r.dataset.qty = initialQty[i]; r.classList.remove('flash'); });
    remaining = 200; matchBtn.disabled = false;
    matchBtn.textContent = 'Send market buy order · 200 shares';
    ltp.textContent = '₹104.10'; log.textContent = '';
    render();
  });
}

  renderInteractive(term);

  document.getElementById('exampleHead').textContent = content.exampleHead;
  document.getElementById('stepsWrap').innerHTML = content.example.map((s,i) => {
    const isLast = i === content.example.length - 1;
    return `<div class="step"><div class="step-num">${i+1}</div><div class="step-body"><p>${esc(s)}</p>${isLast ? `<span class="callout">${esc(content.exampleCallout)}</span>` : ''}</div></div>`;
  }).join('');

  document.getElementById('mistakesWrap').innerHTML = content.mistakes.map(m => `
    <div class="mistake">
      <div class="mrow think"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></span><div><div class="mlbl">People think</div><p>${esc(m.think)}</p></div></div>
      <div class="mrow reality"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><div class="mlbl">Reality</div><p>${esc(m.reality)}</p></div></div>
    </div>`).join('');

  document.getElementById('relatedWrap').innerHTML = content.related.map(r => {
    const has = !!CORE[r];
    const def = has ? CORE[r].p.replace(/^"|"$/g,'') : 'Coming soon to the library.';
    return `<a class="related-card" ${has ? `href="#${slugify(r)}"` : 'href="javascript:void(0)"'}><h4>${esc(r)}</h4><p>${esc(def)}</p></a>`;
  }).join('');

  const quizCard = document.getElementById('quizCard');
  quizCard.classList.remove('answered');
  document.getElementById('quizQ').textContent = content.quiz.q;
  document.getElementById('quizOpts').innerHTML = content.quiz.options.map((o,i) => `
    <button class="quiz-opt" data-idx="${i}" ${i === content.quiz.correct ? 'data-correct="true"' : ''}>${esc(o)}<span class="res-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>`).join('');
  document.getElementById('quizFeedback').textContent = content.quiz.explain;
  wireQuiz();

  const idx = ORDER.indexOf(term);
  document.getElementById('pathTrack').innerHTML = ORDER.map((p,i) => `<button class="path-dot${i===idx?' active':''}" title="${esc(p)}" data-term="${esc(p)}"></button>`).join('');
  document.querySelectorAll('.path-dot').forEach(d => d.addEventListener('click', e => { location.hash = slugify(e.currentTarget.dataset.term); }));
  document.getElementById('pathLabel').textContent = 'CONCEPT ' + (idx+1) + ' OF ' + ORDER.length + ' · ' + term.toUpperCase();
  const nextTerm = ORDER[(idx+1) % ORDER.length];
  document.getElementById('nextTitle').textContent = nextTerm + ' →';
  document.getElementById('nextCard').onclick = () => { location.hash = slugify(nextTerm); };

  window.scrollTo(0,0);
}

function wireQuiz(){
  const quizCard = document.getElementById('quizCard');
  const opts = Array.from(document.querySelectorAll('.quiz-opt'));
  opts.forEach(opt => {
    opt.addEventListener('click', () => {
      if(quizCard.classList.contains('answered')) return;
      quizCard.classList.add('answered');
      opt.classList.add('picked');
      opts.forEach(o => { if(o.dataset.correct === 'true') o.classList.add('correct'); });
    });
  });
  document.getElementById('quizRetry').onclick = () => {
    quizCard.classList.remove('answered');
    opts.forEach(o => o.classList.remove('picked','correct'));
  };
}

/* ===================== INIT ===================== */
(function(){
  const root = document.documentElement;
  function getInitialTheme(){
    const hostTheme = root.getAttribute('data-theme');
    if(hostTheme === 'dark' || hostTheme === 'light') return hostTheme;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', getInitialTheme());

  const fill = document.getElementById('progressFill');
  function updateProgress(){
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    fill.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }
  document.addEventListener('scroll', updateProgress, {passive:true});

  const bm = document.getElementById('bookmarkBtn');
  bm.addEventListener('click', () => bm.setAttribute('aria-pressed', String(bm.getAttribute('aria-pressed') !== 'true')));

  window.addEventListener('hashchange', () => {
    const term = unslugify(decodeURIComponent(location.hash.replace('#','')));
    render(CORE[term] ? term : 'Order Book');
    updateProgress();
  });

  const initial = unslugify(decodeURIComponent(location.hash.replace('#','')));
  render(CORE[initial] ? initial : 'Order Book');
  updateProgress();
})();
</script>
</body>
</html>
