<style>

:root{
  --bg:#F8F3E9;--paper:#FFFFFF;--ink:#1C1B22;--muted:#6B6A75;--muted-2:#96949E;
  --line:#EAE1CD;--line-soft:#F0E9D8;--accent:#2E4D8A;--accent-deep:#1C2C50;
  --accent-soft:#E7ECF7;--ask:#D97A42;--ask-soft:#FBEDE2;--gold:#C99A3E;--gold-soft:#F7EFDD;
  --good:#3F8E5C;--good-soft:#E5F3EA;--bad:#C24A42;--bad-soft:#FAEAE8;
  --shadow:0 1px 2px rgba(28,27,34,.04), 0 16px 32px -18px rgba(28,27,34,.18);
  --radius-lg:22px;--radius-md:16px;--radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151726;--paper:#1E2135;--ink:#EFEEF6;--muted:#9C9CB0;--muted-2:#75758C;
    --line:#2E3149;--line-soft:#282B42;--accent:#7C97DD;--accent-deep:#101527;
    --accent-soft:#262C4A;--ask:#E8996A;--ask-soft:#332A26;--gold:#D9B463;--gold-soft:#332C1D;
    --good:#6FBF8C;--good-soft:#1E332A;--bad:#E2857D;--bad-soft:#332423;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#151726;--paper:#1E2135;--ink:#EFEEF6;--muted:#9C9CB0;--muted-2:#75758C;
  --line:#2E3149;--line-soft:#282B42;--accent:#7C97DD;--accent-deep:#101527;
  --accent-soft:#262C4A;--ask:#E8996A;--ask-soft:#332A26;--gold:#D9B463;--gold-soft:#332C1D;
  --good:#6FBF8C;--good-soft:#1E332A;--bad:#E2857D;--bad-soft:#332423;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#F8F3E9;--paper:#FFFFFF;--ink:#1C1B22;--muted:#6B6A75;--muted-2:#96949E;
  --line:#EAE1CD;--line-soft:#F0E9D8;--accent:#2E4D8A;--accent-deep:#1C2C50;
  --accent-soft:#E7ECF7;--ask:#D97A42;--ask-soft:#FBEDE2;--gold:#C99A3E;--gold-soft:#F7EFDD;
  --good:#3F8E5C;--good-soft:#E5F3EA;--bad:#C24A42;--bad-soft:#FAEAE8;
  --shadow:0 1px 2px rgba(28,27,34,.04), 0 16px 32px -18px rgba(28,27,34,.18);
}

*{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
html,body{background:var(--bg)}
body{color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{max-width:720px;margin:0 auto;padding:0 28px}
.col-wide{max-width:860px;margin:0 auto;padding:0 28px}

.progress-track{position:sticky;top:0;height:2px;background:var(--line-soft);z-index:50}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}

.topbar{position:sticky;top:2px;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:720px;margin:0 auto;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
.back-link{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer}
.back-link:hover{color:var(--ink)}
.back-link svg{width:15px;height:15px}
.topbar-meta{display:flex;align-items:center;gap:10px}
.read-time{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--muted-2)}
.read-time svg{width:13px;height:13px}
.icon-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease}
.icon-btn svg{width:14px;height:14px}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn[aria-pressed="true"]{background:var(--ask);border-color:var(--ask);color:#fff}

.hero{padding:56px 0 8px;text-align:left}
.cat-pill{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;padding:5px 12px;border-radius:999px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.05;margin-bottom:20px}
.hero .lede{font-family:'Fraunces',serif;font-style:italic;font-size:1.35rem;color:var(--muted);line-height:1.5;max-width:600px}

.section{padding:64px 0}
.section-inner{border-top:1px solid var(--line-soft);padding-top:56px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow svg{width:14px;height:14px;color:var(--gold)}
.section h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;line-height:1.2;margin-bottom:18px;text-wrap:balance}
.section .body-text{font-size:1.02rem;color:var(--muted);line-height:1.7;max-width:620px}

.analogy-illo{margin:28px 0 14px;border-radius:var(--radius-lg);overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px}
.analogy-illo svg{width:100%;height:auto;display:block}
.analogy-caption{font-size:.86rem;color:var(--muted-2);font-style:italic;margin-top:10px}

.demo-card{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px}
.demo-card .diag svg{width:100%;height:auto;display:block}
.diag .vs{font-size:10px;fill:var(--muted);font-family:'IBM Plex Sans',sans-serif}
.diag .vt{font-size:11px;font-weight:600;fill:var(--ink);font-family:'IBM Plex Sans',sans-serif}
.diag .vg{fill:var(--ask)}
.diag .vgt{font-size:11px;font-weight:600;fill:#fff;font-family:'IBM Plex Sans',sans-serif}
.diag text{font-family:'IBM Plex Sans',sans-serif}

.ob{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start}
.ob-side .side-lbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.ob-side.bids .side-lbl{color:var(--accent)}
.ob-side.asks .side-lbl{color:var(--ask)}
.ob-head{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted-2);margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
.ob-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:3px 6px;border-radius:6px;transition:background .3s ease}
.ob-row.flash{background:var(--good-soft)}
.ob-row .price{width:54px;font-weight:600}
.ob-side.bids .price{color:var(--accent)}
.ob-side.asks .price{color:var(--ask)}
.ob-row .qty{width:44px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ob-bar{height:9px;border-radius:3px;flex:1;transition:max-width .4s ease}
.ob-side.bids .ob-bar{background:var(--accent);margin-left:auto}
.ob-side.asks .ob-bar{background:var(--ask)}
.ob-mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:20px}
.ob-mid .spread-lbl{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.ob-mid .spread-val{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem}
.ob-mid hr{border:none;border-top:1px dashed var(--line);width:44px;margin:4px 0}
.ob-mid .ltp{font-family:'IBM Plex Mono',monospace;font-size:.76rem;font-weight:600;background:var(--accent-deep);color:#fff;border-radius:8px;padding:6px 12px;transition:background .3s ease}
.ob-mid .ltp.pulse{background:var(--good)}

.demo-controls{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:22px;border-top:1px dashed var(--line);flex-wrap:wrap}
.demo-btn{background:var(--accent-deep);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-size:.86rem;font-weight:600;cursor:pointer;transition:opacity .2s ease}
.demo-btn:hover{opacity:.85}
.demo-btn:disabled{opacity:.4;cursor:not-allowed}
.demo-btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.demo-log{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--good);min-height:1.2em}
.demo-caption{margin-top:16px;font-size:.86rem;color:var(--muted-2);font-style:italic}

.steps{margin-top:28px;display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:18px;position:relative;padding-bottom:32px}
.step:last-child{padding-bottom:0}
.step-num{width:36px;height:36px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:17.5px;top:36px;bottom:0;width:1px;background:var(--line)}
.step-body{padding-top:6px}
.step-body p{font-size:.94rem;color:var(--ink)}
.step-body .callout{display:inline-block;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600;background:var(--gold-soft);color:var(--gold);padding:4px 11px;border-radius:8px}

.mistakes{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.mistake{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mrow .mi{width:22px;height:22px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mrow.think .mi{background:var(--bad-soft);color:var(--bad)}
.mrow.reality .mi{background:var(--good-soft);color:var(--good)}
.mrow .mi svg{width:12px;height:12px}
.mrow .mlbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.mrow.think .mlbl{color:var(--bad)}
.mrow.reality .mlbl{color:var(--good)}
.mrow p{font-size:.92rem;color:var(--ink)}
.mrow.think p{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1px;opacity:.85}

.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:26px}
.related-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:18px 20px;transition:transform .2s ease,border-color .2s ease;cursor:pointer;display:block}
.related-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.related-card h4{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;margin-bottom:6px}
.related-card p{font-size:.82rem;color:var(--muted);line-height:1.5}

.quiz-card{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:30px}
.quiz-q{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem;margin-bottom:20px;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;font-size:.94rem;color:var(--ink);cursor:pointer;transition:all .18s ease;display:flex;justify-content:space-between;align-items:center}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt .res-icon{width:18px;height:18px;flex-shrink:0;display:none}
.quiz-opt .res-icon svg{width:100%;height:100%}
.quiz-card.answered .quiz-opt{cursor:default;pointer-events:none}
.quiz-card.answered .quiz-opt:not(.correct):not(.picked){opacity:.5}
.quiz-card.answered .quiz-opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.quiz-card.answered .quiz-opt.correct .res-icon{display:block;color:var(--good)}
.quiz-card.answered .quiz-opt.picked:not(.correct){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.quiz-card.answered .quiz-opt.picked:not(.correct) .res-icon{display:block;color:var(--bad)}
.quiz-feedback{display:none;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:.92rem;color:var(--muted);line-height:1.6}
.quiz-card.answered .quiz-feedback{display:block}
.quiz-retry{display:none;margin-top:14px;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
.quiz-card.answered .quiz-retry{display:inline-block}
.quiz-retry:hover{border-color:var(--accent);color:var(--accent)}

.path-strip{padding:40px 0 0;border-top:1px solid var(--line-soft)}
.path-track{display:flex;align-items:center;gap:5px;overflow-x:auto;padding-bottom:6px}
.path-dot{width:7px;height:7px;border-radius:999px;background:var(--line);flex-shrink:0;cursor:pointer;border:none;padding:0}
.path-dot.active{background:var(--accent);width:20px;border-radius:999px}
.path-label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted-2);margin-top:10px;letter-spacing:.04em}

.next-card{margin:24px 0 70px;display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--accent-deep);color:#fff;border-radius:var(--radius-lg);padding:30px 34px;cursor:pointer;transition:opacity .2s ease;border:none;width:100%}
.next-card:hover{opacity:.92}
.next-card .nc-lbl{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#B9C6E8;margin-bottom:8px;text-align:left}
.next-card h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.7rem;text-align:left}
.next-card .nc-arrow{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next-card .nc-arrow svg{width:20px;height:20px}

@media (max-width:640px){
  .col,.col-wide,.topbar-inner{padding:0 20px}
  .ob{grid-template-columns:1fr}
  .ob-mid{padding-top:8px;flex-direction:row;justify-content:space-around}
  .ob-mid hr{display:none}
}
</style>
</head>

<script>

  "LBO": {p:"Buying a company using mostly borrowed money, with the target's own future cash flows expected to pay it off.", m:"Leveraged Buyout — private equity's signature move. More debt means more risk, but also more potential return.", c:"Investment Banking"},

  "Hedge": {p:"Taking a second position specifically to cancel out the risk of the first one.", m:"You don't hedge to make money — you hedge so a bad move somewhere else doesn't wipe you out.", c:"Investment Banking"},
  "Long / Short": {p:"Long means you profit if the price rises. Short means you profit if it falls.", m:"Shorting usually means borrowing the asset to sell it now, planning to buy it back cheaper later and return it.", c:"Investment Banking"},
  "Repo": {p:"A short-term loan where securities are handed over as collateral, with a promise to buy them back later at a slightly higher price.", m:"Repurchase Agreement — the overnight plumbing that keeps trading desks and banks funded day to day.", c:"Investment Banking"},
  "Trading Book": {p:"The running list of everything a trader currently holds — their actual positions, not the exchange's public one.", m:"Distinct from the Order Book: that's the market's queue of orders, this is one trader's or one desk's live exposure.", c:"Investment Banking"},
  "P&L": {p:"Profit & Loss — the number that says whether a trading desk made or lost money today.", m:"Marked to market every day. In trading, your P&L is the only opinion that counts by the end of the session.", c:"Investment Banking"},
  "Market Colour": {p:"The informal, off-the-record read a trader gives a client — not just the price, but what's actually happening beneath it.", m:"Often shared over chat or phone: who's buying, who's nervous, where the flow is heading. Judgment, not data.", c:"Investment Banking"},
  "Axe": {p:"A trader's not-so-secret bias — what they're actually keen to buy or sell right now.", m:"\"What's your axe on this bond?\" is trading-floor shorthand for: what position are you trying to get out of, or into?", c:"Investment Banking"},
  "Block Trade": {p:"A large trade negotiated privately between two parties, away from the public order book, then reported afterward.", m:"Done this way so a big order doesn't move the price against itself before it's even filled.", c:"Investment Banking"},
  "Bulge Bracket": {p:"The handful of full-service global banks at the very top of the food chain — Goldman Sachs, JPMorgan, Morgan Stanley, and a few others.", m:"They do everything: M&A, underwriting, trading, research, across every sector and every country. Size is the whole point.", c:"Investment Banking"},
  "Elite Boutique": {p:"A smaller, independent advisory firm that does M&A and restructuring — and nothing else.", m:"No trading floor, no balance sheet, no conflicts of interest. Firms like Evercore and Lazard compete with bulge brackets purely on advice.", c:"Investment Banking"},
  "Synergies": {p:"The extra value two companies are supposed to create together that they couldn't create apart.", m:"Cost synergies cut overlapping expenses; revenue synergies grow sales. Promised in every deal pitch, delivered in far fewer.", c:"Investment Banking"},
  "Financial Sponsor": {p:"The industry's polite term for a private equity firm buying a company.", m:"Distinguishes them from a 'strategic' — an actual operating company doing the buying. Sponsors buy to sell later; strategics buy to keep.", c:"Investment Banking"},
  "Secondary Offering": {p:"A company selling more shares to the public after it's already listed.", m:"Unlike an IPO, the company's already public — this just raises more capital, or lets early investors finally sell out.", c:"Investment Banking"},
  "Direct Listing": {p:"A company goes public by simply letting existing shares trade — no new shares issued, no underwriters buying in first.", m:"Skips the traditional IPO roadshow and price-setting process. Spotify and Slack both went public this way.", c:"Investment Banking"},
  "Divestiture": {p:"A company selling off a division, unit, or subsidiary it no longer wants.", m:"The mirror image of M&A — instead of buying to grow, a company sells to focus, raise cash, or shed something unprofitable.", c:"Investment Banking"},
  "Coverage Group": {p:"The team assigned to know one industry inside out — and be the bank's face to every company in it.", m:"Banks are organized on two axes: coverage groups own the client relationships by sector, product groups (M&A, ECM, DCM) execute the actual deals.", c:"Investment Banking"},

  "Confirmation Bias": {p:"Only noticing the news that agrees with the stock you already own.", m:"You bought Reliance, so now every bullish article feels true and every bearish one feels wrong. You're not evaluating evidence anymore — you're defending a decision.", c:"Behavioral Finance"},
  "Hindsight Bias": {p:"\"I totally saw the 2020 crash coming\" — said by nobody, in March 2020.", m:"After the crash, the signs feel obvious. Before it, they were buried in a hundred other signals that led nowhere. Memory rewrites the past to make you look smarter.", c:"Behavioral Finance"},
  "Loss Aversion": {p:"Losing ₹10,000 hurts about twice as much as gaining ₹10,000 feels good.", m:"It's why you hold a losing stock way too long — selling would make the loss \"real,\" and that pain outweighs the logic of cutting it.", c:"Behavioral Finance"},
  "Anchoring Bias": {p:"You bought a stock at ₹1,000. It's ₹600 now. In your head, it's still \"a ₹1,000 stock on sale.\"", m:"The price you paid has nothing to do with what it's actually worth today — but your brain won't let go of that first number.", c:"Behavioral Finance"},
  "Herd Mentality": {p:"Buying a stock because your WhatsApp group won't stop talking about it.", m:"Everyone else buying feels like safety in numbers. It isn't — it's just a lot of people making the same unresearched decision at once.", c:"Behavioral Finance"},
  "Overconfidence Bias": {p:"\"I called the last three trades right\" — right before the fourth one wipes out the gains from the first three.", m:"A few correct guesses feel like skill. Statistically, they're often just luck wearing a confident voice.", c:"Behavioral Finance"},
  "Recency Bias": {p:"The market's been up for six months, so surely it'll keep going up forever.", m:"Whatever's happened most recently feels like the permanent new normal — until the trend reverses and last month's certainty looks foolish.", c:"Behavioral Finance"},
  "Sunk Cost Fallacy": {p:"\"I've already lost 40% — might as well hold, I can't sell now.\"", m:"The money's already gone whether you sell or not. The only real question is: would you buy this stock today, at today's price? If not, why are you still holding it?", c:"Behavioral Finance"},
  "Availability Heuristic": {p:"You remember the one friend who got rich on crypto, not the ten who lost money.", m:"Dramatic stories stick in memory far more than boring statistics — so you judge the odds by what you can recall, not what's actually likely.", c:"Behavioral Finance"},
  "Disposition Effect": {p:"Selling the winning stock for a quick profit, and holding the losing one \"until it recovers.\"", m:"Backwards logic: you should let winners run and cut losers fast. Most investors do the exact opposite, because selling a winner feels good and selling a loser feels like admitting defeat.", c:"Behavioral Finance"},
  "FOMO": {p:"Buying a stock at its peak because everyone on Twitter is already up 300%.", m:"Fear Of Missing Out. By the time a trade is exciting enough to talk about at a dinner party, the easy money is usually already made.", c:"Behavioral Finance"},
  "Survivorship Bias": {p:"Studying only the mutual funds that still exist today — not the ones that failed and quietly closed.", m:"The funds that blew up aren't around to be measured, so any \"average\" you calculate from survivors alone is flattering fiction, not the real picture.", c:"Behavioral Finance"},
  "Inflation": {p:"₹100 buys less today than it did last year — the same basket of goods just costs more.", m:"A cup of chai that cost ₹5 a decade ago costs ₹15 now. That's inflation — money losing purchasing power over time, quietly, every year.", c:"Economics"},
  "GDP": {p:"The total value of everything a country produced this year — every good, every service, added up.", m:"When someone says \"India grew at 7%,\" they mean GDP. It's the single number everyone uses to answer \"how's the economy doing?\"", c:"Economics"},
  "Interest Rate": {p:"The price of borrowing money — or the reward for lending it.", m:"Raise rates, and loans get expensive, spending slows, inflation cools. Cut rates, and borrowing gets cheap, spending picks up. It's the economy's main lever.", c:"Economics"},
  "Recession": {p:"The economy shrinking for two straight quarters instead of growing.", m:"Companies sell less, hire less, sometimes lay off. It's the technical word for what people just call \"things are bad right now.\"", c:"Economics"},
  "Monetary Policy": {p:"The central bank's toolkit for managing the economy — mainly by moving interest rates.", m:"In India, this is the RBI's job. Raise rates to fight inflation, cut them to boost a slowing economy.", c:"Economics"},
  "Fiscal Policy": {p:"The government's toolkit for managing the economy — spending and taxation, not interest rates.", m:"Building highways, cutting income tax, launching subsidies — all fiscal policy. It's Parliament's lever, not the RBI's.", c:"Economics"},
  "Yield Curve": {p:"A line plotting bond yields from short-term to long-term — normally, longer means higher.", m:"When it flips — short-term yields higher than long-term — it's called an inverted yield curve, and it's one of the most-watched recession warning signs there is.", c:"Economics"},
  "Quantitative Easing": {p:"A central bank creating new money to buy bonds, pumping cash straight into the financial system.", m:"Used when interest rates are already near zero and there's no more room to cut. The 2008 crisis and COVID both triggered massive rounds of it.", c:"Economics"},
  "Stagflation": {p:"The worst combination: prices rising fast, but the economy barely growing at all.", m:"Normally inflation and growth move together. Stagflation is when they don't — you get the pain of expensive living without the benefit of a booming economy.", c:"Economics"},
  "Fiscal Deficit": {p:"The gap between what a government spends and what it actually collects in taxes.", m:"Covered by borrowing — which is why a large fiscal deficit today often means more government debt tomorrow.", c:"Economics"},
  "CPI": {p:"Consumer Price Index — the actual basket of goods used to measure how fast prices are rising.", m:"When the news says \"inflation is 6%,\" that number came from tracking the changing cost of this basket: food, fuel, rent, and more.", c:"Economics"},
  "Repo Rate": {p:"The interest rate at which the RBI lends short-term money to commercial banks.", m:"This is the single number that moves everything else — home loan rates, FD returns, business borrowing costs — all follow the repo rate up or down.", c:"Economics"},
  "Porter's Five Forces": {p:"Five questions that decide whether an industry is actually profitable to compete in.", m:"Rivals, new entrants, suppliers, buyers, and substitutes — score each one, and you'll know why airlines struggle to make money while luxury brands don't.", c:"Business Strategy"},
  "SWOT Analysis": {p:"A simple four-box gut-check: what are we good at, bad at, what's coming that could help, and what's coming that could hurt.", m:"Strengths and Weaknesses look inward. Opportunities and Threats look outward. Simple enough to sketch on a napkin, useful enough that nobody's replaced it.", c:"Business Strategy"},
  "Core Competency": {p:"The one thing a company does so well that competitors genuinely can't copy it.", m:"For Apple, it's design and ecosystem lock-in. Lose sight of your core competency, and you're just another commodity player competing on price.", c:"Business Strategy"},
  "Economies of Scale": {p:"The bigger you get, the cheaper each individual unit becomes to make.", m:"It's why Amazon can price things lower than a small retailer — spreading the same fixed costs over millions more orders.", c:"Business Strategy"},
  "Network Effect": {p:"A product that gets more useful to you specifically because more other people are using it too.", m:"WhatsApp is worthless if you're the only person who has it. That's the entire reason it's nearly impossible to dislodge once everyone's already on it.", c:"Business Strategy"},
  "First-Mover Advantage": {p:"Getting there first, and locking in the customers, the brand, and the best partnerships before anyone else even shows up.", m:"Not always a real advantage — being first also means paying to educate a market that doesn't exist yet. Sometimes the second mover just copies the homework.", c:"Business Strategy"},
  "Vertical Integration": {p:"A company buying up the suppliers or distributors around it, instead of relying on outsiders.", m:"Tesla making its own batteries instead of buying them — more control, more capital tied up, and no longer at a supplier's mercy on price or delays.", c:"Business Strategy"},
  "Value Chain": {p:"Every step — raw material to finished product to customer's hands — mapped out to see exactly where the value actually gets created.", m:"Helps a company spot where it's genuinely adding value, and where it's just paying someone else to do a step it doesn't need to own.", c:"Business Strategy"},
  "Disruptive Innovation": {p:"A cheaper, simpler, worse product that starts at the bottom of the market — and eventually eats the entire industry from below.", m:"Netflix's mail-order DVDs looked laughably worse than Blockbuster's stores. It didn't matter. It found the opening, and never stopped climbing.", c:"Business Strategy"},
  "Switching Costs": {p:"Everything that makes leaving your bank, your software, or your phone ecosystem more annoying than it's worth.", m:"Money, time, retraining, lost data — real switching costs are why companies with mediocre products can still keep customers for years.", c:"Business Strategy"},
  "Barriers to Entry": {p:"Whatever stops a random new competitor from just showing up and taking your customers tomorrow.", m:"Huge capital needs, patents, regulation, brand loyalty — airlines have brutal barriers to entry; opening a food truck barely has any.", c:"Business Strategy"},
  "Unit Economics": {p:"Do you actually make money on one single customer, or are you just losing money faster as you grow?", m:"A startup can have a million users and still be worthless if it loses ₹50 on every single order — scale just means losing money at scale.", c:"Business Strategy"},
  "TAM": {p:"The absolute ceiling — every rupee this business could ever make if it captured 100% of its market, everywhere.", m:"Total Addressable Market. Every pitch deck has a slide with this number, usually flattering, since it's your own estimate of your own opportunity.", c:"Business Strategy"},
  "Blue Ocean Strategy": {p:"Inventing a new market nobody's fighting over yet, instead of bleeding out competing in an existing one.", m:"Cirque du Soleil didn't try to out-circus Ringling Bros. It removed the animals, added theater, and created a category with zero direct competitors.", c:"Business Strategy"},
  "Flywheel Effect": {p:"A business loop where each part of the business makes every other part stronger, spinning faster the longer it runs.", m:"Amazon's version: lower prices bring more customers, more customers attract more sellers, more sellers mean more selection, more selection brings more customers.", c:"Business Strategy"},
  "ROI": {p:"The simplest question in investing: how much did you get back compared to what you put in?", m:"Net profit divided by cost, as a percentage. Doesn't account for how long it took — 20% over ten years is very different from 20% over one.", c:"Investment Analysis"},
  "ROE": {p:"How much profit a company generates for every rupee shareholders have invested.", m:"Net income divided by shareholder equity. A high ROE looks great — until you check whether debt, not efficiency, is doing the work.", c:"Investment Analysis"},
  "ROA": {p:"How efficiently a company turns everything it owns — not just shareholder money — into profit.", m:"Net income divided by total assets, debt included. Unlike ROE, a company can't flatter this one just by borrowing more.", c:"Investment Analysis"},
  "ROIC": {p:"How much return a company generates on all the capital it's actually deployed — debt and equity combined.", m:"Value investors often trust this more than ROE, precisely because leverage can't inflate it the way it inflates ROE.", c:"Investment Analysis"},
  "CAGR": {p:"The single smoothed-out growth rate that would take you from a starting value to an ending value over several years.", m:"Compound Annual Growth Rate. Hides the bumpy years in between — a steady climb and a wild swing can show the same CAGR.", c:"Investment Analysis"},
  "DCF": {p:"Valuing something today based on all the cash it's expected to generate in the future — discounted back to what that's worth now.", m:"Discounted Cash Flow. The foundational method behind most serious valuations; shortcuts like P/E are simplifications of this idea.", c:"Investment Analysis"},
  "Economic Moat": {p:"Whatever keeps competitors from eating a company's lunch — brand, patents, scale, switching costs.", m:"A term popularized by Warren Buffett. The wider the moat, the longer a company can keep charging more than a commodity price.", c:"Investment Analysis"},
  "Earnings Yield": {p:"Earnings per share flipped upside down — what percentage return the company's profits represent on its share price.", m:"The inverse of P/E. Useful for comparing a stock's return potential directly against a bond's yield.", c:"Investment Analysis"},
  "Capital Gains Yield": {p:"How much a security's price alone has risen, ignoring any dividends along the way.", m:"Total return has two parts: this, plus dividend yield. A stock can win on one and lose on the other.", c:"Investment Analysis"},
  "EVA": {p:"Whether a company actually created value, after accounting for the cost of the capital it used to do it.", m:"Profit alone isn't enough — if the return doesn't beat what investors could've earned elsewhere, EVA says value was destroyed, not created.", c:"Investment Analysis"},
  "EPV": {p:"What a company is worth based purely on its current earnings, assuming no future growth at all.", m:"A deliberately conservative valuation — strips out growth assumptions to show the value of the business as it stands today.", c:"Investment Analysis"},
  "ROCE": {p:"How efficiently a company uses the capital employed in its operations to generate profit.", m:"Operating profit divided by capital employed. A favourite of analysts comparing capital-heavy businesses like manufacturing or infrastructure.", c:"Investment Analysis"},
  "Operating Ratio": {p:"What share of a company's sales gets eaten up by its day-to-day operating costs.", m:"Lower is better — it means more of each rupee of revenue survives to become profit.", c:"Investment Analysis"},
  "Beta": {p:"How much a stock tends to move compared to the overall market.", m:"A beta of 1.5 means it swings 50% more than the market, up or down. Above 1 is more volatile than the market; below 1, less.", c:"Investment Analysis"},
  "Sharpe Ratio": {p:"Whether a fund's returns are actually good, or just came with a lot of extra risk attached.", m:"Excess return divided by volatility. A high-return fund with wild swings can score worse here than a steadier, humbler one.", c:"Investment Analysis"},
  "Sortino Ratio": {p:"Like the Sharpe Ratio, but it only punishes the downside — the volatility that actually hurts you.", m:"Upside swings don't count against a fund here, only the drops. A fairer lens for strategies that spike upward on purpose.", c:"Investment Analysis"},
  "Information Ratio": {p:"How consistently a fund manager beats their benchmark, not just by how much on average.", m:"Excess return over a benchmark, divided by how volatile that excess has been. Consistency scores higher than one lucky year.", c:"Investment Analysis"},
  "Treynor Ratio": {p:"Return earned per unit of market risk taken, using beta instead of total volatility.", m:"Close cousin of the Sharpe Ratio — but it only cares about risk you can't diversify away, not total ups and downs.", c:"Investment Analysis"},
  "Maximum Drawdown": {p:"The single worst peak-to-trough loss an investment has ever suffered.", m:"Doesn't matter how good the average return looks if the drawdown along the way would've forced you to sell in panic.", c:"Investment Analysis"},
  "YoY": {p:"Comparing this year's number to the same period last year, to strip out seasonal noise.", m:"A retailer's December sales always beat its January — YoY comparisons compare December to last December instead.", c:"Investment Analysis"},
  "MoM": {p:"Comparing this month's number to last month's, to catch short-term momentum quickly.", m:"Faster-moving than YoY, but noisier — one unusual month can swing the number without meaning much.", c:"Investment Analysis"},
  "EPS Growth": {p:"How much faster or slower a company's earnings per share are growing, period over period.", m:"The number that moves share prices most reliably — growth, or its absence, is what markets are really pricing in.", c:"Investment Analysis"},
  "Cash Conversion Ratio": {p:"How much of a company's accounting profit actually shows up as real cash in the bank.", m:"High profit, low cash conversion is a red flag — it usually means the 'profit' is sitting in unpaid invoices, not cash.", c:"Investment Analysis"},
  "Cash Coverage Ratio": {p:"How many times over a company's operating cash could pay its interest bill.", m:"EBITDA divided by cash interest expense. A thin cushion here means one bad quarter away from trouble.", c:"Investment Analysis"},
  "Dividend Coverage Ratio": {p:"How many times over a company's earnings could pay the dividend it just promised.", m:"A ratio near 1 means there's no room for a bad year — the dividend is only barely affordable.", c:"Investment Analysis"},
  "Accounts Receivable Turnover": {p:"How many times a year a company actually collects the money customers owe it.", m:"High turnover means customers pay fast. Low turnover means cash is sitting uncollected — a working capital problem waiting to happen.", c:"Investment Analysis"},
  "Fixed Cost": {p:"Expenses that stay the same no matter how much a company produces or sells.", m:"Rent, salaries, insurance — they show up on the bill whether the factory runs at 10% capacity or 100%.", c:"Investment Analysis"},
  "Variable Cost": {p:"Expenses that rise and fall directly with how much a company actually produces.", m:"Raw materials, packaging, shipping — make one more unit, spend a little more. Make zero, spend zero.", c:"Investment Analysis"},
  "Marginal Cost": {p:"The cost of producing just one more unit, nothing else.", m:"Businesses price around this number constantly — sell below marginal cost and every extra sale loses money.", c:"Investment Analysis"},
  "Operating Leverage": {p:"How much a company's profit swings when its sales move, based on how fixed its cost structure is.", m:"High fixed costs mean high operating leverage — small sales changes cause big profit swings, in both directions.", c:"Investment Analysis"},
  "Incremental Margin": {p:"How much of each additional rupee of revenue actually turns into profit.", m:"A business can grow revenue fast and still see incremental margin shrink, if the new growth costs more to serve.", c:"Investment Analysis"},
  "Long-Short Equity": {p:"A strategy that buys stocks expected to rise and shorts stocks expected to fall, at the same time.", m:"The classic hedge fund playbook — profit from being right on both sides, and cushion the portfolio if the market falls.", c:"Investment Analysis"},
  "Market Neutral Strategy": {p:"Balancing longs and shorts so the portfolio barely moves with the overall market at all.", m:"The goal isn't to predict where the market goes — it's to profit purely from picking winners over losers, regardless.", c:"Investment Analysis"},
  "Event-Driven Investing": {p:"Trading around a specific corporate event — a merger, bankruptcy, spin-off — rather than general market direction.", m:"The bet isn't 'is this a good company,' it's 'will this specific event play out the way the market hasn't priced in yet.'", c:"Investment Analysis"},
  "Active vs Passive Investing": {p:"Trying to beat the market by picking investments, versus just owning the whole market as it is.", m:"Passive (index funds) is cheaper and usually wins after fees. Active is the bet that a manager's skill is worth paying for.", c:"Investment Analysis"},
  "Dollar Cost Averaging": {p:"Investing a fixed amount on a regular schedule, regardless of whether prices are up or down.", m:"You buy more units when prices are low and fewer when they're high, smoothing out the average cost over time.", c:"Investment Analysis"},
  "Pricing Power": {p:"A company's ability to raise prices without customers walking away.", m:"The clearest sign of a strong economic moat — if a business can't raise prices, competition is doing its job.", c:"Investment Analysis"},
  "Market Share": {p:"The slice of total industry sales that belongs to one company.", m:"Rising market share in a growing industry is one of the best signs an investor can find.", c:"Investment Analysis"},
  "Bottom-Up Forecasting": {p:"Building a sales forecast from the ground up — unit by unit, customer by customer, product by product.", m:"Slower to build than top-down, but far harder to fool yourself with, since every assumption has to be justified individually.", c:"Investment Analysis"},
  "Top-Down Forecasting": {p:"Starting from the total market size, then estimating what slice of it one company can realistically capture.", m:"Faster and rougher than bottom-up — useful for a quick sanity check, dangerous as the only method you rely on.", c:"Investment Analysis"},
  "Horizontal Analysis": {p:"Lining up a company's financial statements side by side across several years to see what's actually changing.", m:"The simplest way to spot a trend — revenue growing steadily, or margins quietly eroding, year after year.", c:"Investment Analysis"},
  "Reverse DCF": {p:"Working backward from today's stock price to figure out what growth assumptions the market must already believe.", m:"Instead of asking 'what's this worth,' it asks 'what would have to be true for the current price to make sense.'", c:"Investment Analysis"},
};

"Market Colour": {

"Axe": {

  analogy:"Like a car salesman more eager to move a specific model off the lot because he's overstocked on it, a trader with an axe has a bias toward a specific trade because of a position they're already sitting on.",
  example:["A bond trader is sitting on a large, unwanted position in a particular corporate bond.","When a client calls asking for a price on a range of bonds, the trader quotes an especially attractive price on that specific one.","A sharp client asks directly: 'What's your axe here?'","The trader admits he's keen to reduce that position — the client now knows exactly why the price looked so good."],

"Block Trade": {
  analogyHead:"Selling a whole building, not one apartment at a time.",
  analogy:"Selling shares one small order at a time on the open market is like listing a hundred apartments individually — it works, but it moves the neighborhood's prices as you go. A block trade sells the whole building in one private, negotiated deal instead.",
  example:["A large mutual fund wants to sell 2 million shares of a mid-cap company — far more than the public order book could absorb without crashing the price.","Instead of dumping it on the exchange, the fund's broker quietly finds a single large buyer willing to take the whole block.","The two sides negotiate a price privately, slightly below the current market price to compensate the buyer for taking size.","The trade is agreed off-exchange and then reported to the market afterward, as required."],
  exampleHead:"2 million shares change hands, off the public book.",
  exampleCallout:"Negotiated privately, reported after",
  mistakes:[
    {think:"Block trades are illegal or hidden from regulators.", reality:"They're a legitimate, regulated way to trade large size — they just happen away from the public order book first, then get reported afterward, as the rules require."},
    {think:"A block trade always happens at the current market price.", reality:"It's usually priced at a discount (for a sale) or premium (for a purchase) to compensate the counterparty for taking on a large, hard-to-offload position."}
  ],
  related:["Order Book","Liquidity","Slippage","Institutional Investor"],
  quiz:{q:"Why is a large sale often done as a block trade instead of on the open order book?", options:["Because it's required by law for all large trades","Because dumping that size on the public book would move the price sharply against the seller","Because block trades are cheaper to execute in every case","Because retail investors aren't allowed to see large orders"], correct:1, explain:"A large order on the public order book can move the price against itself before it's even filled. A block trade avoids that by negotiating privately with one counterparty, then reporting after."}
},
"Bulge Bracket": {

"Elite Boutique": {

"Synergies": {
  analogyHead:"1 + 1 = 3 — on paper, at least.",
  analogy:"Like two friends realizing that sharing one apartment costs less than two separate ones, plus they can now split a car, synergies are the extra value companies claim they'll unlock together that neither could unlock alone.",
  example:["Two competing food delivery companies announce a merger, promising ₹200 crore in annual synergies.","Cost synergies come from shutting down duplicate warehouses and combining customer service teams.","Revenue synergies are projected from cross-selling each other's restaurant partnerships to a combined user base.","A year later, the cost synergies mostly materialize — the revenue synergies fall well short of the original promise."],

  exampleCallout:"Cost savings hit target; revenue gains don't",

    {think:"All synergies are the same kind of benefit.", reality:"Cost synergies (cutting overlapping expenses) are generally far more reliable and achievable than revenue synergies (growing sales together), which depend on customer behavior actually changing."}
  ],
  related:["M&A","Divestiture","Financial Sponsor","Coverage Group"],
  quiz:{q:"Which type of synergy is generally more reliable and easier to deliver?", options:["Revenue synergies, because sales always grow after a merger","Cost synergies, because cutting duplicate expenses is more directly controllable than growing combined sales","They're equally reliable in almost every deal","Neither type is ever realistic"], correct:1, explain:"Cost synergies — eliminating overlapping expenses — are largely within management's direct control. Revenue synergies depend on customers actually behaving differently, which is far less predictable."}
},
"Financial Sponsor": {
  analogyHead:"A landlord, not a homeowner.",
  analogy:"A strategic buyer purchases a company to live in it, like a homeowner. A financial sponsor buys it like a landlord buying a rental property — planning to improve it, extract value, and sell it on a few years later.",
  example:["A private equity firm buys a struggling regional retail chain for ₹800 crore.","As the financial sponsor, it installs new management, cuts costs, and expands into two new states.","Four years later, the company's profits have roughly doubled.","The sponsor sells the company to a larger strategic buyer for ₹1,600 crore, exiting the investment."],

  analogy:"An IPO is opening night — the first time tickets go on sale. A secondary offering is a later round of ticket sales for the same show, after it's already been running for a while.",

"Direct Listing": {
  analogyHead:"Opening the doors without a doorman deciding who gets in first.",
  analogy:"A traditional IPO is like a nightclub with a bouncer — the underwriter — controlling exactly who gets in and at what cover charge. A direct listing just opens the doors and lets the market decide the price on its own.",
  example:["A well-known consumer tech company with strong brand recognition decides it doesn't need underwriters to build investor demand — the market already knows it.","It chooses a direct listing: existing shareholders' shares simply start trading on the exchange.","No new shares are created and no roadshow sets a price in advance.","The opening price is discovered live, purely from real buy and sell orders on listing day."],

  mistakes:[

  related:["IPO","ECM","Underwriting","Secondary Offering"],

},
"Divestiture": {

  analogy:"Like a homeowner selling off part of their property they don't need, a divestiture is a company selling a division or unit to focus on what's actually working — turning an unwanted asset into cash.",

"Confirmation Bias": {
  analogyHead:"Reading only the reviews that agree with you.",
  analogy:"Like buying a car and then only reading five-star reviews of it, confirmation bias makes you seek out information that confirms a decision you've already made — and quietly ignore anything that challenges it.",
  example:["An investor buys shares in a renewable energy company, convinced it's the next big thing.","Every bullish article about the sector gets bookmarked and shared.","A detailed report questioning the company's debt levels gets dismissed as 'FUD' without being properly read.","Six months later, the company misses earnings on exactly the debt issue that report flagged."],
  exampleHead:"An investor only reads the news that agrees with them.",
  exampleCallout:"The warning sign was there — and ignored",
  mistakes:[
    {think:"Confirmation bias means deliberately lying to yourself.", reality:"It's usually unconscious — your brain just finds agreeing information more interesting and disagreeing information more annoying to engage with, without you ever choosing that."},
    {think:"Reading more news is the fix for confirmation bias.", reality:"More news doesn't help if you're only clicking on articles that already agree with you — the fix is deliberately seeking out the strongest opposing case, not just more information."}
  ],
  related:["Anchoring Bias","Overconfidence Bias","Herd Mentality","Recency Bias"],
  quiz:{q:"What's the actual mechanism behind confirmation bias?", options:["Deliberately ignoring facts you know are true","Unconsciously favoring information that agrees with a decision already made, while dismissing what challenges it","Only trusting information from certified analysts","Refusing to read financial news altogether"], correct:1, explain:"Confirmation bias is largely unconscious — it's not lying to yourself, it's your attention naturally gravitating toward agreement and away from friction."}
},
"Hindsight Bias": {
  analogyHead:"Predicting yesterday's weather, today.",
  analogy:"Like insisting you 'knew' a movie's twist ending was coming after you've already seen it, hindsight bias rewrites your memory of how uncertain something felt before it actually happened.",
  example:["A market crash wipes out 20% of an index's value over three weeks.","In the aftermath, an investor recalls a handful of warning signs and says 'I saw this coming.'","In reality, at the time, those same signs sat alongside dozens of other signals pointing in different directions.","The false certainty leads the investor to overtrade on the next 'obvious' signal — which turns out to be nothing."],
  exampleHead:"\"I saw the crash coming\" — three weeks after it happened.",
  exampleCallout:"Confidence built on a rewritten memory",
  mistakes:[
    {think:"If you correctly remember predicting an event, hindsight bias doesn't apply to you.", reality:"The bias is precisely in how convincingly your memory reconstructs a prediction that felt far less certain in the moment — genuine predictions made and recorded in advance are the only real exception."},
    {think:"Hindsight bias only affects overconfident people.", reality:"It's a near-universal feature of memory, not a personality flaw — everyone's brain compresses uncertainty into false clarity after the fact."}
  ],
  related:["Overconfidence Bias","Recency Bias","Survivorship Bias","Confirmation Bias"],
  quiz:{q:"What does hindsight bias actually distort?", options:["Your ability to do arithmetic","Your memory of how predictable an event felt before it happened","Your knowledge of historical stock prices","Your understanding of compound interest"], correct:1, explain:"Hindsight bias rewrites memory — after an event, the past feels far more predictable than it genuinely was at the time, even to the person recalling it."}
},
"Loss Aversion": {
  analogyHead:"Losing your umbrella hurts more than finding one feels good.",
  analogy:"Like feeling far worse about a stolen ₹500 note than you'd feel good about finding one, loss aversion means the pain of losing something outweighs the pleasure of gaining the same amount.",
  example:["An investor holds a stock that's fallen 30% from her purchase price.","Objectively, the company's prospects have worsened and she wouldn't buy it today at any price.","But selling would 'lock in' the loss, and that feels unbearable — so she keeps holding, hoping to at least break even.","The stock falls another 20% before she finally sells, far later and far lower than a clear-eyed decision would have."],
  exampleHead:"A losing stock gets held far too long.",
  exampleCallout:"Selling would make the loss feel 'real'",
  mistakes:[
    {think:"Loss aversion just means people don't like losing money.", reality:"It specifically means losses are felt roughly twice as intensely as equivalent gains — it's not dislike, it's a measurable asymmetry in how the brain weighs the same-sized amount."},
    {think:"The fix for loss aversion is to never sell at a loss.", reality:"That's the trap itself, not the fix — the fix is judging a position on whether you'd buy it today, not on what you originally paid for it."}
  ],
  related:["Disposition Effect","Sunk Cost Fallacy","Anchoring Bias","Overconfidence Bias"],
  quiz:{q:"Why does loss aversion make investors hold losing stocks too long?", options:["Because losing stocks always eventually recover","Because the pain of realizing a loss by selling outweighs the logic of cutting it, even psychologically","Because brokers charge extra fees for selling at a loss","Because losing stocks are usually undervalued"], correct:1, explain:"Loss aversion means the emotional pain of locking in a loss is disproportionately large — so investors often keep holding purely to avoid that feeling, not because the fundamentals justify it."}
},
"Anchoring Bias": {
  analogyHead:"The first price you hear becomes the only price that matters.",
  analogy:"Like a market vendor first quoting an outrageous price so their 'discount' feels generous, anchoring bias means the first number you encounter — even an irrelevant one — quietly sets the reference point for every judgment that follows.",
  example:["An investor buys a stock at ₹1,000, convinced it's headed to ₹1,500.","The stock instead falls to ₹600 on genuinely worse fundamentals.","He keeps describing it to friends as 'a ₹1,000 stock trading cheap,' rather than assessing it fresh at ₹600.","He holds on, anchored to a price the market has already made irrelevant."],
  exampleHead:"A stock's original price becomes a mental prison.",
  exampleCallout:"Still 'a ₹1,000 stock,' six months later",
  mistakes:[
    {think:"Anchoring only affects inexperienced investors.", reality:"It affects experienced professionals just as much — anchoring is a feature of how the brain processes numbers, not a sign of inexperience."},
    {think:"The purchase price is relevant information for deciding whether to sell.", reality:"What you paid is a sunk cost with no bearing on what the asset is worth today — the only relevant question is whether you'd buy it fresh, right now, at the current price."}
  ],
  related:["Loss Aversion","Confirmation Bias","Sunk Cost Fallacy","Recency Bias"],
  quiz:{q:"What makes anchoring bias so persistent, even for experienced investors?", options:["It only affects people with poor math skills","It's a fundamental feature of how the brain forms reference points around any number it encounters first","It only happens with round numbers","It's caused by broker recommendations"], correct:1, explain:"Anchoring is a deep-seated cognitive pattern — the first number encountered, however arbitrary, becomes a mental reference point that's hard to update, regardless of experience."}
},
"Herd Mentality": {

},

  analogy:"Like a gambler on a winning streak convinced they've cracked the game, overconfidence bias takes a handful of correct calls as proof of skill — right up until the market proves otherwise, expensively.",

"Recency Bias": {
  analogyHead:"Assuming today's weather is next year's forecast.",
  analogy:"Like assuming a sunny week means the monsoon is cancelled, recency bias treats the last few months of market behavior as a reliable preview of the future — even though markets have a long history of doing the opposite of whatever just happened.",
  example:["An index has risen steadily for eight straight months, with barely a down week.","An investor, extrapolating that trend, moves his entire emergency fund into equities, certain the calm run will continue.","A sharp correction hits the following month, driven by factors that had nothing to do with the prior eight months' trend.","He needs cash during the downturn and is forced to sell at a loss, right when the trend finally reversed."],

"Sunk Cost Fallacy": {
  analogyHead:"Finishing a bad meal because you already paid for it.",
  analogy:"Like eating a meal you're not enjoying just because you already paid the bill, the sunk cost fallacy means letting money already spent — which you can never get back either way — dictate a decision that should only be about what happens next.",
  example:["An investor has put ₹5 lakh into a stock that's now down 40%.","A friend asks if he'd buy the same stock today, at today's price, with fresh money — he says no, without hesitation.","Yet he keeps holding the position anyway, reasoning he's 'already this far in.'","The stock falls another 15% before he finally admits the original ₹5 lakh was gone regardless of what he did next."],

  mistakes:[

"Availability Heuristic": {
  analogyHead:"Judging shark attack odds by how many movies you've seen about sharks.",
  analogy:"Like overestimating how common shark attacks are because they make for such memorable news stories, the availability heuristic makes you judge how likely something is by how easily an example comes to mind — not by the actual numbers.",
  example:["An investor hears a viral story about someone who turned ₹50,000 into ₹50 lakh trading a small-cap stock.","He starts believing this kind of return is a realistic, achievable outcome for himself too.","He never hears the far more common stories of people who lost most of their capital chasing similar small-caps, since those stories rarely get told.","He allocates a dangerous share of his savings chasing a similarly dramatic outcome, based on one vivid, memorable story."],
  exampleHead:"One viral success story shapes an entire strategy.",
  exampleCallout:"The countless quiet losses never made the news",
  mistakes:[
    {think:"If you can easily recall an example of something, it must be common.", reality:"Vivid, dramatic, or emotionally striking stories are remembered far more easily than boring, common ones — memorability and actual statistical frequency are two very different things."},
    {think:"The availability heuristic only affects gullible people.", reality:"It's a basic feature of how everyone's memory works — vivid stories are simply easier to retrieve than dry statistics, regardless of intelligence or experience."}

  related:["Herd Mentality","Survivorship Bias","FOMO","Recency Bias"],
  quiz:{q:"What does the availability heuristic actually measure incorrectly?", options:["The exact price of a stock","How likely an outcome is, based on how easily an example comes to mind rather than real statistics","How much a broker charges in fees","The historical average return of an index"], correct:1, explain:"The availability heuristic substitutes 'how easily can I recall an example' for 'how likely is this, statistically' — and vivid, memorable stories get recalled far more easily than they actually occur."}
},
"Disposition Effect": {
  analogyHead:"Picking the ripe fruit and leaving the rotten one to rot further.",
  analogy:"Like harvesting your best tomatoes early while leaving the diseased plant in the ground hoping it recovers, the disposition effect means selling winners too early to lock in a good feeling, while holding losers too long to avoid a bad one.",

"Survivorship Bias": {
  analogyHead:"Judging a war's safety by interviewing only the soldiers who came home.",
  analogy:"Like concluding a dangerous mission was safe because everyone you interviewed survived it, survivorship bias means drawing conclusions from only the winners still visible today — while the failures have quietly disappeared from the data entirely.",

"Fiscal Policy": {
  analogyHead:"The government's checkbook and tax bill, not the central bank's lever.",
  analogy:"Like a household deciding how much to spend and how much to earn through extra work, fiscal policy is the government adjusting its own spending and taxation to stimulate or cool the economy — a completely different lever than the central bank's interest rates.",
  example:["Facing a slowing economy, the government announces a large increase in infrastructure spending and cuts income tax rates.","Construction companies see a surge in new government contracts, and consumers have more take-home pay to spend.","Overall economic activity picks up over the following quarters, partly driven by that fiscal stimulus.","The government's fiscal deficit widens as a result, since it's spending more while collecting relatively less in tax."],

  example:["The RBI raises the repo rate by 0.5% at its policy meeting to combat rising inflation.","Commercial banks' own cost of short-term borrowing from the RBI rises immediately.","Within weeks, banks raise their home loan and personal loan rates to customers to preserve their lending margins.","A homebuyer with a floating-rate mortgage sees their monthly EMI increase directly as a result of that single RBI decision."],
  exampleHead:"One RBI decision raises a homeowner's monthly EMI.",
  exampleCallout:"Repo hike → bank rates → higher EMI",
  mistakes:[
    {think:"The repo rate only affects large banks and financial institutions.", reality:"It ultimately flows down to ordinary borrowers and savers too — home loan EMIs, fixed deposit returns, and business borrowing costs all move in response to repo rate changes."},
    {think:"Repo rate and inflation are unrelated numbers.", reality:"The repo rate is the RBI's primary tool for managing inflation — raising it to cool an overheating, inflationary economy, or cutting it to stimulate a sluggish one."}
  ],
  related:["Interest Rate","Monetary Policy","CPI","Inflation"],
  quiz:{q:"Why does a repo rate change affect an ordinary home loan borrower?", options:["It doesn't — repo rate only affects government bonds","Because banks adjust their own lending rates, including home loans, to reflect their changed cost of borrowing from the RBI","Because the RBI directly sets every individual's loan rate","Because repo rate changes only affect people with fixed deposits"], correct:1, explain:"The repo rate is what the RBI charges banks — when it changes, banks pass that changed cost through to their own lending rates, including home loans, personal loans, and business credit."}
},
"Porter's Five Forces": {
  analogyHead:"Five questions that decide if a neighborhood is worth opening a shop in.",
  analogy:"Like scouting a neighborhood before opening a shop — checking rival stores, new competitors moving in, supplier bargaining power, customer bargaining power, and cheaper substitutes nearby — Porter's Five Forces scores an entire industry the same way before anyone invests a rupee.",
  example:["An investor is deciding between investing in an airline and a luxury handbag maker.","Running Porter's Five Forces on airlines: intense rivalry, low barriers for new entrants, powerful supplier unions and fuel costs, price-sensitive customers, and easy substitutes like trains — a brutal combination.","Running it on the luxury brand: limited rivalry at that price point, high barriers to entry (brand heritage can't be copied), price-insensitive customers, and few real substitutes.","The Five Forces analysis alone explains why luxury brands sustain high margins for decades while airlines chronically struggle to stay profitable."],
  exampleHead:"Two industries, scored on the same five questions.",
  exampleCallout:"The forces explain the margin gap directly",
  mistakes:[
    {think:"Porter's Five Forces analyzes a single company's strategy.", reality:"It analyzes the entire industry's structure — how attractive or brutal the competitive landscape is for everyone in it, before even looking at one specific company's execution."},
    {think:"An industry with strong Five Forces will always make every company in it profitable.", reality:"A favorable industry structure raises the odds, but a poorly run company can still fail even in a great industry — the framework assesses the playing field, not any single player's skill on it."}
  ],
  related:["SWOT Analysis","Barriers to Entry","Economic Moat","Switching Costs"],
  quiz:{q:"What does Porter's Five Forces framework actually analyze?", options:["A single company's financial statements","The structural attractiveness of an entire industry, based on competitive pressures","A country's overall economic growth","A stock's historical price chart"], correct:1, explain:"The framework scores an industry as a whole — rivalry, new entrants, suppliers, buyers, and substitutes — to judge how structurally profitable that industry tends to be, before assessing any one company within it."}
},
"SWOT Analysis": {
  analogyHead:"A napkin-sized gut check, inward and outward.",
  analogy:"Like doing a quick personal check-in — what am I good at, what am I bad at, what opportunity is coming up, what threat should I watch — SWOT Analysis does the same four-box check for a company, split between looking inward and looking outward.",
  example:["A mid-sized Indian retailer is deciding whether to expand into e-commerce.","Its Strengths: strong brand trust and existing store network. Weaknesses: no in-house tech team or logistics experience.","Opportunities: rapidly growing online shopping in tier-2 cities. Threats: larger e-commerce players already entrenched with lower prices.","The SWOT makes clear the retailer should partner with an existing logistics platform rather than build e-commerce capability entirely from scratch."],
  exampleHead:"A four-box check shapes an expansion decision.",
  exampleCallout:"Partner, don't build from scratch",
  mistakes:[
    {think:"SWOT Analysis is a rigorous, quantitative financial tool.", reality:"It's a simple, qualitative brainstorming framework — useful for organizing thinking quickly, but it doesn't replace deeper financial or competitive analysis."},
    {think:"Strengths and Opportunities are basically the same category, just worded differently.", reality:"Strengths and Weaknesses describe the company itself (internal); Opportunities and Threats describe the external environment around it — mixing the two up defeats the framework's whole purpose."}
  ],
  related:["Porter's Five Forces","Core Competency","Economic Moat","Value Chain"],
  quiz:{q:"What's the key distinction SWOT Analysis draws between its four boxes?", options:["There is no real distinction, all four boxes are interchangeable","Strengths and Weaknesses look inward at the company itself; Opportunities and Threats look outward at the environment","SWOT only applies to publicly traded companies","Strengths and Opportunities are both about competitors"], correct:1, explain:"SWOT splits its four boxes along an internal/external line — Strengths and Weaknesses assess the company itself, while Opportunities and Threats assess the surrounding market and environment."}
},
"Core Competency": {
  analogyHead:"The one dish a restaurant is actually known for.",
  analogy:"Like a restaurant that's famous for one specific dish nobody else can replicate, a company's core competency is the one thing it does so distinctively well that competitors genuinely can't copy it — everything else is just supporting that.",
  example:["A consumer electronics company considers whether to start manufacturing its own semiconductor chips in-house.","Its actual core competency is product design and software integration, not chip fabrication.","Instead of building unproven chip-manufacturing capability, it partners with an established chipmaker and focuses its resources on what it's already best at.","The products that ship keep winning on design and user experience — exactly where the company's real edge lies."],
  exampleHead:"A company stays focused on what it's actually best at.",
  exampleCallout:"Partners on chips, doubles down on design",
  mistakes:[
    {think:"A core competency is just any activity a company happens to do.", reality:"It specifically means a distinctive capability competitors can't easily replicate — something merely done routinely, without a real edge, doesn't qualify as a core competency."},
    {think:"Companies should try to build core competencies in as many areas as possible.", reality:"Spreading focus across too many areas usually dilutes a company's actual edge — the concept exists specifically to help companies identify what to focus resources on, not to expand everywhere."}
  ],
  related:["Economic Moat","SWOT Analysis","Vertical Integration","Switching Costs"],
  quiz:{q:"What specifically defines a company's 'core competency'?", options:["Any activity the company performs regularly","A distinctive capability the company does so well that competitors genuinely can't easily replicate it","The company's largest revenue-generating product line","The company's headquarters location"], correct:1, explain:"A core competency isn't just routine activity — it's a genuinely hard-to-replicate capability that gives the company a real, sustained edge over competitors."}
},
"Economies of Scale": {
  analogyHead:"Buying in bulk, but for an entire factory.",
  analogy:"Like a family saving money by buying rice in a 25kg sack instead of small daily packets, economies of scale mean the bigger a company's production gets, the cheaper each individual unit becomes to make — the same fixed costs, spread over far more output.",
  example:["A small regional bakery and a national bread manufacturer both buy flour.","The national manufacturer buys flour by the truckload, negotiating a far lower price per kilogram than the small bakery ever could.","It also spreads the cost of its factory, equipment, and management across millions of loaves rather than a few hundred.","As a result, the national manufacturer can profitably sell bread at a price the small bakery can't match without losing money."],
  exampleHead:"The same flour, at a dramatically different price per kilo.",
  exampleCallout:"Millions of loaves absorb the same fixed costs",
  mistakes:[
    {think:"Economies of scale mean a company just has more total revenue.", reality:"It specifically means the cost per unit falls as volume rises — a company can have huge revenue without genuine economies of scale if its per-unit costs aren't actually dropping."},
    {think:"Bigger companies always have economies of scale automatically.", reality:"Scale has to be actively managed and leveraged — a large company with inefficient operations can still have higher unit costs than a smaller, leaner competitor."}
  ],
  related:["Barriers to Entry","Unit Economics","Vertical Integration","Fixed Cost"],
  quiz:{q:"What specifically defines economies of scale?", options:["A company having very high total revenue","The cost of producing each individual unit falling as total production volume rises","A company operating in many different countries","A company having a large number of employees"], correct:1, explain:"Economies of scale specifically refer to falling per-unit costs as volume grows — spreading the same fixed costs over ever more output, not simply having a large total size."}
},
"Network Effect": {
  analogyHead:"A phone is useless if you're the only one who owns one.",
  analogy:"Like an early telephone being worthless if nobody else had one to call, a product with a network effect gets more valuable to every existing user specifically because more new people are joining — value that compounds with each new user, not something built once and left alone.",
  example:["A new messaging app launches with excellent features but almost no existing users.","A user finds it technically superior to WhatsApp, but nobody she knows uses it, so she can't actually message anyone she cares about.","She reluctantly stays on WhatsApp, purely because everyone she needs to reach is already there — regardless of which app has better features.","WhatsApp's dominant position, built on this exact dynamic, becomes extremely difficult for any technically superior competitor to break."],
  exampleHead:"A better app loses to the one everyone's already on.",
  exampleCallout:"Features lose to the network, every time",
  mistakes:[
    {think:"Network effects mean a product simply has a lot of existing users.", reality:"It specifically means each additional user makes the product more valuable for all existing users too — a large user base without that reinforcing dynamic isn't a true network effect."},
    {think:"A superior product will always eventually win, network effect or not.", reality:"Network effects can make an objectively worse product durably win over a better one, precisely because switching means losing access to everyone else already on the dominant platform."}
  ],
  related:["Switching Costs","Economic Moat","Barriers to Entry","Flywheel Effect"],
  quiz:{q:"What makes a network effect different from simply having many users?", options:["Nothing, they're the same thing","Each new user specifically makes the product more valuable for every existing user, not just adding to a headcount","Network effects only apply to social media apps","A network effect means the product is free to use"], correct:1, explain:"A true network effect means value compounds with each new user for everyone already on the platform — simply having a large user count without that reinforcing dynamic isn't the same thing."}
},
"First-Mover Advantage": {
  analogyHead:"Planting your flag first — or paying to clear the land for someone else.",
  analogy:"Like the first person to open a coffee shop on an unproven street either building loyal regulars before anyone else arrives, or discovering the street has no foot traffic and quietly funding the market research for whoever opens next door, first-mover advantage can cut either way.",
  example:["A company launches the first food delivery app in a new city, spending heavily to educate consumers on ordering food online.","It builds an early lead in brand recognition and locks in restaurant partnerships before any competitor shows up.","A well-funded rival launches eighteen months later, having watched the first mover's mistakes and skipping the expensive early education phase entirely.","The rival captures market share faster than the pioneer did, having avoided paying to educate a market that already existed by the time it arrived."],
  exampleHead:"The pioneer funds the education; the follower reaps it.",
  exampleCallout:"Second mover skips the expensive lessons",
  mistakes:[
    {think:"Being first to market guarantees long-term success.", reality:"Being first also means bearing the cost of educating an unproven market and making the first mistakes — a well-resourced fast follower can often learn from those mistakes and overtake the pioneer."},
    {think:"First-mover advantage is equally strong in every industry.", reality:"It matters far more where switching costs or network effects lock in early users (like social platforms) than in industries where customers switch easily based on price or features alone."}
  ],
  related:["Network Effect","Switching Costs","Disruptive Innovation","Barriers to Entry"],
  quiz:{q:"What's a real risk that comes with being the first mover in a market?", options:["First movers are legally required to share their technology","The first mover bears the cost of educating an unproven market, which a fast follower can then exploit without paying that cost","First movers can never raise investment capital","There is no risk at all to being first"], correct:1, explain:"Being first means funding the expensive work of proving a market exists and educating customers — costs a later, faster follower can often avoid while still capturing significant share."}
},
"Vertical Integration": {
  analogyHead:"Owning the farm, not just the restaurant.",
  analogy:"Like a restaurant deciding to buy its own farm instead of relying on a produce supplier, vertical integration means a company acquiring the suppliers or distributors around it — trading reliance on outsiders for more control, at the cost of more capital tied up.",
  example:["An electric vehicle maker relies entirely on outside suppliers for its batteries, a critical and volatile-priced component.","It decides to build its own battery factories instead, vertically integrating that part of its supply chain.","This requires a massive upfront capital investment and new manufacturing expertise the company didn't previously have.","In exchange, it gains control over battery costs and supply, no longer at the mercy of external suppliers' price hikes or shortages."],
  exampleHead:"An EV maker builds its own batteries instead of buying them.",
  exampleCallout:"More control, more capital tied up",
  mistakes:[
    {think:"Vertical integration is always the smarter strategic choice for a growing company.", reality:"It trades flexibility and lower capital needs for more control — for many companies, staying focused and relying on specialized outside suppliers remains the better trade-off."},
    {think:"Vertical integration means merging with a direct competitor.", reality:"It specifically means acquiring or building capabilities up or down your own supply chain — suppliers or distributors — not combining with a company that makes the same product as you."}
  ],
  related:["Economies of Scale","Core Competency","Value Chain","Barriers to Entry"],
  quiz:{q:"What does vertical integration specifically involve?", options:["Merging with a direct competitor selling the same product","A company acquiring or building the suppliers or distributors in its own supply chain","Expanding into a completely unrelated industry","Cutting costs by laying off staff"], correct:1, explain:"Vertical integration means moving up or down your own supply chain — owning suppliers or distributors — trading reliance on outsiders for more control, distinct from merging with a competitor."}
},
"Value Chain": {
  analogyHead:"Mapping every step from raw material to your hands.",
  analogy:"Like tracing a cup of coffee from the farm that grew the beans, to the roaster, to the café that serves it, a value chain maps every single step between raw material and finished product — making clear exactly where value actually gets added along the way.",
  example:["A clothing brand maps its entire value chain: cotton farming, fabric weaving, garment manufacturing, distribution, and retail.","It discovers that manufacturing and retail capture most of the profit margin, while raw fabric production is a low-margin commodity step.","Based on this, it decides to keep manufacturing and retail in-house, but outsource fabric weaving to specialized, cost-efficient partners.","The company's overall margins improve, because it's now focused on the value chain steps where it genuinely adds — and captures — the most value."],
  exampleHead:"Mapping the chain reveals where the real margin sits.",
  exampleCallout:"Outsourcing the low-margin step, keeping the rest",
  mistakes:[
    {think:"A value chain is the same thing as a supply chain.", reality:"A supply chain focuses on the physical flow of materials and logistics; a value chain specifically analyzes where value — and margin — is created or lost at each step, a broader strategic lens."},
    {think:"Every step in a value chain adds roughly equal value.", reality:"Value is usually concentrated unevenly — some steps (like design or branding) often capture disproportionately more margin than others (like raw commodity production)."}
  ],
  related:["Vertical Integration","Core Competency","Unit Economics","Economies of Scale"],
  quiz:{q:"What does value chain analysis specifically aim to reveal?", options:["The company's total number of employees","Exactly where value and profit margin are actually created at each step, from raw material to finished product","The company's stock price history","The names of the company's competitors"], correct:1, explain:"Value chain analysis maps each step from raw material to finished product specifically to show where value and margin are genuinely created — helping a company decide what to keep in-house versus outsource."}
},
"Disruptive Innovation": {
  analogyHead:"Sneaking in through the cheap seats, then taking over the whole theater.",
