  example:["A software company has very high fixed costs (engineering salaries, servers) and very low variable costs per additional customer.","A 20% rise in its sales flows almost entirely to the bottom line, since serving each new customer costs it very little extra — profit rises much more than 20%.","A grocery store, by contrast, has much lower operating leverage: a 20% sales rise comes with a roughly proportional rise in cost of goods sold, so profit rises closer to 20% as well.","In a downturn, that same high operating leverage works brutally in reverse for the software company — a 20% sales drop can cause a far larger percentage drop in profit."],
  exampleHead:"The same 20% sales move, wildly different profit impact.",
  exampleCallout:"High operating leverage amplifies both directions",
  mistakes:[
    {think:"High operating leverage is always good for a company.", reality:"It amplifies profit swings in both directions — a blessing when sales are rising, but a serious risk when sales fall, since fixed costs don't shrink along with reduced revenue."},
    {think:"Operating leverage and financial leverage (debt) are the same concept.", reality:"Operating leverage refers specifically to a company's mix of fixed versus variable operating costs; financial leverage refers to debt used to fund the business — related concepts, but genuinely distinct sources of amplified risk and return."}
  ],
  related:["Fixed Cost","Variable Cost","Incremental Margin","Marginal Cost"],
  quiz:{q:"Why does high operating leverage become risky during a sales downturn?", options:["High operating leverage has no effect during downturns","Fixed costs don't shrink along with falling sales, so profit can fall by a much larger percentage than the sales decline itself","It means the company automatically has more debt","It only affects companies in the technology sector"], correct:1, explain:"With high operating leverage, a large share of costs are fixed and don't decrease when sales fall — meaning a modest sales decline can translate into a much steeper percentage drop in profit."}
},
"Incremental Margin": {
  analogyHead:"How much of the next rupee earned actually sticks, as profit.",
  analogy:"Like noticing that your first customer of the day barely covers overhead, but your fiftieth customer is almost pure profit since the shop's already open and staffed, incremental margin measures how much of each additional rupee of revenue actually converts into profit.",
  example:["A subscription software company's incremental margin is very high, since each new customer costs it very little extra to serve once the core platform already exists.","Revenue grows 30% in a year, and profit grows nearly 45%, since most of that new revenue converts efficiently into extra profit.","A logistics company's incremental margin is much lower, since each new delivery requires genuinely more fuel, more drivers, and more vehicles.","Its revenue also grows 30%, but profit grows only about 20%, since serving that growth costs meaningfully more as it scales."],
  exampleHead:"Two companies, same 30% revenue growth, very different profit growth.",
  exampleCallout:"High vs. low incremental margin explains the gap",
  mistakes:[
    {think:"Incremental margin is the same thing as a company's overall profit margin.", reality:"Overall profit margin reflects the average across all revenue earned to date; incremental margin specifically isolates the profitability of the newest, most recent revenue added — and the two can differ meaningfully."},
    {think:"A company growing revenue fast automatically has a growing profit margin too.", reality:"If incremental margin on new growth is actually lower than the existing average margin, fast revenue growth can quietly drag the overall profit margin down over time, not up."}
  ],
  related:["Operating Leverage","Fixed Cost","Variable Cost","Marginal Cost"],
  quiz:{q:"What does a company's incremental margin specifically isolate?", options:["The average profitability across all revenue ever earned","How profitable the most recently added, incremental revenue specifically is, which can differ from the company's overall average margin","The tax rate applied to new revenue","The dividend paid on new shares issued"], correct:1, explain:"Incremental margin looks specifically at the newest revenue added, not the blended average across everything already earned — a company's overall margin can rise or fall depending on whether new growth is more or less profitable than its existing base."}
},
"Long-Short Equity": {
  analogyHead:"Betting on winners, while betting against losers, at the same time.",
  analogy:"Like a sports bettor placing money on their favorite team to win while simultaneously betting against a rival team they think will lose, a long-short equity strategy buys stocks expected to rise while shorting stocks expected to fall, at the same time.",
  example:["A hedge fund manager identifies two similar consumer companies in the same sector.","She believes Company A's new product line will drive strong growth, while Company B is losing market share to competitors.","She goes long Company A and short Company B, in roughly matched dollar amounts.","If the whole sector falls due to a broad market downturn, her long position drops — but so does her short position's price, generating an offsetting gain that cushions the overall portfolio."],
  exampleHead:"A paired bet across two companies in the same sector.",
  exampleCallout:"The short position cushions a sector-wide downturn",
  mistakes:[
    {think:"Long-short equity strategies are simply about picking good stocks and avoiding bad ones.", reality:"The distinguishing feature is holding both long and short positions simultaneously, specifically to profit from the gap between winners and losers — not just avoiding stocks expected to underperform."},
    {think:"Long-short equity strategies always make money regardless of overall market direction.", reality:"They aim to reduce (not eliminate) exposure to broad market moves — a poorly matched or badly executed long-short portfolio can still lose money in either a rising or falling market."}
  ],
  related:["Long / Short","Market Neutral Strategy","Hedge Fund","Hedge"],
  quiz:{q:"What's the defining feature of a long-short equity strategy?", options:["Only buying stocks expected to rise","Simultaneously holding long positions in expected winners and short positions in expected losers, to profit from the gap between them","Only investing in bonds, never stocks","Avoiding the stock market entirely during downturns"], correct:1, explain:"Long-short equity specifically combines long and short positions at the same time, aiming to profit from the relative performance gap between the two — a structurally different bet than simply picking stocks to own."}
},
"Market Neutral Strategy": {
  analogyHead:"Balancing the see-saw so it barely moves, whichever way the market tips.",
  analogy:"Like balancing a see-saw so precisely that it stays roughly level no matter who sits on which side, a market neutral strategy balances longs and shorts so the portfolio's overall value barely moves with the broader market at all.",
  example:["A fund manager builds a portfolio with ₹100 crore in long positions and ₹100 crore in short positions, carefully matched in overall market sensitivity (beta).","The broader market falls sharply by 10% due to a macroeconomic shock unrelated to any of her individual stock picks.","Her long positions fall roughly in line with the market, but her short positions rise by a similar amount, largely offsetting each other.","Her portfolio ends up roughly flat despite the market turmoil — her actual profit or loss instead comes purely from how well her individual long and short picks performed relative to each other."],
  exampleHead:"A 10% market crash, and the portfolio barely moves.",
  exampleCallout:"Longs and shorts offset the market-wide shock",
  mistakes:[
    {think:"A market neutral strategy means avoiding the stock market entirely.", reality:"It specifically means being fully invested — long and short simultaneously — but structured so broad market direction has minimal net effect on the portfolio's overall value."},
    {think:"A market neutral strategy guarantees positive returns regardless of stock picking skill.", reality:"Neutralizing market exposure doesn't eliminate the need for skill — profit or loss still depends entirely on whether the manager's specific long and short picks perform relatively as expected."}
  ],
  related:["Long-Short Equity","Beta","Hedge","Event-Driven Investing"],
  quiz:{q:"What is a market neutral strategy specifically designed to minimize?", options:["The number of stocks in a portfolio","The portfolio's overall sensitivity to broad market direction, by balancing long and short positions","The management fees charged by a fund","The total amount of capital invested"], correct:1, explain:"A market neutral strategy deliberately balances long and short exposure so the portfolio's value is largely insulated from broad market moves — profit instead comes from the relative performance between the specific longs and shorts chosen."}
},
"Event-Driven Investing": {
  analogyHead:"Betting on how a specific plot twist plays out, not the whole movie.",
  analogy:"Like betting on the outcome of one specific courtroom trial rather than on the general reputation of the law firm involved, event-driven investing trades around one specific corporate event — a merger, a bankruptcy, a spin-off — rather than a general view on the company overall.",
  example:["Company A announces it will acquire Company B, offering ₹500 per share in a deal expected to close in six months.","Company B's stock trades at ₹480, a discount reflecting the market's uncertainty about whether the deal will actually close as announced.","An event-driven investor buys Company B's stock at ₹480, betting specifically that the merger will close successfully, capturing that ₹20 gap.","If the deal does close as expected, she earns that spread — a return driven purely by the specific event playing out, unrelated to the broader stock market's direction."],
  exampleHead:"Betting on a merger closing, not on the broader market.",
  exampleCallout:"₹20 spread captured, if the deal closes",
  mistakes:[

"Active vs Passive Investing": {
  analogyHead:"Paying a chef to cook for you, versus just buying the whole grocery store.",
  analogy:"Like choosing between hiring a chef to hand-pick and prepare each ingredient, versus simply buying every ingredient in the store and eating it as-is, active investing means paying a manager to select investments, while passive investing means simply owning the whole market as it is.",
  example:["An investor puts ₹10 lakh into an actively managed fund charging a 1.5% annual fee, betting on the manager's stock-picking skill.","A friend puts the same ₹10 lakh into a passive index fund charging just 0.1% a year, simply tracking the broader market.","Over ten years, the active fund's manager does deliver some genuine outperformance before fees — but after subtracting the higher fee, her net return actually trails the passive fund's.","The friend's passive investment, despite requiring no stock-picking skill at all, ends up with the higher net return purely due to the dramatically lower ongoing cost."],
  exampleHead:"Real stock-picking skill, erased by fees.",
  exampleCallout:"The passive fund wins on cost alone, after ten years",
  mistakes:[
    {think:"Active management always underperforms passive investing, everywhere and always.", reality:"On average and after fees, passive tends to win more often than not — but individual active managers and specific market segments (like less-researched small-caps) can genuinely outperform over some periods; it's a probabilistic tendency, not an absolute rule."},
    {think:"Passive investing means doing no research or thinking at all.", reality:"Choosing which index to track, how to allocate across asset classes, and when to rebalance still involves real decisions — passive removes individual stock-picking, not investment decision-making altogether."}
  ],
  related:["Information Ratio","Dollar Cost Averaging","Sharpe Ratio","Index Fund"],
  quiz:{q:"Why did the passive fund in the example outperform the active fund's net return, despite the active manager delivering genuine outperformance before fees?", options:["The active manager's stock picks were all wrong","The active fund's higher ongoing fee ate into its outperformance enough to leave its net return below the passive fund's","Passive funds are guaranteed to always beat active funds","Index funds don't charge any fees at all"], correct:1, explain:"Even genuine pre-fee outperformance can be erased once a fund's higher costs are subtracted — this is exactly why fees matter so much when comparing active and passive investment options over long periods."}
},
"Dollar Cost Averaging": {
  analogyHead:"Buying groceries the same amount each week, whatever the price that week.",
  analogy:"Like buying the same fixed amount of rice every week regardless of whether the price that week is high or low, dollar cost averaging invests a fixed amount on a regular schedule — buying more units when prices are cheap, fewer when they're expensive.",
  example:["An investor commits to investing ₹10,000 every month into an index fund, regardless of what the market is doing that month.","In a month when the fund's price is low, her fixed ₹10,000 buys more units than usual.","In a month when the price is high, the same ₹10,000 buys fewer units.","Over several years, her average purchase price ends up smoother than if she'd tried to time single lump-sum investments at specific moments, and she avoided ever needing to correctly predict market timing."],
  exampleHead:"The same ₹10,000, buying different amounts every month.",
  exampleCallout:"A smoothed average cost, with zero market timing required",
  mistakes:[
    {think:"Dollar cost averaging guarantees a better outcome than investing a lump sum all at once.", reality:"Historically, investing a lump sum immediately has actually outperformed dollar cost averaging on average, simply because markets tend to rise over time — DCA's real benefit is reducing regret and behavioral risk, not maximizing expected returns."},
    {think:"Dollar cost averaging eliminates investment risk entirely.", reality:"It smooths the entry price over time, but the investment itself still carries full market risk — DCA doesn't protect against a genuinely bad long-term investment, only against poor single-point timing."}
  ],
  related:["Active vs Passive Investing","CAGR","Index Fund","Beta"],
  quiz:{q:"What is dollar cost averaging's main behavioral benefit, even though lump-sum investing often wins on average returns?", options:["It guarantees higher returns than any other strategy","It removes the pressure of trying to correctly time a single entry point, reducing regret and emotional decision-making","It eliminates all investment risk","It only works for very wealthy investors"], correct:1, explain:"Dollar cost averaging's real edge isn't higher expected returns — lump-sum investing tends to win there on average — but rather removing the psychological burden of trying to time a single perfect entry point."}
},
"Pricing Power": {
  analogyHead:"Can you raise prices without customers walking straight to a rival?",
  analogy:"Like a beloved neighborhood restaurant that can raise its prices a little each year without losing regulars, while a generic fast-food chain risks losing customers over a small price hike, pricing power is a company's ability to raise prices without customers walking away.",
  example:["A well-known consumer brand raises its prices 8% during a period of rising input costs.","Sales volume barely dips, since loyal customers are willing to pay the higher price for the brand they trust.","A generic competitor selling a similar product tries the same 8% price hike.","Its customers, with far less brand loyalty, switch to cheaper alternatives in large numbers, and its sales volume drops sharply."],
  exampleHead:"The same 8% price hike, very different customer reactions.",
  exampleCallout:"Brand loyalty absorbs the hike; the generic doesn't",
  mistakes:[
    {think:"Any company can simply choose to have pricing power if it decides to raise prices.", reality:"Pricing power comes from genuine customer loyalty, differentiation, or lack of easy substitutes — a company without those underlying advantages will simply lose customers if it raises prices, regardless of intent."},
    {think:"Pricing power means charging the highest price possible.", reality:"It's about the ability to raise prices without meaningfully losing volume — a company can have real pricing power while still choosing to price moderately for strategic reasons."}
  ],
  related:["Economic Moat","Market Share","Barriers to Entry","Switching Costs"],
  quiz:{q:"What determines whether a company genuinely has pricing power?", options:["Simply deciding to raise its prices","Whether customers stay loyal and keep buying even after prices rise, due to real differentiation or lack of substitutes","How large the company's total revenue is","The company's stock price"], correct:1, explain:"Pricing power is proven by customer behavior after a price increase — genuine brand loyalty or differentiation lets a company raise prices without losing much volume, while a company without those advantages simply loses customers instead."}
},
"Market Share": {
  analogyHead:"Your slice of the whole industry's pie.",
  analogy:"Like tracking what percentage of all pizza sold in a city comes from your specific pizzeria, market share is the slice of total industry sales that belongs to one particular company.",
  example:["A smartphone maker sells 20 million units in a market where 200 million total units were sold that year, giving it a 10% market share.","The following year, it sells 25 million units, while the total market grows to 220 million units, giving it a market share of about 11.4%.","An investor notes the company gained market share even in a growing market — its own sales grew faster than the industry as a whole.","That combination — a growing market, and rising share within it — is one of the clearer signals of genuine competitive strength an investor can look for."],
  exampleHead:"Sales grew, and so did the slice of a growing pie.",
  exampleCallout:"10% to 11.4% share, in an expanding market",
  mistakes:[
    {think:"Rising total sales always means a company is gaining market share.", reality:"If the overall market is growing faster than the company's own sales, its market share can actually be shrinking even while its absolute sales figure rises — share is relative to the whole industry, not an absolute number."},
    {think:"Market share alone tells you whether a company is profitable.", reality:"A company can win market share by pricing aggressively at thin or negative margins — high market share and strong profitability aren't automatically the same thing."}
  ],
  related:["TAM","Pricing Power","Economies of Scale","Economic Moat"],
  quiz:{q:"Can a company's absolute sales grow while its market share actually shrinks?", options:["No, this is mathematically impossible","Yes — if the overall market is growing faster than the company's own sales, its relative share of that market can shrink even as its absolute sales rise","Market share only applies to technology companies","Yes, but only if the company is losing money"], correct:1, explain:"Market share is a relative measure — a company's sales can grow in absolute terms while still losing ground relative to an industry that's growing even faster, meaning its market share declines despite higher sales."}
},
"Bottom-Up Forecasting": {
  analogyHead:"Building the sales forecast one brick — one customer — at a time.",
  analogy:"Like estimating a wedding's total food cost by counting each individual dish per guest, rather than guessing a lump sum for 'catering,' bottom-up forecasting builds a sales projection from the ground up — unit by unit, customer by customer, product by product.",
  example:["A sales team building next year's revenue forecast starts with each individual sales rep's own pipeline of specific prospective deals.","Each rep estimates the probability and expected value of every deal in their pipeline individually.","These individual, granular estimates are added up across the entire sales team to build the company's total forecast.","Because every assumption is tied to a specific, real prospective customer, the finance team can question and stress-test the forecast deal by deal, rather than accepting one vague, top-level guess."],
  exampleHead:"A forecast built deal by deal, then summed up.",
  exampleCallout:"Every assumption traceable to a real prospect",
  mistakes:[
    {think:"Bottom-up forecasting is always faster and easier than top-down forecasting.", reality:"It's actually slower and more labor-intensive to build, since it requires granular, individually justified assumptions — its advantage is rigor and accountability, not speed."},
    {think:"A bottom-up forecast is automatically more accurate than a top-down one.", reality:"It's harder to fool yourself with unjustified assumptions, but it can still be wrong if individual assumptions (like each sales rep's deal probability) are systematically too optimistic — rigor doesn't guarantee accuracy."}
  ],
  related:["Top-Down Forecasting","Horizontal Analysis","EPS Growth","Reverse DCF"],
  quiz:{q:"What's the main advantage of bottom-up forecasting over top-down forecasting?", options:["It's always faster to complete","Every individual assumption is granular and specifically justified, making the overall forecast harder to fool yourself with","It requires no data at all","It's only used by government agencies"], correct:1, explain:"Bottom-up forecasting builds the total from many small, individually justified pieces — like specific deals or specific customers — which makes unjustified, hand-wavy assumptions much harder to hide than in a single top-level estimate."}
},
"Top-Down Forecasting": {
  analogyHead:"Starting from the whole pie, then guessing your slice.",
  analogy:"Like estimating your restaurant's likely revenue by starting with the entire city's total restaurant spending and guessing what percentage you might capture, top-down forecasting starts from the total market size, then estimates what slice of it one company can realistically capture.",
  example:["An analyst wants a quick estimate of a new entrant's potential revenue in the electric scooter market.","She starts with the total addressable market for electric scooters, roughly ₹5,000 crore nationally.","She assumes the new entrant could realistically capture 3% of that market within three years, arriving at a rough revenue estimate.","She uses this quick top-down estimate for an initial screening decision, planning to build a more detailed bottom-up model later before committing serious capital."],
  exampleHead:"A market-size estimate, quickly scaled down to one company's slice.",
  exampleCallout:"A fast first estimate, not the final word",
  mistakes:[
    {think:"Top-down forecasting is inherently unreliable and should never be used.", reality:"It's genuinely useful for quick, early-stage sanity checks and screening decisions — the risk is relying on it as the sole, final basis for a major decision without ever validating it with more granular, bottom-up analysis."},
    {think:"Top-down and bottom-up forecasting will always produce similar numbers.", reality:"They can diverge significantly, since top-down relies on a broad assumed capture rate while bottom-up is built from specific, addable pieces — a large gap between the two is itself often a useful signal worth investigating."}
  ],
  related:["Bottom-Up Forecasting","TAM","Market Share","Reverse DCF"],
  quiz:{q:"What's a key risk of relying solely on top-down forecasting for a major decision?", options:["It always takes too long to complete","It's a fast, rough estimate based on assumed market capture, so it can miss operational or company-specific realities that a more granular analysis would catch","It's illegal to use for public company filings","It can only be used for companies with no revenue"], correct:1, explain:"Top-down forecasting is quick precisely because it skips granular, ground-level detail — useful for a fast initial estimate, but risky as the sole basis for a major decision without cross-checking against more detailed, bottom-up analysis."}
},
"Horizontal Analysis": {
  analogyHead:"Lining up several years of report cards, side by side.",
  analogy:"Like laying five years of a student's report cards side by side to see whether their grades are steadily improving or quietly slipping, horizontal analysis lines up a company's financial statements across several years to see what's actually changing.",
  example:["An analyst lines up a company's revenue, gross margin, and operating expenses for each of the last five years, side by side.","Revenue has grown steadily each year, which looks encouraging at first glance.","But laid out horizontally, gross margin has quietly eroded a little each year, a trend not obvious from any single year's numbers alone.","The analyst investigates further and finds the company has been discounting prices to keep revenue growing, at the cost of shrinking profitability per sale."],
  exampleHead:"Five years, laid side by side, reveal a quiet margin slide.",
  exampleCallout:"Growing revenue was hiding shrinking margins",
  mistakes:[
    {think:"Looking at a single year's financial statements gives you the same insight as horizontal analysis.", reality:"A single year in isolation can't reveal a multi-year trend — horizontal analysis specifically exists to surface gradual changes, like slowly eroding margins, that only become visible when several years are compared side by side."},
    {think:"Horizontal analysis is only useful for finding problems.", reality:"It's equally useful for confirming genuinely positive, sustained trends — steadily improving margins or accelerating growth are just as visible laid out horizontally as deteriorating ones."}
  ],
  related:["Vertical Integration","EPS Growth","YoY","Reverse DCF"],
  quiz:{q:"What does horizontal analysis specifically help an analyst spot that a single year's numbers alone might not?", options:["The company's current stock price","Gradual multi-year trends, like slowly eroding margins, that aren't obvious from any single year in isolation","The names of the company's board members","The company's tax filing status"], correct:1, explain:"By lining up several years of financial data side by side, horizontal analysis reveals gradual trends — like a slow margin decline — that can be completely invisible when looking at any single year's statements on their own."}
},
"Reverse DCF": {
  analogyHead:"Working backward from the price tag to the story it implies.",
  analogy:"Like looking at a mansion's asking price and working backward to figure out what assumptions about the neighborhood would have to be true to justify that price, a reverse DCF starts from today's stock price and works backward to reveal what growth assumptions the market must already believe.",
  example:["A stock trades at a price implying, under a standard DCF, roughly 25% annual earnings growth for the next decade.","An analyst runs the numbers in reverse: starting from the current price, she solves for what growth rate would justify it.","She compares that implied 25% growth rate against the company's actual historical growth, which has never exceeded 12% in any prior decade.","She concludes the market may be pricing in unrealistically optimistic growth, and treats the stock's current valuation with real skepticism."],
  exampleHead:"The price implies 25% growth; history shows 12%.",
  exampleCallout:"A valuation built on an unproven assumption",
  mistakes:[
    {think:"A reverse DCF tells you what a stock's 'true' value should be.", reality:"It doesn't produce an independent valuation at all — it simply reveals what growth assumption is already embedded in the current market price, which the analyst then has to judge for plausibility separately."},
    {think:"Reverse DCF and standard DCF are essentially the same calculation.", reality:"A standard DCF starts with growth assumptions and solves for a value; a reverse DCF starts with the market price and solves backward for the growth assumption — the direction of the calculation, and the question being asked, is fundamentally flipped."}
  ],
  related:["DCF","EPV","Bottom-Up Forecasting","Top-Down Forecasting"],
  quiz:{q:"What does a reverse DCF actually reveal, that a standard DCF doesn't?", options:["The exact date a stock will reach a target price","What growth assumption is already implicitly baked into a stock's current market price","The company's historical dividend payments","The tax rate applied to capital gains"], correct:1, explain:"A reverse DCF flips the usual calculation — instead of assuming growth to derive a value, it starts from today's actual price and solves backward for the growth rate the market must already be implicitly assuming."}
},

function wireOrderBookDemo(){
  const askRows = Array.from(document.querySelectorAll('#obDemo .ob-side.asks .ob-row'));
  const matchBtn = document.getElementById('matchBtn');
  const resetBtn = document.getElementById('resetBtn');
  const log = document.getElementById('demoLog');
  const ltp = document.getElementById('ltpVal');
  const initialQty = askRows.map(r => parseInt(r.dataset.qty, 10));
  let remaining = 200;
  function render(){
    askRows.forEach((r, i) => {
      const qty = parseInt(r.dataset.qty, 10);
      r.querySelector('.qty').textContent = qty.toLocaleString();
      const maxW = [80,115,140][i];
      r.querySelector('.ob-bar').style.maxWidth = Math.max(6, maxW * (qty / initialQty[i])) + 'px';
    });
  }
  matchBtn.addEventListener('click', () => {
    if(remaining <= 0) return;
    const row = askRows.find(r => parseInt(r.dataset.qty, 10) > 0);
    if(!row) return;
    let qty = parseInt(row.dataset.qty, 10);
    const take = Math.min(remaining, qty);
    qty -= take; remaining -= take; row.dataset.qty = qty;
    row.classList.add('flash');
    ltp.textContent = '₹' + row.dataset.price;
    ltp.classList.add('pulse');
    log.textContent = 'Matched ' + take + ' @ ₹' + row.dataset.price + ' · Total ₹' + (take * parseFloat(row.dataset.price)).toLocaleString(undefined,{maximumFractionDigits:0});
    render();
    setTimeout(() => { row.classList.remove('flash'); ltp.classList.remove('pulse'); }, 700);
    matchBtn.disabled = remaining <= 0;
    if(remaining <= 0) matchBtn.textContent = 'Order fully filled';
  });
  resetBtn.addEventListener('click', () => {
    askRows.forEach((r, i) => { r.dataset.qty = initialQty[i]; r.classList.remove('flash'); });
    remaining = 200; matchBtn.disabled = false;
    matchBtn.textContent = 'Send market buy order · 200 shares';
    ltp.textContent = '₹104.10'; log.textContent = '';
    render();
  });
}

    <div class="mistake">
      <div class="mrow think"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></span><div><div class="mlbl">People think</div><p>${esc(m.think)}</p></div></div>
      <div class="mrow reality"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><div class="mlbl">Reality</div><p>${esc(m.reality)}</p></div></div>
    </div>`).join('');

  document.getElementById('relatedWrap').innerHTML = content.related.map(r => {
    const has = !!CORE[r];
    const def = has ? CORE[r].p.replace(/^"|"$/g,'') : 'Coming soon to the library.';
    return `<a class="related-card" ${has ? `href="#${slugify(r)}"` : 'href="javascript:void(0)"'}><h4>${esc(r)}</h4><p>${esc(def)}</p></a>`;
  }).join('');

  const quizCard = document.getElementById('quizCard');
  quizCard.classList.remove('answered');
  document.getElementById('quizQ').textContent = content.quiz.q;
  document.getElementById('quizOpts').innerHTML = content.quiz.options.map((o,i) => `
    <button class="quiz-opt" data-idx="${i}" ${i === content.quiz.correct ? 'data-correct="true"' : ''}>${esc(o)}<span class="res-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>`).join('');
  document.getElementById('quizFeedback').textContent = content.quiz.explain;
  wireQuiz();

  const idx = ORDER.indexOf(term);
  document.getElementById('pathTrack').innerHTML = ORDER.map((p,i) => `<button class="path-dot${i===idx?' active':''}" title="${esc(p)}" data-term="${esc(p)}"></button>`).join('');
  document.querySelectorAll('.path-dot').forEach(d => d.addEventListener('click', e => { location.hash = slugify(e.currentTarget.dataset.term); }));
  document.getElementById('pathLabel').textContent = 'CONCEPT ' + (idx+1) + ' OF ' + ORDER.length + ' · ' + term.toUpperCase();
  const nextTerm = ORDER[(idx+1) % ORDER.length];
  document.getElementById('nextTitle').textContent = nextTerm + ' →';
  document.getElementById('nextCard').onclick = () => { location.hash = slugify(nextTerm); };

  window.scrollTo(0,0);
}

function wireQuiz(){
  const quizCard = document.getElementById('quizCard');
  const opts = Array.from(document.querySelectorAll('.quiz-opt'));
  opts.forEach(opt => {
    opt.addEventListener('click', () => {
      if(quizCard.classList.contains('answered')) return;
      quizCard.classList.add('answered');
      opt.classList.add('picked');
      opts.forEach(o => { if(o.dataset.correct === 'true') o.classList.add('correct'); });
    });
  });
  document.getElementById('quizRetry').onclick = () => {
    quizCard.classList.remove('answered');
    opts.forEach(o => o.classList.remove('picked','correct'));
  };
}

/* ===================== INIT ===================== */
(function(){
  const root = document.documentElement;
  function getInitialTheme(){
    const hostTheme = root.getAttribute('data-theme');
    if(hostTheme === 'dark' || hostTheme === 'light') return hostTheme;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', getInitialTheme());

  const fill = document.getElementById('progressFill');
  function updateProgress(){
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    fill.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }
  document.addEventListener('scroll', updateProgress, {passive:true});

  const bm = document.getElementById('bookmarkBtn');
  bm.addEventListener('click', () => bm.setAttribute('aria-pressed', String(bm.getAttribute('aria-pressed') !== 'true')));

  window.addEventListener('hashchange', () => {
    const term = unslugify(decodeURIComponent(location.hash.replace('#','')));
    render(CORE[term] ? term : 'Order Book');
    updateProgress();
  });

  const initial = unslugify(decodeURIComponent(location.hash.replace('#','')));
  render(CORE[initial] ? initial : 'Order Book');
  updateProgress();
})();
</script>
</body>
</html>
