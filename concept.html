  analogy:"Like a budget airline that starts by serving routes major carriers ignore, then slowly expands until it's competing everywhere, disruptive innovation enters at the bottom of a market with something simpler and cheaper — and climbs upward until it eats the whole industry.",
  example:["Netflix launches as a mail-order DVD rental service, initially dismissed by video rental giant Blockbuster as a niche, inferior alternative to in-store browsing.","Netflix keeps improving quietly, adding streaming while Blockbuster stays focused on its profitable physical store model.","Streaming technology matures, and Netflix's model proves dramatically more convenient and scalable than physical stores.","Blockbuster, having dismissed the threat too long as 'worse' rather than 'different,' goes bankrupt within a decade."],
  exampleHead:"A mail-order DVD service quietly climbs the ladder.",
  exampleCallout:"Dismissed as inferior; ends up dominant",
  mistakes:[
    {think:"Disruptive innovation means any new technology that changes an industry.", reality:"It specifically describes an innovation that starts simpler and cheaper at the bottom of a market — a flashy, expensive new technology that only serves premium customers isn't disruptive in this specific sense."},
    {think:"Incumbents can always spot disruption coming and respond in time.", reality:"Disruptive products often look genuinely worse by the existing metrics incumbents use to judge quality, which is exactly why established leaders tend to dismiss them until it's too late."}
  ],
  related:["First-Mover Advantage","Barriers to Entry","Blue Ocean Strategy","Network Effect"],
  quiz:{q:"Why do established companies often fail to respond to disruptive innovation in time?", options:["They are legally prevented from responding","The disruptive product typically looks worse by the incumbent's existing quality metrics, causing it to be dismissed until too late","Disruptive companies always have more funding than incumbents","Incumbents are unaware such companies exist"], correct:1, explain:"Disruptive products usually start simpler and worse by an incumbent's traditional standards, which is precisely why they get dismissed as non-threats — until they've matured enough to take over from below."}
},
"Switching Costs": {
  analogyHead:"Why you're still with the same bank you don't even like.",
  analogy:"Like staying with a bank you're unhappy with because moving all your auto-payments and history feels like too much hassle, switching costs are everything that makes leaving a product more annoying than it's worth — even when a better option exists elsewhere.",
  example:["A business has used the same accounting software for eight years, with years of historical financial data stored in it.","A competitor launches a cheaper, arguably better-designed alternative.","The business calculates that migrating years of data, retraining staff, and risking errors during the transition would cost far more than the software price difference.","It stays with its existing, more expensive provider — not because it's the better product, but because the switching costs outweigh the savings."],
  exampleHead:"A better, cheaper alternative loses anyway.",
  exampleCallout:"Migration cost exceeds the price savings",
  mistakes:[
    {think:"Switching costs are only about money.", reality:"They include time, effort, retraining, lost data, and risk of errors during transition — often the non-financial costs matter more than any price difference."},
    {think:"High switching costs mean a company has a genuinely superior product.", reality:"Switching costs can keep customers even when a product is mediocre — they measure how hard it is to leave, not necessarily how good the product actually is."}
  ],
  related:["Network Effect","Economic Moat","Core Competency","Barriers to Entry"],
  quiz:{q:"What do switching costs actually measure?", options:["How much a product costs to buy initially","How difficult and costly it is for a customer to leave for a competitor's product, in time, effort, or money","How many features a product has","How much a company spends on marketing"], correct:1, explain:"Switching costs measure everything that makes leaving a product painful — retraining, data migration, lost history — which can keep customers loyal regardless of whether a competitor's product is actually better."}
},
"Barriers to Entry": {
  analogyHead:"The moat around the castle, keeping new competitors out.",
  analogy:"Like a castle's moat making it hard for any new attacker to just walk in, barriers to entry are whatever makes it hard for a new competitor to show up and start taking a company's customers — capital requirements, regulation, patents, or brand loyalty.",
  example:["An entrepreneur considers launching a new domestic airline.","She discovers the barriers are enormous: aircraft cost hundreds of crores each, airport slots are scarce and tightly regulated, and safety certification takes years.","By contrast, a friend launching a food truck business faces almost no real barriers — modest capital, minimal regulation, and no scarce infrastructure to secure.","The airline industry's brutal barriers to entry are exactly why existing airlines, despite thin margins, don't face a constant flood of new competitors."],
  exampleHead:"An airline and a food truck face wildly different barriers.",
  exampleCallout:"High barriers protect existing airlines from new entrants",
  mistakes:[
    {think:"High barriers to entry always guarantee an industry is profitable.", reality:"Barriers to entry protect existing players from new competition, but don't guarantee profitability on their own — airlines have brutal barriers to entry and still often struggle with thin margins, due to fierce rivalry among the few players already inside."},
    {think:"Barriers to entry only mean the cost of starting a business.", reality:"They include regulation, patents, brand loyalty, and network effects too — not just the upfront capital required to launch."}
  ],
  related:["Porter's Five Forces","Economic Moat","Economies of Scale","Network Effect"],
  quiz:{q:"Do high barriers to entry guarantee an industry is profitable?", options:["Yes, always","No — they protect against new entrants, but existing competitors can still fight hard enough among themselves to keep margins thin","Barriers to entry only apply to technology companies","No, barriers to entry have no effect on profitability at all"], correct:1, explain:"High barriers to entry keep new competitors out, but they don't prevent the existing players from competing fiercely with each other — an industry can have brutal barriers and still be a tough, low-margin business."}
},
"Unit Economics": {
  analogyHead:"Does a single lemonade sale actually make money?",
  analogy:"Like a kid running a lemonade stand needing to know if one cup sold actually covers the lemons, sugar, and cups it took to make it, unit economics asks whether a business makes money on a single unit — one customer, one order — stripped of all the scale and growth story around it.",
  example:["A food delivery startup boasts about rapid growth, doubling its order volume every quarter.","An analyst checks its unit economics: on average, it loses ₹40 on every single order once delivery costs and discounts are included.","That means every additional order the company processes actually deepens its total losses, despite the impressive-looking growth headline.","Only after the company redesigns its delivery logistics to bring the per-order cost down does growth actually start building real value instead of burning more cash."],
  exampleHead:"Rapid growth, but losing money on every single order.",
  exampleCallout:"₹40 lost per order — growth deepens the losses",
  mistakes:[
    {think:"A company growing its revenue fast must be a healthy business.", reality:"If unit economics are negative, faster growth just means losing money faster — revenue growth alone says nothing about whether each individual transaction is actually profitable."},
    {think:"Unit economics is the same thing as overall company profitability.", reality:"A company can have negative unit economics early on while still being a reasonable long-term bet, if there's a credible path to improving per-unit costs as it scales — but the two measures are genuinely distinct."}
  ],
  related:["Fixed Cost","Variable Cost","Incremental Margin","Economies of Scale"],
  quiz:{q:"What does unit economics specifically measure, that overall revenue growth doesn't?", options:["The company's total market capitalization","Whether the business actually makes or loses money on a single individual transaction, regardless of total scale","The number of employees per department","The company's brand recognition"], correct:1, explain:"Unit economics strips away scale entirely to ask whether one single order or customer is profitable — a business can be growing revenue fast while still losing money on every individual transaction."}
},
"TAM": {
  analogyHead:"The whole pie, before anyone's actually eaten a slice.",
  analogy:"Like estimating the total amount every person in a city could ever spend on pizza in a year before opening a single restaurant, TAM (Total Addressable Market) is the theoretical ceiling of revenue a business could ever capture if it won 100% of its market — a starting estimate, not a guarantee.",
  example:["A startup pitches investors on a food delivery app, citing a ₹2 lakh crore TAM for India's food delivery market.","An investor points out that capturing even 5% of that TAM, against entrenched competitors already spending heavily to win market share, would be a major achievement.","The startup's actual realistic near-term opportunity is a small fraction of the flattering TAM number on its pitch deck slide.","A more useful conversation follows about the company's specific plan to win a defensible slice of that market, rather than the size of the market itself."],
  exampleHead:"A ₹2 lakh crore TAM, and a much harder question underneath it.",
  exampleCallout:"The real question is the capturable slice, not the ceiling",
  mistakes:[
    {think:"A company's TAM is a reliable estimate of how much revenue it will actually earn.", reality:"TAM is a theoretical ceiling assuming 100% market capture, which almost never happens — the realistic question is always what fraction of that ceiling a company can actually, defensibly win."},
    {think:"A bigger TAM number always makes a company a better investment.", reality:"A huge TAM with intense competition and thin margins can be a worse opportunity than a smaller TAM where a company can dominate with a genuine moat."}
  ],
  related:["Market Share","Economic Moat","Unit Economics","Pricing Power"],
  quiz:{q:"What does TAM actually represent?", options:["A company's guaranteed future revenue","The theoretical maximum revenue if a business captured 100% of its addressable market — a ceiling, not a forecast","The company's current annual revenue","The total number of competitors in an industry"], correct:1, explain:"TAM is a theoretical upper bound assuming complete market capture — it's a useful reference point for market size, but not a realistic prediction of what any single company will actually earn."}
},
"Blue Ocean Strategy": {
  analogyHead:"Inventing a new pool instead of fighting for space in the crowded one.",
  analogy:"Like opening a completely new type of restaurant instead of fighting for table share in an already-saturated street of identical cafés, blue ocean strategy means creating an entirely new market space with no direct competitors, rather than battling head-on in an existing, bloody 'red ocean' market.",
  example:["Traditional circuses compete fiercely on the same formula: animal acts, celebrity performers, and low ticket prices.","Cirque du Soleil removes animals entirely, adds theatrical storytelling and artistic staging, and charges premium ticket prices.","It's no longer competing against Ringling Bros. and other circuses at all — it's created a new category blending circus and theater.","For years, it faces essentially no direct competitors in that specific space it invented, commanding premium pricing throughout."],
  exampleHead:"A circus stops competing with other circuses entirely.",
  exampleCallout:"A new category, with no direct rivals",
  mistakes:[
    {think:"Blue ocean strategy just means entering a market before anyone else does.", reality:"It specifically means redefining the product or market itself so thoroughly that existing competitors become irrelevant — not simply being first to an existing type of market."},
    {think:"A blue ocean stays uncontested forever once created.", reality:"Successful blue oceans attract imitators over time, gradually turning back into a competitive 'red ocean' — the advantage is durable, not permanent, unless continually renewed."}
  ],
  related:["Disruptive Innovation","Core Competency","First-Mover Advantage","Barriers to Entry"],
  quiz:{q:"What does blue ocean strategy actually involve, beyond simply being first to a market?", options:["Cutting prices lower than every competitor","Redefining the product or market itself to make existing competitors and their offering essentially irrelevant","Merging with the largest competitor in the industry","Only selling to government customers"], correct:1, explain:"Blue ocean strategy isn't just about early timing — it's about reshaping what's being offered so thoroughly that the company is no longer competing in the same terms as existing rivals at all."}
},
"Flywheel Effect": {
  analogyHead:"A wheel that gets easier to spin, the longer you spin it.",
  analogy:"Like a heavy flywheel that's hard to start moving but, once spinning, keeps gathering momentum with less and less extra push, a business flywheel is a loop where each part of the business makes every other part stronger — accelerating over time rather than needing constant fresh effort.",
  example:["Amazon lowers prices to attract more customers to its platform.","More customers attract more third-party sellers, who want access to that larger audience.","More sellers means a wider selection of products, which in turn attracts even more customers.","That larger customer base gives Amazon more scale and negotiating power, letting it lower prices even further — completing and accelerating the loop."],
  exampleHead:"Lower prices set off a self-reinforcing loop.",
  exampleCallout:"Each turn of the wheel makes the next turn easier",
  mistakes:[
    {think:"A flywheel effect happens automatically once a company is large enough.", reality:"It has to be deliberately designed so each part genuinely reinforces the next — simply being a large company doesn't automatically create a self-reinforcing loop without that intentional structure."},
    {think:"A flywheel and a network effect are the same concept.", reality:"A network effect specifically describes a product becoming more valuable as more people use it; a flywheel is the broader business loop connecting multiple different parts of the business (price, selection, scale) reinforcing each other — a network effect can be one component inside a larger flywheel."}
  ],
  related:["Network Effect","Economies of Scale","Economic Moat","Pricing Power"],
  quiz:{q:"What distinguishes a business flywheel from a simple network effect?", options:["They are exactly the same concept with different names","A flywheel connects multiple different business components (like price, selection, and scale) in a reinforcing loop, while a network effect specifically describes a product's value rising with more users","A flywheel only applies to technology companies","A network effect requires no customers at all"], correct:1, explain:"A network effect is specifically about a product's value scaling with its user base; a flywheel is the broader loop where several distinct parts of a business — pricing, selection, scale — reinforce each other over time."}
},
"ROI": {
  analogyHead:"The simplest scorecard in investing.",
  analogy:"Like calculating whether reselling a used car for more than you paid (plus repairs) was worth it, ROI answers the most basic investing question: how much did you get back, compared to what you put in?",
  example:["An investor buys a stock for ₹1,00,000 and sells it two years later for ₹1,30,000.","Her ROI is (₹1,30,000 minus ₹1,00,000) divided by ₹1,00,000 = 30%.","A friend made the same 30% ROI on a different stock, but in just six months instead of two years.","Even though the ROI percentage is identical, her friend's return was actually far better once time is accounted for."],
  exampleHead:"Same 30% ROI, very different timeframes.",
  exampleCallout:"30% in two years vs. 30% in six months",
  mistakes:[
    {think:"A higher ROI number always means a better investment.", reality:"ROI alone says nothing about how long it took to earn that return — a 30% ROI over ten years is a vastly worse outcome than the same 30% over one year."},
    {think:"ROI accounts for risk taken to earn the return.", reality:"ROI is purely a return calculation — it says nothing about how much risk or volatility was involved in earning it, which is why risk-adjusted measures like the Sharpe Ratio exist separately."}
  ],
  related:["CAGR","ROE","Sharpe Ratio","DCF"],
  quiz:{q:"What key piece of information does a plain ROI figure fail to capture?", options:["The currency the investment was made in","The time period over which that return was earned","The name of the company invested in","The investor's tax bracket"], correct:1, explain:"ROI measures total return but ignores the holding period — the same ROI percentage earned quickly is a far better outcome than the same percentage earned slowly, which ROI alone can't distinguish."}
},
"ROE": {
  analogyHead:"Profit per rupee shareholders actually put in.",
  analogy:"Like judging a small business by how much profit it makes for every rupee the owner personally invested — not counting money borrowed from the bank — ROE measures profit generated purely on shareholders' own money.",
  example:["Company A and Company B both report ₹100 crore in net income.","Company A has ₹500 crore in shareholder equity, giving it an ROE of 20%.","Company B has only ₹200 crore in shareholder equity but funded much of its operations with heavy debt, giving it a flattering ROE of 50%.","A careful investor checks Company B's debt levels and realizes its high ROE is partly a product of leverage, not superior underlying efficiency."],
  exampleHead:"A flattering ROE, built partly on debt.",
  exampleCallout:"50% ROE — but how much of it is leverage?",
  mistakes:[
    {think:"A higher ROE always means a more efficiently run company.", reality:"ROE can be inflated by taking on more debt, since debt reduces the equity base the return is divided by — checking ROA or debt levels alongside ROE avoids being misled."},
    {think:"ROE and ROI are the same measurement.", reality:"ROE specifically divides profit by shareholder equity; ROI is a broader, more general return calculation on any investment amount, not tied to a specific balance-sheet definition."}
  ],
  related:["ROA","ROIC","ROCE","Credit Rating"],
  quiz:{q:"Why can a high ROE sometimes be misleading?", options:["ROE always understates a company's true profitability","A company can inflate its ROE by taking on more debt, which shrinks the equity base the return is divided by","ROE is only calculated once a year","High ROE always means low risk"], correct:1, explain:"Since ROE divides profit by shareholder equity alone, more debt (less equity, more leverage) can mechanically boost the ratio — without necessarily reflecting genuinely better underlying business performance."}
},
"ROA": {
  analogyHead:"How hard every asset a company owns is working.",
  analogy:"Like judging a taxi driver by profit earned per car owned — not per rupee the driver personally put in — ROA measures how efficiently a company turns everything it owns, including borrowed assets, into profit.",
  example:["Two manufacturing companies both report ₹50 crore in net income.","Company X has ₹1,000 crore in total assets, giving it an ROA of 5%.","Company Y has only ₹400 crore in total assets, giving it an ROA of 12.5%, despite identical profit.","Company Y is generating far more profit per rupee of assets deployed — a genuinely more efficient operation, regardless of how it's financed."],
  exampleHead:"Same profit, very different asset efficiency.",
  exampleCallout:"12.5% ROA vs. 5% ROA, same net income",
  mistakes:[
    {think:"ROA and ROE will always tell the same story about a company.", reality:"A highly leveraged company can have a strong ROE but a weak ROA — ROA includes debt-funded assets in its denominator, so it can't be flattered by leverage the way ROE can."},
    {think:"A low ROA always means a badly run company.", reality:"Some industries (like banking or heavy manufacturing) are naturally asset-heavy, so their normal ROA range is lower than an asset-light software company's — ROA is most meaningful compared within the same industry."}
  ],
  related:["ROE","ROIC","ROCE","Operating Ratio"],
  quiz:{q:"Why can't a company inflate its ROA the way it can inflate ROE with debt?", options:["ROA is calculated differently every quarter","ROA divides profit by total assets, which includes debt-funded assets — so taking on more debt doesn't shrink the denominator the way it does for ROE","Regulators cap how high ROA can go","ROA only applies to private companies"], correct:1, explain:"ROA's denominator is total assets, which grows when a company borrows to buy more assets — unlike ROE's denominator (equity alone), debt doesn't mechanically inflate ROA the same way."}
},
"ROIC": {
  analogyHead:"Return on every rupee actually put to work, debt and equity combined.",
  analogy:"Like judging a business on total return per rupee invested by both the owner and the bank combined, ROIC measures return on all capital genuinely deployed in the business — sidestepping the leverage tricks that can flatter ROE alone.",
  example:["A value investor compares two companies with similar ROE figures around 18%.","Company A's ROIC is also close to 18%, funded mostly by equity with little debt.","Company B's ROIC is only 9%, since much of its reported ROE was inflated by heavy borrowing.","The investor chooses Company A, recognizing its return is built on genuine capital efficiency, not financial engineering."],
  exampleHead:"Two similar ROEs, very different ROICs.",
  exampleCallout:"Debt was doing the work for Company B",
  mistakes:[
    {think:"ROIC and ROE measure essentially the same thing.", reality:"ROIC includes both debt and equity capital in its denominator, making it far harder to flatter through leverage than ROE, which only considers equity."},
    {think:"A high ROIC always means immediate high profitability.", reality:"ROIC reflects returns on capital that's already been deployed — a young, high-growth company reinvesting heavily may show a temporarily lower ROIC even while building real long-term value."}
  ],
  related:["ROE","ROA","Economic Moat","EVA"],
  quiz:{q:"Why do value investors often prefer ROIC over ROE when comparing companies?", options:["ROIC is easier to calculate from a stock chart","ROIC includes debt as well as equity, making it much harder for leverage alone to inflate the number","ROIC is reported more frequently than ROE","ROIC only applies to technology companies"], correct:1, explain:"Because ROIC's denominator includes all capital — debt and equity — leverage can't inflate it the way it can inflate ROE, making ROIC a more leverage-resistant measure of genuine capital efficiency."}
},
"CAGR": {
  analogyHead:"The smooth average speed on a road trip with lots of stops and starts.",
  analogy:"Like calculating your car's average speed for an entire road trip even though you sped up, slowed down, and stopped for lunch along the way, CAGR smooths a bumpy multi-year investment journey into one single, steady annual growth rate.",
  example:["An investment grows from ₹1,00,000 to ₹2,00,000 over five years.","But the path wasn't smooth: it doubled in year one, then fell sharply in year three before recovering.","CAGR calculates the single steady annual rate — about 14.9% — that would have produced the same ₹1,00,000-to-₹2,00,000 result if growth had been perfectly smooth every year.","An investor who only sees the headline 14.9% CAGR might not realize how volatile the actual ride was along the way."],
  exampleHead:"A bumpy five-year ride, smoothed into one number.",
  exampleCallout:"14.9% CAGR hides a wild middle stretch",
  mistakes:[
    {think:"CAGR tells you how volatile an investment's returns were.", reality:"CAGR only shows the smoothed average — a steady 15%-a-year climb and a wild swing that also nets out to 15% CAGR look identical in this single number, hiding the actual risk experienced."},
    {think:"A stated CAGR guarantees that exact return every single year.", reality:"CAGR is a retrospective average, not a forward promise — actual year-to-year returns almost never match the smoothed CAGR figure exactly."}
  ],
  related:["ROI","Maximum Drawdown","Beta","DCF"],
  quiz:{q:"What important information does CAGR hide, by design?", options:["The total starting investment amount","The actual year-to-year volatility and bumpiness of the returns along the way","The currency of the investment","The name of the company"], correct:1, explain:"CAGR intentionally smooths a multi-year journey into one steady rate — which means it can't show how volatile or bumpy the actual path to that result really was."}
},
"DCF": {
  analogyHead:"What would you pay today for a promise of future cash?",
  analogy:"Like deciding what you'd pay right now for a friend's promise to pay you back ₹1,000 a year for the next five years — discounting each future payment because money later is worth less than money now — DCF values a business the same way, based on all its expected future cash.",
  example:["An analyst projects a company will generate ₹100 crore in free cash flow next year, growing steadily for the next decade.","She discounts each future year's projected cash flow back to today's value, using a discount rate reflecting the investment's risk.","Summing all those discounted future cash flows gives her an estimate of what the entire business is worth today.","If the stock's current market price is meaningfully below that DCF-derived value, she considers it potentially undervalued."],
  exampleHead:"A decade of future cash flows, valued in today's rupees.",
  exampleCallout:"Market price below DCF value — a possible bargain",
  mistakes:[
    {think:"A DCF valuation produces one single, objectively correct number.", reality:"DCF is extremely sensitive to its assumptions — small changes in the growth rate or discount rate used can swing the resulting valuation dramatically, so it's a range of possibilities, not a precise fact."},
    {think:"DCF is only useful for valuing entire companies.", reality:"The same discounting logic underlies bond pricing, real estate valuation, and even personal decisions like evaluating a future promised payment — it's a general valuation principle, not company-specific."}
  ],
  related:["Reverse DCF","EPV","Yield","Earnings Yield"],
  quiz:{q:"Why is DCF valuation described as sensitive, despite feeling like a precise calculation?", options:["It requires expensive specialized software","Small changes in its growth rate and discount rate assumptions can swing the resulting valuation significantly","DCF can only be calculated by regulators","It only works for companies with no debt"], correct:1, explain:"DCF's output depends heavily on assumptions about future growth and the discount rate used — modest changes to either input can meaningfully shift the resulting valuation, despite the calculation looking mathematically precise."}
},
"Economic Moat": {
  analogyHead:"The literal moat around a medieval castle, but for a business.",
  analogy:"Like a castle's moat keeping invaders out long after the walls alone would have fallen, an economic moat is whatever durably protects a company's profits from competitors — a brand, a patent, a network effect, or sheer scale.",
  example:["An investor compares two companies in the same industry with similar current profit margins.","Company A has a well-known consumer brand built over 50 years, letting it charge a premium price.","Company B has no meaningful brand and competes purely on being the cheapest option available.","A new low-cost competitor enters the market: Company B's margins collapse under price competition, while Company A's brand loyalty largely protects its pricing and profits."],
  exampleHead:"A new competitor arrives — one company's margin survives.",
  exampleCallout:"The moat held for one company, not the other",
  mistakes:[
    {think:"Any company with strong current profits automatically has a wide moat.", reality:"Current profitability alone doesn't guarantee it's protected — a moat specifically refers to what keeps competitors from eroding those profits over time, which can only really be tested when competition actually arrives."},
    {think:"An economic moat, once built, lasts forever without any effort.", reality:"Moats can erode over time as technology, consumer preferences, or competitors' capabilities change — brands, patents, and networks all require ongoing reinforcement to stay durable."}
  ],
  related:["Pricing Power","Barriers to Entry","Core Competency","ROIC"],
  quiz:{q:"What does an economic moat actually protect?", options:["A company's office headquarters","A company's profits and pricing power from being eroded by competitors","A company's tax filings","A company's employee count"], correct:1, explain:"An economic moat refers to whatever durably shields a company's profitability from competitive pressure — brand loyalty, patents, network effects, or scale — not any physical or administrative asset."}
},
"Earnings Yield": {
  analogyHead:"P/E flipped upside down, so it speaks the same language as a bond.",
  analogy:"Like converting a house's price into a rental yield percentage so you can compare it directly to a savings account's interest rate, earnings yield flips a stock's P/E ratio upside down into a percentage — letting you compare it directly against a bond's yield.",
  example:["A stock trades at a P/E ratio of 20, meaning investors pay ₹20 for every ₹1 of annual earnings.","Its earnings yield is 1 divided by 20 = 5%.","A 10-year government bond is currently yielding 7%.","An investor notices the stock's earnings yield is lower than the risk-free bond yield, suggesting the stock is priced for strong future growth rather than current value alone."],
  exampleHead:"A 5% earnings yield, next to a 7% bond yield.",
  exampleCallout:"The stock is priced for growth, not current value",
  mistakes:[
    {think:"Earnings yield and dividend yield are the same thing.", reality:"Earnings yield reflects a company's total earnings per share relative to price; dividend yield reflects only the portion of earnings actually paid out as dividends — a company can have a healthy earnings yield while paying no dividend at all."},
    {think:"A higher earnings yield always means a better investment than a lower one.", reality:"A very high earnings yield can also signal the market expects declining future earnings, not necessarily that the stock is a bargain — context about the company's outlook matters."}
  ],
  related:["P/E Ratio","Yield","DCF","Capital Gains Yield"],
  quiz:{q:"What is earnings yield mathematically?", options:["A company's dividend divided by its stock price","The inverse of the P/E ratio — earnings per share divided by price per share","Total revenue divided by market capitalization","The company's annual profit growth rate"], correct:1, explain:"Earnings yield is simply 1 divided by the P/E ratio (earnings per share divided by price per share) — expressing the P/E ratio as a percentage return, directly comparable to a bond yield."}
},
"Capital Gains Yield": {
  analogyHead:"The half of your return that's just the price moving.",
  analogy:"Like the profit from reselling a house for more than you paid, ignoring any rent collected along the way, capital gains yield captures only how much a security's price itself has risen — leaving out any dividends received separately.",
  example:["An investor buys a stock at ₹500 and it rises to ₹550 over the year, while also paying ₹10 in dividends.","Her capital gains yield is (₹550 minus ₹500) divided by ₹500 = 10%.","Her dividend yield is ₹10 divided by ₹500 = 2%.","Her total return for the year was 12%, made up of both pieces combined — but each piece behaves very differently in different market conditions."],
  exampleHead:"A 10% price gain, plus a separate 2% dividend.",
  exampleCallout:"12% total return, split into two distinct pieces",
  mistakes:[
    {think:"Capital gains yield includes dividends paid during the holding period.", reality:"It specifically measures price appreciation alone — dividend yield is the separate component that captures income paid out, and total return combines both."},
    {think:"A stock with high capital gains yield is always a better holding than one with high dividend yield.", reality:"They simply reflect different types of companies and different investor goals — growth-focused companies often reinvest instead of paying dividends, favoring capital gains, while mature companies often favor steady dividend payouts."}
  ],
  related:["Yield","Earnings Yield","ROI","P/E Ratio"],
  quiz:{q:"What does capital gains yield specifically measure?", options:["Total return including dividends","Only the price appreciation of a security, excluding any dividends received","The tax rate applied to investment gains","A company's total market capitalization"], correct:1, explain:"Capital gains yield isolates price movement alone — the separate component, dividend yield, captures income paid out, and the two combine to form total return."}
},
"EVA": {
  analogyHead:"Profit isn't enough — did it beat what the money could've earned elsewhere?",
  analogy:"Like a landlord who only really 'profits' from a rental property if it earns more than simply investing that same money in a fixed deposit, EVA asks whether a company's profit actually exceeds the cost of the capital it used to generate it — not just whether profit is positive.",
  example:["A company reports ₹50 crore in net profit for the year, which sounds impressive on its own.","But it used ₹500 crore of capital to generate that profit, and investors could reasonably expect a 12% return elsewhere for similar risk — implying a ₹60 crore capital cost.","Its EVA is ₹50 crore (profit) minus ₹60 crore (cost of capital) = negative ₹10 crore.","Despite reporting a healthy accounting profit, the company actually destroyed economic value that year, once the true cost of its capital is accounted for."],
  exampleHead:"Positive profit, but negative economic value.",
  exampleCallout:"₹50 crore profit didn't clear the capital cost hurdle",
  mistakes:[
    {think:"A company with positive net profit has automatically created value for shareholders.", reality:"If that profit doesn't exceed what the capital used could have earned elsewhere at similar risk, EVA shows the company actually destroyed value, despite reporting an accounting profit."},
    {think:"EVA and net profit are just two names for the same measurement.", reality:"Net profit ignores the opportunity cost of capital entirely; EVA specifically subtracts that cost, which is why a company can show healthy net profit and negative EVA at the same time."}
  ],
  related:["ROIC","ROE","EPV","Economic Moat"],
  quiz:{q:"How can a company report positive net profit but negative EVA in the same year?", options:["This is mathematically impossible","If the profit earned doesn't exceed what the capital used could have earned elsewhere at similar risk, EVA turns negative despite positive accounting profit","EVA is only calculated for loss-making companies","Net profit and EVA always move in exactly the same direction"], correct:1, explain:"EVA specifically subtracts the opportunity cost of the capital used — a company can post a real accounting profit that still falls short of what that capital could have earned elsewhere, resulting in negative EVA."}
},
"EPV": {
  analogyHead:"What a business is worth if it never grows another rupee.",
  analogy:"Like valuing a rental property based only on its current rent, deliberately ignoring any hope of future rent increases, EPV values a company purely on its current earnings — assuming zero future growth at all, as a conservative floor.",
  example:["A mature, stable company generates consistent free cash flow of ₹40 crore a year, with no clear growth catalysts visible.","An analyst calculates its EPV by simply capitalizing that ₹40 crore at an appropriate discount rate, assuming it continues flat forever.","This gives a deliberately conservative valuation, distinct from a DCF model that assumes some future growth.","If the stock trades well below even this no-growth EPV estimate, the analyst considers it a potential bargain regardless of whether growth ever materializes."],
  exampleHead:"Valuing a company as if it never grows again.",
  exampleCallout:"A conservative floor, not a growth story",
  mistakes:[
    {think:"EPV and DCF are the same valuation method.", reality:"DCF explicitly incorporates assumed future growth into its projections; EPV deliberately strips growth assumptions out entirely, valuing only the business as it stands today — a more conservative benchmark."},
    {think:"A stock trading above its EPV must be overvalued.", reality:"Trading above EPV simply means the market is pricing in some expected future growth — reasonable for genuinely growing companies, and only a red flag if that growth assumption looks unrealistic."}
  ],
  related:["DCF","Economic Moat","ROIC","Earnings Yield"],
  quiz:{q:"What key assumption distinguishes EPV from a standard DCF valuation?", options:["EPV assumes higher growth than DCF","EPV deliberately assumes zero future growth, valuing only current earnings as a conservative floor","EPV only applies to bonds, not stocks","EPV ignores current earnings entirely"], correct:1, explain:"EPV strips out any growth assumption, valuing a business purely on its current, no-growth earnings power — a deliberately conservative benchmark compared to DCF, which explicitly bakes in projected future growth."}
},
"ROCE": {
  analogyHead:"Profit per rupee tied up in running the actual operations.",
  analogy:"Like judging a factory owner by profit earned per rupee of machinery and working capital actually employed — not counting idle cash sitting in the bank — ROCE measures how efficiently a company's operating capital generates profit.",
  example:["Two capital-heavy manufacturing companies are compared by an infrastructure-focused analyst.","Company A generates ₹80 crore in operating profit on ₹400 crore of capital employed, an ROCE of 20%.","Company B generates the same ₹80 crore in operating profit but needs ₹800 crore of capital employed to do it, an ROCE of just 10%.","The analyst concludes Company A runs a meaningfully more capital-efficient operation, even though both companies report identical operating profit."],
  exampleHead:"Identical profit, half the capital required for one company.",
  exampleCallout:"20% ROCE vs. 10% ROCE, same operating profit",
  mistakes:[
    {think:"ROCE and ROE measure exactly the same thing.", reality:"ROCE looks at operating profit relative to all capital employed (debt and equity) in the business's operations, while ROE looks only at net profit relative to shareholder equity — different numerators and denominators."},
    {think:"ROCE is a useful comparison across completely different industries.", reality:"Capital intensity varies hugely by industry — comparing an asset-heavy utility's ROCE to an asset-light software company's ROCE isn't a fair comparison; ROCE is most meaningful within the same industry."}
  ],
  related:["ROIC","ROA","ROE","Operating Ratio"],
  quiz:{q:"What does ROCE measure that makes it particularly useful for capital-heavy industries like manufacturing?", options:["The company's total revenue growth rate","How efficiently operating profit is generated relative to the capital actually employed in running the business","The company's stock price momentum","The number of factories a company owns"], correct:1, explain:"ROCE specifically relates operating profit to capital employed in operations, making it a favored measure for comparing efficiency among capital-intensive businesses like manufacturing or infrastructure."}
},
"Operating Ratio": {
  analogyHead:"How much of every rupee of sales gets eaten before it becomes profit.",
  analogy:"Like tracking what share of a shop's daily takings goes straight to rent, staff, and electricity before any profit is left, the operating ratio shows what portion of a company's revenue is consumed by its day-to-day operating costs.",
  example:["A retail chain reports ₹100 crore in revenue and ₹85 crore in operating costs (cost of goods, salaries, rent, utilities).","Its operating ratio is ₹85 crore divided by ₹100 crore = 85%.","A competitor in the same segment runs a leaner operation with an operating ratio of 78%.","For every rupee of sales, the competitor keeps 7 more paise as pre-tax operating profit than the first chain does — a meaningful efficiency edge at scale."],
  exampleHead:"Two retailers, a 7-paise gap on every rupee of sales.",
  exampleCallout:"85% vs. 78% operating ratio",
  mistakes:[
    {think:"A lower operating ratio is always better, no matter the context.", reality:"Generally true, but the 'right' operating ratio varies a lot by industry — a capital-light software company and a capital-heavy manufacturer have very different normal ranges, so comparisons work best within the same sector."},
    {think:"Operating ratio and net profit margin are the same measure.", reality:"Operating ratio focuses specifically on operating costs relative to revenue; net profit margin also factors in interest, taxes, and other non-operating items further down the income statement."}
  ],
  related:["Fixed Cost","Variable Cost","Operating Leverage","Incremental Margin"],
  quiz:{q:"What does a lower operating ratio generally indicate about a company?", options:["The company is losing money overall","A larger share of each rupee of revenue survives operating costs to become profit","The company has more total debt","The company pays higher dividends"], correct:1, explain:"A lower operating ratio means operating costs consume a smaller share of revenue, leaving more of each rupee of sales to flow through toward profit — generally a sign of more efficient day-to-day operations."}
},
"Beta": {
  analogyHead:"How hard a stock rocks compared to the boat it's riding in.",
  analogy:"Like some boats rocking twice as violently as the wave that hit them, while sturdier boats barely tip, beta measures how much more (or less) a stock swings compared to the overall market's movements.",
  example:["The broad market index rises 10% over a year.","A stock with a beta of 1.5 rises roughly 15% over the same period — swinging 50% more than the market.","Another stock with a beta of 0.6 rises only about 6%, moving less dramatically than the overall market.","A conservative investor nearing retirement deliberately tilts her portfolio toward the lower-beta stock, prioritizing steadier movement over amplified gains."],
  exampleHead:"The same 10% market move, two very different stock reactions.",
  exampleCallout:"Beta 1.5 amplifies; beta 0.6 dampens",
  mistakes:[
    {think:"A high-beta stock is automatically a worse or riskier investment than a low-beta one.", reality:"Beta measures volatility relative to the market, not overall quality — a high-beta stock amplifies both gains and losses, which can genuinely suit an investor comfortable with more risk for more potential upside."},
    {think:"Beta captures every kind of risk an investment carries.", reality:"Beta specifically measures market-related (systematic) volatility — it says nothing about company-specific risks like a lawsuit, a scandal, or a failed product launch."}
  ],
  related:["Sharpe Ratio","Treynor Ratio","Maximum Drawdown","Market Neutral Strategy"],
  quiz:{q:"What does a beta of 1.5 specifically indicate about a stock?", options:["The stock has risen 1.5% this year","The stock tends to move about 50% more than the overall market, in either direction","The stock pays a 1.5% dividend yield","The stock is 1.5 times more expensive than its peers"], correct:1, explain:"A beta of 1.5 means the stock's price tends to swing roughly 50% more than the broader market's movements — amplifying both market gains and market losses proportionally."}
},
"Sharpe Ratio": {
  analogyHead:"Was the extra return worth the extra stress?",
  analogy:"Like judging a rollercoaster not just by how thrilling it is, but by how much thrill you got per unit of nausea, the Sharpe Ratio judges an investment's return not just by its size, but by how much volatility had to be endured to earn it.",
  example:["Fund A returns 18% a year but with wild, stomach-churning swings along the way.","Fund B returns a steadier 14% a year with far smoother, more predictable performance.","Once the extra volatility of Fund A is accounted for, Fund B actually posts a higher Sharpe Ratio.","A risk-conscious investor chooses Fund B, judging that its smoother ride delivers better risk-adjusted returns, despite the lower headline number."],
  exampleHead:"18% looks better than 14% — until risk is factored in.",
  exampleCallout:"The steadier fund wins on a risk-adjusted basis",
  mistakes:[
    {think:"The fund with the higher raw return is always the better choice.", reality:"A higher return achieved through much greater volatility can actually represent a worse risk-adjusted outcome — the Sharpe Ratio exists specifically to compare returns on a level, risk-adjusted playing field."},
    {think:"Sharpe Ratio only matters for professional fund managers, not individual investors.", reality:"Any investor comparing two funds or portfolios can use it to judge whether one fund's extra return genuinely compensates for the extra bumpiness involved in earning it."}
  ],
  related:["Sortino Ratio","Treynor Ratio","Beta","Maximum Drawdown"],
  quiz:{q:"Why might a fund with a lower headline return still have a better Sharpe Ratio than a higher-returning fund?", options:["Sharpe Ratio is calculated randomly","If the lower-returning fund achieved its return with much less volatility, its return is better compensated for the risk taken","The Sharpe Ratio always favors the fund with lower fees","Sharpe Ratio ignores returns completely"], correct:1, explain:"Sharpe Ratio divides excess return by volatility — a fund earning a lower return with far less bumpiness along the way can score higher than a fund earning more but with much wilder swings."}
},
"Sortino Ratio": {
  analogyHead:"Sharpe Ratio, but it only cares about the falls, not the climbs.",
  analogy:"Like a rollercoaster reviewer who only marks you down for the scary drops, not the exciting climbs, the Sortino Ratio only penalizes downside volatility — the swings that actually hurt an investor — ignoring upside swings entirely.",
  example:["A momentum-focused fund has wild swings, but almost all of its volatility comes from sudden, sharp upside spikes rather than downside drops.","Its Sharpe Ratio looks mediocre, since Sharpe penalizes all volatility equally, upside included.","Its Sortino Ratio looks considerably better, since Sortino only penalizes the (comparatively rare) downside moves.","An investor specifically seeking upside-skewed strategies finds the Sortino Ratio a fairer lens for evaluating this particular fund."],
  exampleHead:"A fund's upside swings get unfairly penalized by Sharpe.",
  exampleCallout:"Sortino Ratio tells a more flattering, fairer story",
  mistakes:[
    {think:"Sharpe Ratio and Sortino Ratio will always tell the same story about a fund.", reality:"They can diverge meaningfully for funds whose volatility is skewed — a fund with mostly upside swings looks worse under Sharpe (which penalizes all volatility) than under Sortino (which only penalizes downside)."},
    {think:"A higher Sortino Ratio always means objectively less total risk.", reality:"Sortino specifically isolates downside risk — a fund could still have plenty of overall volatility while scoring well on Sortino, simply because most of that volatility happens to be upside."}
  ],
  related:["Sharpe Ratio","Maximum Drawdown","Treynor Ratio","Information Ratio"],
  quiz:{q:"What's the key difference between the Sharpe Ratio and the Sortino Ratio?", options:["They are identical calculations with different names","Sharpe penalizes all volatility equally; Sortino only penalizes downside volatility, the swings that actually hurt an investor","Sortino only applies to bonds, not stocks","Sharpe is calculated monthly, Sortino annually"], correct:1, explain:"Sharpe treats upside and downside volatility the same; Sortino specifically isolates and only penalizes downside volatility, offering a fairer lens for strategies with upside-skewed swings."}
},
"Information Ratio": {
  analogyHead:"Not just beating the benchmark once, but doing it reliably.",
  analogy:"Like judging a cricket batsman not by one great innings, but by how consistently they outperform the team average over an entire season, the Information Ratio measures how consistently a fund manager beats their benchmark — not just by how much on their best days.",
  example:["Manager A beats her benchmark by a wide margin one year, then underperforms it badly the next two years.","Manager B beats his benchmark by a smaller but steady margin, consistently, year after year.","Manager B's Information Ratio comes out considerably higher, reflecting his more dependable, repeatable outperformance.","An institutional investor allocating a large mandate favors Manager B, valuing consistency over one spectacular but unrepeated year."],
  exampleHead:"One big win vs. steady, repeatable outperformance.",
  exampleCallout:"Consistency scores higher than a single great year",
  mistakes:[
    {think:"The manager with the single best year of outperformance has the higher Information Ratio.", reality:"The Information Ratio rewards consistency of outperformance relative to a benchmark, not the size of any single standout year — a volatile, occasional outperformer can score lower than a steady, modest one."},
    {think:"Information Ratio measures a fund's total return.", reality:"It specifically measures excess return relative to a benchmark, divided by the volatility of that excess — it says nothing about absolute performance on its own, only performance relative to, and consistency against, the benchmark."}
  ],
  related:["Sharpe Ratio","Active vs Passive Investing","Treynor Ratio","Sortino Ratio"],
  quiz:{q:"What does a high Information Ratio specifically reward?", options:["A single spectacular year of outperformance","Consistent, repeatable outperformance of a benchmark over time, not just one standout period","The lowest possible management fees","The largest possible fund size"], correct:1, explain:"Information Ratio rewards steady, dependable outperformance relative to a benchmark — a manager with one huge outperforming year followed by underperformance scores worse than one with smaller but consistent excess returns."}
},
"Treynor Ratio": {
  analogyHead:"Return earned per unit of risk you couldn't have diversified away anyway.",
  analogy:"Like judging a driver's skill only by how they handle unavoidable traffic, not by every random pothole they happened to hit, the Treynor Ratio judges return earned per unit of market risk (beta) specifically — the risk that can't be diversified away, not total volatility.",
  example:["An investor compares two well-diversified funds using both the Sharpe Ratio and the Treynor Ratio.","Fund X has slightly more company-specific volatility (which diversification could reduce) but similar market-related risk (beta) to Fund Y.","Fund X's Sharpe Ratio looks a bit worse due to that extra total volatility, but its Treynor Ratio, which only counts beta-related risk, looks comparable to Fund Y's.","For a fully diversified investor who has already eliminated the diversifiable risk, the Treynor comparison is arguably the more relevant one."],
  exampleHead:"Two funds compared through two different risk lenses.",
  exampleCallout:"Treynor tells a different story once diversification is assumed",
  mistakes:[
    {think:"Sharpe Ratio and Treynor Ratio are interchangeable measures.", reality:"Sharpe uses total volatility (all risk) in its denominator; Treynor uses beta specifically (only market-related, undiversifiable risk) — they can rank the same funds differently."},
    {think:"Treynor Ratio is the better choice for evaluating any individual investment.", reality:"Treynor is most meaningful for an already well-diversified portfolio, where company-specific risk has largely been eliminated — for a single, undiversified holding, total-risk measures like Sharpe are typically more relevant."}
  ],
  related:["Sharpe Ratio","Beta","Information Ratio","Sortino Ratio"],
  quiz:{q:"What kind of risk does the Treynor Ratio specifically focus on, unlike the Sharpe Ratio?", options:["Currency exchange risk only","Market-related (systematic) risk, as measured by beta, rather than total volatility","The risk of a company going bankrupt","Interest rate risk exclusively"], correct:1, explain:"Treynor Ratio divides excess return by beta specifically — the undiversifiable, market-related component of risk — rather than by total volatility, which is what the Sharpe Ratio uses."}
},
"Maximum Drawdown": {
  analogyHead:"The worst single fall from the highest point, not the average day.",
  analogy:"Like measuring a hiking trail not by its average elevation, but by the single steepest, scariest drop along the entire route, maximum drawdown captures the single worst peak-to-trough decline an investment has ever experienced.",
  example:["A fund's average annual return over ten years looks attractive at 15% a year.","But buried within that decade, the fund fell 45% from a peak during one particularly brutal stretch before eventually recovering.","An investor who bought near that peak and needed the money during the drawdown would have suffered a devastating loss, regardless of the eventual ten-year average.","A more risk-conscious investor uses the 45% maximum drawdown figure, not just the average return, to judge whether she could genuinely stomach holding through a similar future event."],
  exampleHead:"A great ten-year average return, hiding a brutal 45% fall.",
  exampleCallout:"Average return and maximum drawdown tell different stories",
  mistakes:[
    {think:"A strong long-term average return means an investment never had a bad stretch.", reality:"A great average can mask a severe drawdown somewhere along the way — maximum drawdown specifically measures that worst peak-to-trough decline, which the average return doesn't reveal at all."},
    {think:"Maximum drawdown predicts the worst possible future loss.", reality:"It's a historical measure — the worst decline that has already happened — not a guarantee about the worst decline that could still happen in the future."}
  ],
  related:["Sharpe Ratio","Beta","CAGR","Sortino Ratio"],
  quiz:{q:"What does maximum drawdown specifically measure that an average annual return figure doesn't?", options:["The total number of years an investment was held","The single worst peak-to-trough decline the investment has ever experienced, regardless of eventual recovery","The dividend yield paid during the holding period","The tax treatment of the investment"], correct:1, explain:"Maximum drawdown isolates the single worst historical decline from peak to trough — a figure that a smoothed average annual return can easily mask entirely."}
},
"YoY": {
  analogyHead:"Comparing this December to last December, not to last month.",
  analogy:"Like judging a beach resort's business by comparing this June to last June rather than to a quiet January, YoY (year-over-year) comparisons match the same period a year apart — filtering out predictable seasonal patterns.",
  example:["A retailer's December sales are always its highest month of the year, driven by holiday shopping.","Comparing December to November would make every December look like explosive growth, purely due to seasonality.","Instead, an analyst compares this December's sales to last December's sales — a genuine YoY comparison.","That YoY figure shows the retailer actually grew 8% this holiday season compared to the same period last year, a more meaningful measure of real progress."],
  exampleHead:"December vs. December, not December vs. November.",
  exampleCallout:"8% YoY growth — the real, seasonality-adjusted number",
  mistakes:[
    {think:"YoY comparisons are always the single best way to measure a company's progress.", reality:"YoY is excellent for stripping out seasonality, but it can be slower to reflect a sudden, recent change in a business's trajectory than a more frequent measure like MoM."},
    {think:"A strong YoY growth number always means the underlying business is accelerating right now.", reality:"YoY compares against a full year ago, so it can be skewed by unusual conditions in the prior-year comparison period itself — a weak prior year can make current performance look better than it genuinely is."}
  ],
  related:["MoM","EPS Growth","Horizontal Analysis","CAGR"],
  quiz:{q:"Why is a YoY comparison generally more useful than a month-over-month comparison for a seasonal retail business?", options:["YoY comparisons are always more accurate for every kind of business","YoY compares the same period a year apart, filtering out predictable seasonal swings that a shorter comparison would be distorted by","Month-over-month comparisons are illegal for public companies to report","YoY comparisons don't require any historical data"], correct:1, explain:"YoY specifically compares the same period a year apart — like December to last December — which cancels out predictable seasonal patterns that would otherwise distort a shorter-term comparison."}
},
"MoM": {
  analogyHead:"The fast, noisy read on what just happened.",
  analogy:"Like checking a shop's daily takings against yesterday's rather than waiting for the full year's numbers, MoM (month-over-month) comparisons catch short-term momentum quickly — at the cost of being noisier and easier to misread.",
  example:["A subscription business reports its user growth rose 15% MoM in a single month.","A quick read might suggest the business is suddenly accelerating dramatically.","A closer look reveals that specific month included a one-time marketing campaign that won't repeat, inflating that month's number.","An analyst checks the YoY trend alongside the MoM figure to confirm whether the growth is genuinely accelerating, or just a one-off spike."],
  exampleHead:"A 15% MoM spike, traced back to a one-time campaign.",
  exampleCallout:"Fast signal, needs a second check before trusting it",
  mistakes:[
    {think:"A single strong MoM figure reliably signals a genuine, lasting change in trend.", reality:"MoM data is noisy by nature — a single unusual event (a promotion, a holiday, a one-off order) can swing it sharply without reflecting any real underlying shift."},
    {think:"MoM comparisons are less useful than YoY comparisons in every situation.", reality:"MoM is genuinely valuable specifically because it's fast — for catching an emerging trend or problem early, before a full year's worth of YoY data would even be available to confirm it."}
  ],
  related:["YoY","EPS Growth","Horizontal Analysis","Bottom-Up Forecasting"],
  quiz:{q:"What's the main trade-off of using MoM data instead of YoY data?", options:["MoM data is always more expensive to obtain","MoM reacts faster to recent changes, but is noisier and more prone to being skewed by one-off events","MoM data is illegal to publish for public companies","There is no meaningful trade-off between the two"], correct:1, explain:"MoM's speed is its strength — catching recent shifts quickly — but that same short time window makes it more vulnerable to one-time events distorting the picture than the more stable, seasonality-adjusted YoY comparison."}
},
"EPS Growth": {
  analogyHead:"Is each existing slice of the pie actually getting bigger?",
  analogy:"Like checking whether each individual family member's slice of a pizza is growing, not just whether the whole pizza is, EPS growth tracks whether earnings attributable to each existing share are actually increasing, period over period.",
  example:["A company's total net profit grows 10% this year.","But it also issued 10% more new shares during the year to raise capital.","Its EPS growth is roughly flat, since the extra profit is now spread across a proportionally larger number of shares.","An investor who only looked at total profit growth would have missed that each individual existing share isn't actually earning any more than before."],
  exampleHead:"Profit grew 10%, but EPS growth was flat.",
  exampleCallout:"New shares diluted the per-share gain away",
  mistakes:[
    {think:"Total net profit growth and EPS growth always move together.", reality:"If a company issues new shares, total profit can grow while EPS growth stays flat or even falls, since the same (or slightly larger) profit is now divided among more shares."},
    {think:"EPS growth is the single most important number for judging a company.", reality:"It's an important and closely watched metric, but should be checked alongside cash flow and revenue quality — EPS can sometimes be boosted through accounting choices or buybacks rather than genuine operational improvement."}
  ],
  related:["ROI","Horizontal Analysis","Stock Buyback","YoY"],
  quiz:{q:"Why can a company's total profit grow while its EPS growth stays flat?", options:["This situation is mathematically impossible","If the company issued new shares during the period, the larger profit gets spread across more shares, keeping per-share earnings flat","EPS growth only applies to companies with no debt","Total profit and EPS are always identical numbers"], correct:1, explain:"EPS divides profit by share count — issuing new shares increases that share count, so total profit can rise while the per-share figure stays flat or even declines, due to dilution."}
},
"Cash Conversion Ratio": {
  analogyHead:"Is the reported profit actually sitting in the bank, or just on paper?",
  analogy:"Like a freelancer who's invoiced ₹1 lakh of work but only actually been paid ₹60,000 so far, the cash conversion ratio checks how much of a company's accounting profit has genuinely turned into real cash, rather than sitting uncollected.",
  example:["A company reports ₹100 crore in net profit for the year, a headline that looks strong.","Its actual operating cash flow for the same period is only ₹40 crore, giving it a cash conversion ratio of just 40%.","An investor digs deeper and finds much of the 'profit' is sitting in unpaid customer invoices (accounts receivable) that haven't actually been collected yet.","She flags this as a real risk: reported profit that hasn't yet become real cash is more fragile than profit that has."],
  exampleHead:"₹100 crore profit, only ₹40 crore actual cash.",
  exampleCallout:"60% of 'profit' is still sitting in unpaid invoices",
  mistakes:[
    {think:"Net profit and cash flow are effectively the same number.", reality:"Accounting profit can include revenue that's been recognized but not yet collected in cash — the cash conversion ratio specifically checks the gap between the two, which can reveal a real underlying problem."},
    {think:"A low cash conversion ratio always signals fraud or serious trouble.", reality:"It can be a genuine red flag, but some perfectly legitimate businesses (rapidly growing ones extending generous customer credit, for example) can also show a temporarily low ratio without anything being wrong."}
  ],
  related:["Cash Coverage Ratio","Accounts Receivable Turnover","EPS Growth","Dividend Coverage Ratio"],
  quiz:{q:"What does a low cash conversion ratio potentially signal about a company's reported profit?", options:["The company is definitely committing fraud","A meaningful portion of the reported profit may still be sitting in unpaid invoices rather than actual collected cash","The company has too much cash on its balance sheet","The company pays too much in dividends"], correct:1, explain:"A low cash conversion ratio flags a gap between reported accounting profit and actual cash collected — often because revenue was recognized before the corresponding cash was actually received from customers."}
},
"Cash Coverage Ratio": {
  analogyHead:"How many times over could you pay this month's rent from your paycheck?",
  analogy:"Like checking how many times your monthly salary alone could cover your rent, with room to spare, the cash coverage ratio checks how many times over a company's operating cash could pay the interest bill on its debt.",
  example:["A company generates ₹200 crore in EBITDA and pays ₹40 crore a year in interest on its debt.","Its cash coverage ratio is ₹200 crore divided by ₹40 crore = 5 times.","A more heavily indebted competitor generates similar EBITDA but pays ₹150 crore a year in interest, giving it a cash coverage ratio of just 1.3 times.","A credit analyst rates the second company's debt riskier, since a single bad quarter could leave it struggling to cover its interest obligations."],
  exampleHead:"Two similar companies, very different debt cushions.",
  exampleCallout:"5x coverage vs. a thin 1.3x cushion",
  mistakes:[
    {think:"Cash coverage ratio measures how much total debt a company has.", reality:"It specifically measures the cushion available to service the interest on that debt from operating cash flow — a company can have a lot of debt but still a comfortable cash coverage ratio if its operating cash flow is strong enough."},
    {think:"A cash coverage ratio near 1 is a minor, harmless detail.", reality:"A ratio close to 1 means operating cash flow barely covers interest payments — leaving essentially no cushion for a bad quarter, which credit analysts and lenders treat as a meaningful warning sign."}
  ],
  related:["Dividend Coverage Ratio","Credit Rating","Fixed Cost","Cash Conversion Ratio"],
  quiz:{q:"What does a cash coverage ratio close to 1 indicate about a company?", options:["The company has no debt at all","Operating cash flow barely covers interest payments, leaving little to no cushion for a downturn","The company is extremely profitable","The company pays no taxes"], correct:1, explain:"A ratio near 1 means operating cash flow only just covers the interest bill — a thin margin that leaves the company vulnerable to trouble servicing debt if a bad quarter reduces cash flow even modestly."}
},
"Dividend Coverage Ratio": {
  analogyHead:"How much slack is there before the dividend has to be cut?",
  analogy:"Like checking how many times your salary alone could cover a recurring monthly commitment you've promised to keep paying, the dividend coverage ratio checks how many times over a company's earnings could pay the dividend it just declared.",
  example:["A company earns ₹100 crore in net profit and pays out ₹80 crore in dividends, a dividend coverage ratio of 1.25 times.","A slower quarter causes profit to dip to ₹75 crore — below the ₹80 crore needed to maintain the same dividend.","The company either has to dip into cash reserves or cut the dividend to keep it sustainable.","An income-focused investor who relied on that dividend for regular cash flow sees her expected income disrupted by the coverage ratio's thin margin."],
  exampleHead:"A 1.25x cushion turns out not to be enough.",
  exampleCallout:"One weak quarter forces a dividend decision",
  mistakes:[
    {think:"A company will always keep paying its stated dividend regardless of the coverage ratio.", reality:"Dividends are a management decision, not a guarantee — a coverage ratio close to 1 (or below it) is a real warning sign that the current dividend may not be sustainable if earnings weaken."},
    {think:"A very high dividend coverage ratio is always the best outcome for shareholders.", reality:"An extremely high ratio can also mean a company is retaining most of its earnings rather than returning cash to shareholders — the 'right' level depends on the company's growth opportunities and investor expectations, not just safety alone."}
  ],
  related:["Cash Coverage Ratio","EPS Growth","Stock Buyback","Credit Rating"],
  quiz:{q:"What does a dividend coverage ratio close to 1 suggest?", options:["The dividend is extremely safe and unlikely to ever change","Earnings barely cover the current dividend, making it vulnerable to a cut if profit weakens","The company has no debt","The stock is undervalued"], correct:1, explain:"A ratio near 1 means the company's earnings only just cover its dividend obligation — leaving little room for profit to dip without forcing a dividend cut or a draw-down of cash reserves."}
},
"Accounts Receivable Turnover": {
  analogyHead:"How fast a business actually gets paid, not just how much it's owed.",
  analogy:"Like a freelancer who sends invoices constantly but has to chase clients for months to actually get paid, accounts receivable turnover measures how many times a year a company genuinely collects the money customers owe it.",
  example:["A company reports strong revenue growth, driven partly by extending generous 90-day payment terms to new customers to win their business.","Its accounts receivable turnover ratio drops noticeably compared to the prior year, since customers are now taking much longer to pay.","An analyst flags that rising revenue built on slower collections could eventually strain the company's own cash position, even while sales look healthy.","Sure enough, the company later needs to raise a working capital loan to bridge the gap between recognizing sales and actually collecting the cash."],
  exampleHead:"Generous payment terms boost sales, strain collections.",
  exampleCallout:"Falling turnover foreshadows a cash squeeze",
  mistakes:[
    {think:"Rising revenue always means a company's cash position is improving at the same pace.", reality:"If accounts receivable turnover is falling — meaning customers are taking longer to pay — rising revenue can mask a growing cash collection problem underneath the headline growth number."},
    {think:"A very high accounts receivable turnover is always unambiguously good.", reality:"Extremely high turnover (very fast collection) sometimes reflects overly strict payment terms that could be turning away otherwise-good customers who need a bit more flexibility — the ideal level is usually a balance, not an extreme."}
  ],
  related:["Cash Conversion Ratio","Cash Coverage Ratio","Horizontal Analysis","Operating Ratio"],
  quiz:{q:"What does a falling accounts receivable turnover ratio suggest is happening?", options:["The company's total revenue is shrinking","Customers are taking longer to actually pay what they owe, even if reported sales are rising","The company has paid off all its own debt","The company's stock price is about to rise"], correct:1, explain:"A falling turnover ratio means the company is collecting customer payments more slowly — a potential early warning sign of cash flow strain, even if headline revenue continues to look healthy."}
},
"Fixed Cost": {
  analogyHead:"The rent that's due whether the shop is packed or empty.",
  analogy:"Like paying the same monthly rent whether your shop had its best month ever or its worst, fixed costs stay the same no matter how much a company actually produces or sells.",
  example:["A factory pays ₹5 crore a year in rent, insurance, and base salaries, regardless of how many units it produces.","In a strong year, it produces 1 million units, spreading that ₹5 crore fixed cost to just ₹5 per unit.","In a weak year, it produces only 200,000 units, so the same ₹5 crore fixed cost now works out to ₹25 per unit.","The factory's profitability swings dramatically between the two years, purely due to how that fixed cost gets spread over very different production volumes."],
  exampleHead:"The same ₹5 crore fixed cost, spread very differently.",
  exampleCallout:"₹5 per unit in a strong year, ₹25 in a weak one",
  mistakes:[
    {think:"Fixed costs never change under any circumstances.", reality:"Fixed costs stay constant with respect to production volume in the short term, but they can still change over time — a lease renewal or a new hire changes the fixed cost base itself, just not in response to output levels."},
    {think:"A company with high fixed costs is always worse off than one with low fixed costs.", reality:"High fixed costs create high operating leverage — painful in a downturn when volume drops, but they can also mean disproportionately larger profit gains when volume rises, cutting both ways."}
  ],
  related:["Variable Cost","Marginal Cost","Operating Leverage","Operating Ratio"],
  quiz:{q:"What defines a fixed cost, as opposed to a variable cost?", options:["A cost that only occurs once a year","A cost that stays the same regardless of how much a company produces or sells, at least in the short term","A cost that only applies to manufacturing companies","A cost that changes every single month automatically"], correct:1, explain:"Fixed costs — rent, base salaries, insurance — remain constant regardless of production volume in the short term, unlike variable costs, which rise and fall directly with output."}
},
"Variable Cost": {
  analogyHead:"Ingredients that cost more only when you actually bake more cakes.",
  analogy:"Like a bakery only buying more flour and sugar when it's actually baking more cakes, variable costs rise and fall directly with how much a company actually produces — zero output, zero variable cost.",
  example:["A furniture maker's wood, fabric, and packaging costs rise and fall in direct proportion to how many chairs it makes each month.","In a slow month, it produces 500 chairs and spends ₹5 lakh on these variable inputs.","In a busy month, it produces 2,000 chairs, and variable costs scale up to roughly ₹20 lakh, staying proportional to output.","Unlike its fixed rent, these variable costs never become a burden during a slow month — they simply shrink right along with reduced production."],
  exampleHead:"Materials cost scales directly with chairs produced.",
  exampleCallout:"₹5 lakh at low volume, ₹20 lakh at high volume — always proportional",
  mistakes:[
    {think:"Variable costs are inherently riskier for a business than fixed costs.", reality:"Variable costs actually provide natural protection during a downturn, since they shrink automatically with reduced output — it's high fixed costs, which don't shrink with lower volume, that create more financial strain in a slowdown."},
    {think:"All of a company's costs are either purely fixed or purely variable.", reality:"Many real-world costs are actually a mix of both (semi-variable) — a sales team's base salary might be fixed, while their commissions are variable, both bundled into one cost line."}
  ],
  related:["Fixed Cost","Marginal Cost","Operating Leverage","Incremental Margin"],
  quiz:{q:"Why do variable costs provide a natural cushion during a business downturn?", options:["Variable costs are always tax-deductible, unlike fixed costs","They automatically shrink in proportion to reduced production, unlike fixed costs which stay constant regardless of volume","Variable costs are illegal to raise during a recession","They only apply to companies with no debt"], correct:1, explain:"Because variable costs scale directly with output, they shrink automatically when a company produces less — unlike fixed costs, which keep demanding the same payment regardless of how much volume has dropped."}
},
"Marginal Cost": {
  analogyHead:"The cost of baking just one more cookie, nothing else.",
  analogy:"Like figuring out exactly how much extra flour and butter it takes to bake one single additional cookie beyond the batch you're already making, marginal cost is the cost of producing just one more unit — nothing about the units already made.",
  example:["An airline has already committed to flying a specific route with a plane that's currently 70% full.","The marginal cost of selling one additional seat on that already-scheduled flight — extra fuel weight, a snack, nothing more — is very low.","The airline sells that seat at a discounted last-minute price, well below the average per-seat cost, because it still comfortably exceeds the marginal cost.","The airline profits on that discounted sale, even though the price looks 'too cheap' compared to a typical full-fare ticket."],
  exampleHead:"A discounted last-minute seat still clears marginal cost.",
  exampleCallout:"Cheap ticket, still profitable above marginal cost",
  mistakes:[
    {think:"Marginal cost and average cost per unit are the same number.", reality:"Average cost includes a share of fixed costs spread across all units already made; marginal cost only reflects the additional cost of one more unit — the two can differ substantially, especially in businesses with high fixed costs."},
    {think:"Selling below the normal price is always a loss-making decision.", reality:"As long as a price exceeds marginal cost, that sale adds to profit — which is exactly why airlines, hotels, and similar businesses can profitably sell steep last-minute discounts."}
  ],
  related:["Fixed Cost","Variable Cost","Operating Leverage","Incremental Margin"],
  quiz:{q:"Why can an airline profitably sell a heavily discounted last-minute seat on a flight that's already scheduled?", options:["Because airlines don't care about profit on individual seats","Because as long as the discounted price still exceeds the marginal cost of that one extra seat, the sale adds to profit","Because airlines are required by law to offer discounts","Because the flight would be cancelled otherwise"], correct:1, explain:"The marginal cost of one more seat on an already-scheduled flight is very low — so even a steeply discounted price can comfortably exceed that marginal cost and add pure profit to the flight."}
},
"Operating Leverage": {
  analogyHead:"How violently profit swings when sales move, based on your cost structure.",
  analogy:"Like a see-saw that swings wildly with a small push when weighted a certain way, but barely moves with the same push otherwise, operating leverage describes how much a company's profit swings for a given change in sales — driven by how fixed-cost-heavy its cost structure is.",
